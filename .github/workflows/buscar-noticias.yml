name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  buscar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser


      # ============================================================
      # 4. BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # ==========================================================
          # CONFIGURAÇÃO
          # ==========================================================

          ARQUIVO = "noticias.json"

          LIMITE_TOTAL = 8

          LIMITE_POR_FONTE = 8


          # ==========================================================
          # FONTES
          # ==========================================================

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "G1",
                  "tipo": "rss",
                  "url": "https://g1.globo.com/dynamo/pa/para/rss2.xml"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              }

          ]


          # ==========================================================
          # SESSÃO HTTP
          # ==========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7"

          })


          # ==========================================================
          # LIMPAR TEXTO
          # ==========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ==========================================================
          # NORMALIZAR URL
          # ==========================================================

          def normalizar_url(url, pagina):

              if not url:
                  return ""

              url = url.strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              return urljoin(
                  pagina,
                  url
              )


          # ==========================================================
          # ID DA NOTÍCIA
          # ==========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # BLOQUEIOS
          # ==========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              bloqueios = [

                  "mixvale",
                  "mix vale"

              ]

              return any(
                  palavra in texto
                  for palavra in bloqueios
              )


          # ==========================================================
          # EXTRAIR IMAGEM DA MATÉRIA
          # ==========================================================

          def extrair_imagem(link):

              print("")
              print("Imagem:", link)

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "HTTP imagem:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # ==================================================
                  # 1. OG IMAGE
                  # ==================================================

                  seletores_meta = [

                      ("property", "og:image"),
                      ("property", "og:image:url"),
                      ("name", "twitter:image"),
                      ("name", "twitter:image:src")

                  ]

                  for atributo, valor in seletores_meta:

                      meta = soup.find(
                          "meta",
                          attrs={
                              atributo: valor
                          }
                      )

                      if meta:

                          imagem = normalizar_url(
                              meta.get("content", ""),
                              resposta.url
                          )

                          if imagem:

                              print(
                                  "OK - OG/Twitter:",
                                  imagem
                              )

                              return imagem


                  # ==================================================
                  # 2. JSON-LD
                  # ==================================================

                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:

                      try:

                          if not script.string:
                              continue

                          dados = json.loads(
                              script.string
                          )

                          objetos = []

                          if isinstance(
                              dados,
                              dict
                          ):

                              objetos.append(
                                  dados
                              )

                              graph = dados.get(
                                  "@graph"
                              )

                              if isinstance(
                                  graph,
                                  list
                              ):

                                  objetos.extend(
                                      graph
                                  )

                          elif isinstance(
                              dados,
                              list
                          ):

                              objetos.extend(
                                  dados
                              )


                          for obj in objetos:

                              if not isinstance(
                                  obj,
                                  dict
                              ):
                                  continue

                              imagem = obj.get(
                                  "image"
                              )

                              if isinstance(
                                  imagem,
                                  str
                              ):

                                  imagem = normalizar_url(
                                      imagem,
                                      resposta.url
                                  )

                                  if imagem:

                                      print(
                                          "OK - JSON-LD:",
                                          imagem
                                      )

                                      return imagem


                              if isinstance(
                                  imagem,
                                  dict
                              ):

                                  imagem = (
                                      imagem.get("url")
                                      or imagem.get("contentUrl")
                                      or ""
                                  )

                                  imagem = normalizar_url(
                                      imagem,
                                      resposta.url
                                  )

                                  if imagem:

                                      print(
                                          "OK - JSON-LD:",
                                          imagem
                                      )

                                      return imagem


                              if isinstance(
                                  imagem,
                                  list
                              ):

                                  for item in imagem:

                                      if isinstance(
                                          item,
                                          str
                                      ):

                                          imagem = normalizar_url(
                                              item,
                                              resposta.url
                                          )

                                          if imagem:

                                              print(
                                                  "OK - JSON-LD:",
                                                  imagem
                                              )

                                              return imagem

                      except Exception:
                          continue


                  # ==================================================
                  # 3. IMAGEM DENTRO DO ARTICLE
                  # ==================================================

                  article = (
                      soup.find("article")
                      or soup.find("main")
                  )

                  if article:

                      imagens = article.find_all(
                          "img"
                      )

                      for img in imagens:

                          candidatos = [

                              img.get("src"),
                              img.get("data-src"),
                              img.get("data-original"),
                              img.get("data-lazy-src"),
                              img.get("data-srcset")

                          ]

                          for candidato in candidatos:

                              if not candidato:
                                  continue

                              # Caso seja srcset
                              if "," in candidato:

                                  candidato = candidato.split(
                                      ","
                                  )[0].strip()

                                  candidato = candidato.split(
                                      " "
                                  )[0]

                              imagem = normalizar_url(
                                  candidato,
                                  resposta.url
                              )

                              if not imagem:
                                  continue

                              if imagem.startswith(
                                  "data:"
                              ):
                                  continue

                              print(
                                  "OK - imagem artigo:",
                                  imagem
                              )

                              return imagem


                  # ==================================================
                  # 4. QUALQUER IMAGEM RELEVANTE
                  # ==================================================

                  for img in soup.find_all(
                      "img"
                  ):

                      candidatos = [

                          img.get("src"),
                          img.get("data-src"),
                          img.get("data-original"),
                          img.get("data-lazy-src"),
                          img.get("data-srcset")

                      ]

                      for candidato in candidatos:

                          if not candidato:
                              continue

                          if "," in candidato:

                              candidato = candidato.split(
                                  ","
                              )[0].strip()

                              candidato = candidato.split(
                                  " "
                              )[0]

                          imagem = normalizar_url(
                              candidato,
                              resposta.url
                          )

                          if not imagem:
                              continue

                          if imagem.startswith(
                              "data:"
                          ):
                              continue

                          print(
                              "OK - imagem:",
                              imagem
                          )

                          return imagem


              except Exception as erro:

                  print(
                      "Erro imagem:",
                      erro
                  )


              print(
                  "SEM IMAGEM"
              )

              return ""


          # ==========================================================
          # IMAGEM DO RSS
          # ==========================================================

          def imagem_rss(item):

              try:

                  media = item.get(
                      "media_content",
                      []
                  )

                  for item_media in media:

                      url = item_media.get(
                          "url"
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  media = item.get(
                      "media_thumbnail",
                      []
                  )

                  for item_media in media:

                      url = item_media.get(
                          "url"
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  html = (
                      item.get("summary", "")
                      or
                      item.get("description", "")
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find(
                      "img"
                  )

                  if img:

                      return (
                          img.get("src")
                          or
                          img.get("data-src")
                          or
                          ""
                      )

              except Exception:
                  pass


              return ""


          # ==========================================================
          # LER JSON EXISTENTE
          # ==========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []

              except Exception as erro:

                  print(
                      "Erro JSON:",
                      erro
                  )

                  antigas = []


          print("")
          print(
              "Notícias antigas:",
              len(antigas)
          )


          # ==========================================================
          # MAPA DE IMAGENS EXISTENTES
          # ==========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )

              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  .strip()
              )

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          # ==========================================================
          # RESULTADO
          # ==========================================================

          novas = []


          # ==========================================================
          # RSS
          # ==========================================================

          def buscar_rss(fonte):

              print("")
              print("=" * 60)
              print(
                  "FONTE RSS:",
                  fonte["nome"]
              )
              print("=" * 60)

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=25
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  feed = feedparser.parse(
                      resposta.content
                  )

                  resultado = []


                  for item in feed.entries[:
                      LIMITE_POR_FONTE
                  ]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = (
                          item.get(
                              "link",
                              ""
                          )
                          .strip()
                      )


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              ""
                          )
                      )


                      imagem = imagem_rss(
                          item
                      )


                      if imagem:

                          imagem = normalizar_url(
                              imagem,
                              link
                          )


                      # ==================================================
                      # SE RSS NÃO TROUXER IMAGEM,
                      # BUSCAR NA MATÉRIA
                      # ==================================================

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      if not imagem:

                          imagem = extrair_imagem(
                              link
                          )


                      noticia = {

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      }


                      resultado.append(
                          noticia
                      )


                      print(
                          "NOTÍCIA:",
                          titulo
                      )

                      print(
                          "IMAGEM:",
                          imagem
                      )


                  return resultado


              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )

                  return []


          # ==========================================================
          # PÁGINA
          # ==========================================================

          def buscar_pagina(fonte):

              print("")
              print("=" * 60)
              print(
                  "FONTE:",
                  fonte["nome"]
              )
              print("=" * 60)

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  resultado = []

                  vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if len(titulo) < 25:
                          continue

                      if len(titulo) > 180:
                          continue


                      link = normalizar_url(
                          href,
                          resposta.url
                      )


                      if not link:
                          continue


                      if link in vistos:
                          continue

                      vistos.add(
                          link
                      )


                      caminho = link.lower()


                      # ==================================================
                      # DOMÍNIO
                      # ==================================================

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in caminho:
                              continue


                      # ==================================================
                      # BLOQUEIOS
                      # ==================================================

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      bloqueios = [

                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo"

                      ]


                      if any(
                          bloqueio in caminho
                          for bloqueio in bloqueios
                      ):
                          continue


                      # ==================================================
                      # SOMENTE MATÉRIAS
                      # ==================================================

                      if fonte["nome"] == "O Liberal":

                          secoes = [

                              "/policia/",
                              "/para/",
                              "/belem/",
                              "/amazonia/",
                              "/politica/",
                              "/economia/",
                              "/esportes/",
                              "/entretenimento/",
                              "/mundo/",
                              "/brasil/",
                              "/tecnologia/",
                              "/cultura/",
                              "/saude/",
                              "/concursos/",
                              "/cotidiano/"

                          ]

                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):
                              continue


                      # ==================================================
                      # IMAGEM
                      # ==================================================

                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      if not imagem:

                          imagem = extrair_imagem(
                              link
                          )


                      noticia = {

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      }


                      resultado.append(
                          noticia
                      )


                      print(
                          "NOTÍCIA:",
                          titulo
                      )

                      print(
                          "IMAGEM:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_POR_FONTE:
                          break


                  return resultado


              except Exception as erro:

                  print(
                      "Erro página:",
                      erro
                  )

                  return []


          # ==========================================================
          # EXECUTAR FONTES
          # ==========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  encontrados = buscar_rss(
                      fonte
                  )

              else:

                  encontrados = buscar_pagina(
                      fonte
                  )

              novas.extend(
                  encontrados
              )


          print("")
          print("=" * 60)
          print(
              "TOTAL ENCONTRADO:",
              len(novas)
          )
          print("=" * 60)


          # ==========================================================
          # COMBINAR NOVAS + ANTIGAS
          # ==========================================================

          todas = novas + antigas


          # ==========================================================
          # REMOVER DUPLICADAS
          # ==========================================================

          unicas = {}


          for noticia in todas:

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
                  .lower()
              )


              chave = link or titulo


              if not chave:
                  continue


              if chave not in unicas:

                  unicas[chave] = noticia

              else:

                  atual = unicas[chave]

                  imagem_atual = (
                      atual.get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )

                  imagem_nova = (
                      noticia.get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )


                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      atual["imagem"] = (
                          imagem_nova
                      )


          todas = list(
              unicas.values()
          )


          # ==========================================================
          # TENTAR RECUPERAR IMAGENS VAZIAS
          # ==========================================================

          for noticia in todas:

              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  .strip()
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )


              if imagem:
                  continue


              imagem_antiga = (
                  imagens_antigas.get(
                      link,
                      ""
                  )
              )


              if imagem_antiga:

                  noticia["imagem"] = (
                      imagem_antiga
                  )


          # ==========================================================
          # ORDENAR POR DATA
          # ==========================================================

          todas.sort(

              key=lambda noticia:
                  noticia.get(
                      "data",
                      ""
                  ),

              reverse=True

          )


          # ==========================================================
          # LIMITAR
          # ==========================================================

          resultado = todas[
              :LIMITE_TOTAL
          ]


          # ==========================================================
          # SALVAR
          # ==========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================================
          # RELATÓRIO FINAL
          # ==========================================================

          print("")
          print("=" * 60)
          print("RESULTADO FINAL")
          print("=" * 60)

          print(
              "Notícias encontradas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print("")


          for noticia in resultado:

              print(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "LINK:",
                  noticia.get(
                      "link",
                      ""
                  )
              )

              print(
                  "IMAGEM:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )

              print("-" * 60)


          PY


      # ============================================================
      # 5. SALVAR NO GITHUB
      # ============================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email \
            "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit \
              -m "Atualizar notícias"

            git push

          fi
