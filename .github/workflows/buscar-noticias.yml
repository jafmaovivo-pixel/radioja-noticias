name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        shell: python
        run: |
          import json
          import os
          import re
          import time
          import hashlib
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          ARQUIVO = "noticias.json"

          # ---------------------------------------------------------
          # CONFIGURAÇÃO
          # ---------------------------------------------------------

          QUANTIDADE_MAXIMA = 8

          CONSULTAS = [
              "Pará",
              "Belém Pará",
              "Ananindeua Pará",
              "Tomé-Açu Pará",
              "Bragança Pará",
              "Capanema Pará",
              "Castanhal Pará",
              "Marituba Pará",
              "Paragominas Pará",
              "Abaetetuba Pará",
              "Brasil"
          ]

          # Fontes que não devem aparecer
          FONTES_BLOQUEADAS = [
              "mix vale",
              "mixvale"
          ]

          # Domínios que não devem aparecer
          DOMINIOS_BLOQUEADOS = [
              "mixvale.com.br",
              "mixvale"
          ]

          # ---------------------------------------------------------
          # FUNÇÕES
          # ---------------------------------------------------------

          def limpar_texto(texto):
              if not texto:
                  return ""

              texto = re.sub(r"<[^>]+>", "", texto)
              texto = re.sub(r"\s+", " ", texto)
              return texto.strip()


          def gerar_id(link, titulo):
              base = (link or titulo or "").encode("utf-8")
              return hashlib.md5(base).hexdigest()


          def buscar_url(url, tentativas=4):
              """
              Faz a requisição com User-Agent e tratamento de HTTP 429.
              """

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/131.0 Safari/537.36"
                  ),
                  "Accept": (
                      "application/rss+xml, "
                      "application/xml, "
                      "text/xml, "
                      "*/*"
                  ),
                  "Accept-Language": "pt-BR,pt;q=0.9"
              }

              for tentativa in range(tentativas):

                  try:

                      requisicao = urllib.request.Request(
                          url,
                          headers=headers
                      )

                      with urllib.request.urlopen(
                          requisicao,
                          timeout=20
                      ) as resposta:

                          return resposta.read()

                  except urllib.error.HTTPError as erro:

                      if erro.code == 429:

                          espera = 5 * (tentativa + 1)

                          print(
                              f"HTTP 429 recebido. "
                              f"Aguardando {espera}s..."
                          )

                          time.sleep(espera)
                          continue

                      print(
                          f"HTTP {erro.code} ao acessar {url}"
                      )

                      return None

                  except Exception as erro:

                      print(
                          f"Erro ao acessar {url}: {erro}"
                      )

                      if tentativa < tentativas - 1:
                          time.sleep(3)

              return None


          def extrair_texto(elemento, nomes):

              for nome in nomes:

                  encontrado = elemento.find(nome)

                  if encontrado is not None and encontrado.text:
                      return limpar_texto(encontrado.text)

              return ""


          def extrair_link(item):

              link = item.find("link")

              if link is not None:

                  if link.text:
                      return link.text.strip()

                  href = link.attrib.get("href")

                  if href:
                      return href.strip()

              return ""


          def extrair_imagem(item):

              # media:content
              for elemento in item.iter():

                  tag = elemento.tag.lower()

                  if (
                      tag.endswith("content")
                      or tag.endswith("thumbnail")
                      or tag.endswith("image")
                  ):

                      url = elemento.attrib.get("url")

                      if url:
                          return url

              # enclosure
              enclosure = item.find("enclosure")

              if enclosure is not None:

                  url = enclosure.attrib.get("url")

                  if url:
                      return url

              # descrição contendo imagem
              descricao = extrair_texto(
                  item,
                  ["description"]
              )

              if descricao:

                  encontrado = re.search(
                      r'https?://[^"\']+\.(?:jpg|jpeg|png|webp)',
                      descricao,
                      re.IGNORECASE
                  )

                  if encontrado:
                      return encontrado.group(0)

              return ""


          def fonte_bloqueada(fonte, link):

              fonte_lower = (fonte or "").lower()
              link_lower = (link or "").lower()

              for termo in FONTES_BLOQUEADAS:

                  if termo in fonte_lower:
                      return True

              for dominio in DOMINIOS_BLOQUEADOS:

                  if dominio in link_lower:
                      return True

              return False


          def processar_feed(xml, consulta):

              noticias = []

              try:

                  raiz = ET.fromstring(xml)

              except Exception as erro:

                  print(
                      f"Erro ao interpretar RSS de '{consulta}': {erro}"
                  )

                  return noticias

              # RSS tradicional
              itens = raiz.findall(".//item")

              # Atom
              if not itens:
                  itens = raiz.findall(
                      ".//{http://www.w3.org/2005/Atom}entry"
                  )

              for item in itens:

                  titulo = extrair_texto(
                      item,
                      [
                          "title",
                          "{http://www.w3.org/2005/Atom}title"
                      ]
                  )

                  link = extrair_link(item)

                  descricao = extrair_texto(
                      item,
                      [
                          "description",
                          "summary",
                          "{http://www.w3.org/2005/Atom}summary"
                      ]
                  )

                  data = extrair_texto(
                      item,
                      [
                          "pubDate",
                          "published",
                          "updated",
                          "{http://www.w3.org/2005/Atom}published",
                          "{http://www.w3.org/2005/Atom}updated"
                      ]
                  )

                  imagem = extrair_imagem(item)

                  if not titulo or not link:
                      continue

                  # RSS do Google News costuma fornecer
                  # o nome da fonte no título/descrição.
                  fonte = "Rádio JA FM"

                  noticia = {
                      "id": gerar_id(link, titulo),
                      "titulo": titulo,
                      "descricao": descricao,
                      "link": link,
                      "fonte": fonte,
                      "imagem": imagem,
                      "data": data,
                      "categoria": "PARÁ"
                  }

                  if not fonte_bloqueada(
                      noticia["fonte"],
                      noticia["link"]
                  ):
                      noticias.append(noticia)

              return noticias


          # ---------------------------------------------------------
          # LER ARQUIVO ATUAL
          # ---------------------------------------------------------

          noticias_antigas = []

          if os.path.exists(ARQUIVO):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(arquivo)

                      if isinstance(
                          dados.get("noticias"),
                          list
                      ):
                          noticias_antigas = dados["noticias"]

              except Exception as erro:

                  print(
                      f"Não foi possível ler noticias.json: {erro}"
                  )


          # ---------------------------------------------------------
          # BUSCAR NOTÍCIAS
          # ---------------------------------------------------------

          noticias_novas = []

          for consulta in CONSULTAS:

              print("")
              print("=" * 60)
              print(f"Consultando: {consulta}")
              print("=" * 60)

              parametros = urllib.parse.urlencode({
                  "q": consulta,
                  "hl": "pt-BR",
                  "gl": "BR",
                  "ceid": "BR:pt-419"
              })

              url = (
                  "https://news.google.com/rss/search?"
                  + parametros
              )

              xml = buscar_url(url)

              if not xml:

                  print(
                      f"Não foi possível consultar: {consulta}"
                  )

                  # Pequena pausa para evitar excesso de requisições
                  time.sleep(2)
                  continue

              encontrados = processar_feed(
                  xml,
                  consulta
              )

              print(
                  f"Encontradas: {len(encontrados)}"
              )

              noticias_novas.extend(encontrados)

              # Evita disparar várias requisições seguidas
              time.sleep(2)


          # ---------------------------------------------------------
          # REMOVER DUPLICADAS
          # ---------------------------------------------------------

          todas = []

          vistos = set()

          # Notícias novas primeiro
          for noticia in noticias_novas:

              chave = (
                  noticia.get("link")
                  or noticia.get("titulo")
                  or noticia.get("id")
              )

              if chave in vistos:
                  continue

              vistos.add(chave)
              todas.append(noticia)


          # Depois preserva notícias antigas
          # caso alguma consulta tenha falhado.
          for noticia in noticias_antigas:

              chave = (
                  noticia.get("link")
                  or noticia.get("titulo")
                  or noticia.get("id")
              )

              if chave in vistos:
                  continue

              if fonte_bloqueada(
                  noticia.get("fonte", ""),
                  noticia.get("link", "")
              ):
                  continue

              vistos.add(chave)
              todas.append(noticia)


          # ---------------------------------------------------------
          # ORDENAR POR DATA
          # ---------------------------------------------------------

          def data_valor(noticia):

              valor = noticia.get("data", "")

              if not valor:
                  return ""

              return valor


          todas.sort(
              key=data_valor,
              reverse=True
          )


          # ---------------------------------------------------------
          # PEGAR SOMENTE 8
          # ---------------------------------------------------------

          noticias_finais = todas[
              :QUANTIDADE_MAXIMA
          ]


          # ---------------------------------------------------------
          # SE NÃO CONSEGUIU NADA, PRESERVAR O JSON
          # ---------------------------------------------------------

          if len(noticias_finais) == 0:

              print("")
              print(
                  "ERRO: nenhuma notícia encontrada."
              )
              print(
                  "O noticias.json existente será preservado."
              )

              if noticias_antigas:

                  noticias_finais = noticias_antigas[
                      :QUANTIDADE_MAXIMA
                  ]

              else:

                  # Não derruba o workflow.
                  noticias_finais = []


          # ---------------------------------------------------------
          # GERAR JSON
          # ---------------------------------------------------------

          resultado = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),
              "noticias": noticias_finais
          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("=" * 60)
          print(
              f"Total de notícias salvas: "
              f"{len(noticias_finais)}"
          )
          print("=" * 60)


      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio JA FM"
          git config user.email "radiojafm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas notícias."
          else
            git commit -m "Atualizar notícias"
            git push
          fi

      - name: Finalizar
        run: |
          echo "Busca de notícias concluída."
          echo "Arquivo noticias.json atualizado."
