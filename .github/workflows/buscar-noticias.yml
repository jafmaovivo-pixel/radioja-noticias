name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4


      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # ==========================================================
          # CONFIGURAÇÃO
          # ==========================================================

          ARQUIVO = "noticias.json"

          LIMITE_FINAL = 8

          LIMITE_POR_FONTE = 8


          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "rss": "https://diariodopara.com.br/feed/",
                  "dominio": "diariodopara.com.br"
              },

              {
                  "nome": "O Liberal",
                  "rss": "https://www.oliberal.com/rss",
                  "dominio": "oliberal.com"
              },

              {
                  "nome": "G1",
                  "rss": "https://g1.globo.com/dynamo/pa/para/rss2.xml",
                  "dominio": "g1.globo.com"
              }

          ]


          # ==========================================================
          # SESSÃO HTTP
          # ==========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36",

              "Accept":
              "text/html,application/xhtml+xml,"
              "application/xml;q=0.9,image/avif,image/webp,"
              "*/*;q=0.8",

              "Accept-Language":
              "pt-BR,pt;q=0.9,en;q=0.8"

          })


          # ==========================================================
          # LIMPAR TEXTO
          # ==========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ==========================================================
          # ID
          # ==========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # BLOQUEAR MIX VALE
          # ==========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              return (
                  "mixvale" in texto
                  or "mix vale" in texto
              )


          # ==========================================================
          # NORMALIZAR URL
          # ==========================================================

          def normalizar_url(url, pagina):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("/"):
                  return urljoin(
                      pagina,
                      url
                  )

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              return urljoin(
                  pagina,
                  url
              )


          # ==========================================================
          # VALIDAR URL DE IMAGEM
          # ==========================================================

          def imagem_valida(url):

              if not url:
                  return False

              texto = url.lower()

              bloqueios = [

                  "logo",
                  "avatar",
                  "icon",
                  "favicon",
                  "sprite",
                  "pixel",
                  "placeholder",
                  "advertisement",
                  "adsystem"

              ]

              for palavra in bloqueios:

                  if palavra in texto:
                      return False

              return True


          # ==========================================================
          # EXTRAIR IMAGEM DO RSS
          # ==========================================================

          def imagem_do_rss(item, pagina):

              # ------------------------------------------------------
              # media_content
              # ------------------------------------------------------

              try:

                  medias = item.get(
                      "media_content",
                      []
                  )

                  for media in medias:

                      if not isinstance(
                          media,
                          dict
                      ):
                          continue

                      url = (
                          media.get("url")
                          or media.get("href")
                          or ""
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if imagem_valida(url):
                          return url

              except Exception:
                  pass


              # ------------------------------------------------------
              # media_thumbnail
              # ------------------------------------------------------

              try:

                  medias = item.get(
                      "media_thumbnail",
                      []
                  )

                  for media in medias:

                      if not isinstance(
                          media,
                          dict
                      ):
                          continue

                      url = media.get(
                          "url",
                          ""
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if imagem_valida(url):
                          return url

              except Exception:
                  pass


              # ------------------------------------------------------
              # ENCLOSURE
              # ------------------------------------------------------

              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      if not isinstance(
                          enclosure,
                          dict
                      ):
                          continue

                      tipo = (
                          enclosure.get(
                              "type",
                              ""
                          )
                          or ""
                      ).lower()

                      url = (
                          enclosure.get(
                              "href"
                          )
                          or enclosure.get(
                              "url"
                          )
                          or ""
                      )

                      if (
                          "image" in tipo
                          or url.lower().endswith(
                              (
                                  ".jpg",
                                  ".jpeg",
                                  ".png",
                                  ".webp"
                              )
                          )
                      ):

                          url = normalizar_url(
                              url,
                              pagina
                          )

                          if imagem_valida(url):
                              return url

              except Exception:
                  pass


              # ------------------------------------------------------
              # HTML DA DESCRIÇÃO
              # ------------------------------------------------------

              try:

                  html = (
                      item.get(
                          "summary",
                          ""
                      )
                      or
                      item.get(
                          "description",
                          ""
                      )
                      or ""
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  for img in soup.find_all(
                      "img"
                  ):

                      url = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get(
                              "data-original"
                          )
                          or img.get(
                              "data-lazy-src"
                          )
                          or ""
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if imagem_valida(url):
                          return url

              except Exception:
                  pass


              return ""


          # ==========================================================
          # JSON-LD
          # ==========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          texto = script.get_text()

                      if not texto:
                          continue

                      dados = json.loads(
                          texto
                      )

                  except Exception:
                      continue


                  objetos = []


                  if isinstance(
                      dados,
                      dict
                  ):

                      objetos.append(
                          dados
                      )

                      graph = dados.get(
                          "@graph"
                      )

                      if isinstance(
                          graph,
                          list
                      ):

                          objetos.extend(
                              graph
                          )


                  elif isinstance(
                      dados,
                      list
                  ):

                      objetos.extend(
                          dados
                      )


                  for obj in objetos:

                      if not isinstance(
                          obj,
                          dict
                      ):
                          continue


                      imagem = obj.get(
                          "image"
                      )


                      if isinstance(
                          imagem,
                          str
                      ):

                          url = normalizar_url(
                              imagem,
                              pagina
                          )

                          if imagem_valida(url):
                              return url


                      if isinstance(
                          imagem,
                          dict
                      ):

                          url = (
                              imagem.get(
                                  "url"
                              )
                              or
                              imagem.get(
                                  "contentUrl"
                              )
                              or ""
                          )

                          url = normalizar_url(
                              url,
                              pagina
                          )

                          if imagem_valida(url):
                              return url


                      if isinstance(
                          imagem,
                          list
                      ):

                          for item in imagem:

                              if isinstance(
                                  item,
                                  str
                              ):

                                  url = normalizar_url(
                                      item,
                                      pagina
                                  )

                                  if imagem_valida(
                                      url
                                  ):
                                      return url


                              elif isinstance(
                                  item,
                                  dict
                              ):

                                  url = (
                                      item.get(
                                          "url"
                                      )
                                      or
                                      item.get(
                                          "contentUrl"
                                      )
                                      or ""
                                  )

                                  url = normalizar_url(
                                      url,
                                      pagina
                                  )

                                  if imagem_valida(
                                      url
                                  ):
                                      return url


              return ""


          # ==========================================================
          # OG IMAGE / TWITTER / HTML
          # ==========================================================

          def extrair_imagem_pagina(link):

              print(
                  "      procurando imagem em:",
                  link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=20,
                      allow_redirects=True
                  )

                  print(
                      "      HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # --------------------------------------------------
                  # OG IMAGE
                  # --------------------------------------------------

                  seletores = [

                      (
                          "meta",
                          {
                              "property":
                              "og:image"
                          }
                      ),

                      (
                          "meta",
                          {
                              "property":
                              "og:image:url"
                          }
                      ),

                      (
                          "meta",
                          {
                              "name":
                              "twitter:image"
                          }
                      ),

                      (
                          "meta",
                          {
                              "name":
                              "twitter:image:src"
                          }
                      )

                  ]


                  for tag, attrs in seletores:

                      meta = soup.find(
                          tag,
                          attrs=attrs
                      )

                      if meta:

                          url = (
                              meta.get(
                                  "content"
                              )
                              or ""
                          )

                          url = normalizar_url(
                              url,
                              link
                          )

                          if imagem_valida(url):

                              print(
                                  "      imagem OG:",
                                  url
                              )

                              return url


                  # --------------------------------------------------
                  # JSON-LD
                  # --------------------------------------------------

                  url = imagem_jsonld(
                      soup,
                      link
                  )

                  if url:

                      print(
                          "      imagem JSON-LD:",
                          url
                      )

                      return url


                  # --------------------------------------------------
                  # IMAGEM DENTRO DO ARTICLE
                  # --------------------------------------------------

                  article = (
                      soup.find(
                          "article"
                      )
                      or
                      soup.find(
                          "main"
                      )
                  )


                  if article:

                      imagens = article.find_all(
                          "img"
                      )

                      for img in imagens:

                          url = (
                              img.get(
                                  "src"
                              )
                              or
                              img.get(
                                  "data-src"
                              )
                              or
                              img.get(
                                  "data-original"
                              )
                              or
                              img.get(
                                  "data-lazy-src"
                              )
                              or
                              img.get(
                                  "data-lazy"
                              )
                              or ""
                          )

                          url = normalizar_url(
                              url,
                              link
                          )

                          if imagem_valida(url):

                              print(
                                  "      imagem article:",
                                  url
                              )

                              return url


                  # --------------------------------------------------
                  # QUALQUER IMG
                  # --------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      url = (
                          img.get(
                              "src"
                          )
                          or
                          img.get(
                              "data-src"
                          )
                          or
                          img.get(
                              "data-original"
                          )
                          or
                          img.get(
                              "data-lazy-src"
                          )
                          or ""
                      )

                      url = normalizar_url(
                          url,
                          link
                      )

                      if imagem_valida(url):

                          print(
                              "      imagem HTML:",
                              url
                          )

                          return url


              except Exception as erro:

                  print(
                      "      erro imagem:",
                      erro
                  )


              return ""


          # ==========================================================
          # LER JSON EXISTENTE
          # ==========================================================

          antigas = []


          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []

              except Exception as erro:

                  print(
                      "Erro lendo JSON:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # ==========================================================
          # MAPAS
          # ==========================================================

          imagens_antigas = {}

          noticias_antigas = {}


          for noticia in antigas:

              if not isinstance(
                  noticia,
                  dict
              ):
                  continue


              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()


              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or ""
              ).strip()


              if link:

                  noticias_antigas[
                      link
                  ] = noticia


                  if imagem:

                      imagens_antigas[
                          link
                      ] = imagem


          # ==========================================================
          # BUSCAR RSS
          # ==========================================================

          novas = []


          for fonte in FONTES:

              print("")
              print(
                  "================================================"
              )

              print(
                  "FONTE:",
                  fonte["nome"]
              )

              print(
                  "================================================"
              )


              try:

                  resposta = sessao.get(
                      fonte["rss"],
                      timeout=30
                  )


                  print(
                      "RSS HTTP:",
                      resposta.status_code
                  )


                  if resposta.status_code != 200:

                      print(
                          "RSS indisponível."
                      )

                      continue


                  feed = feedparser.parse(
                      resposta.content
                  )


                  print(
                      "Itens RSS:",
                      len(feed.entries)
                  )


                  contador = 0


                  for item in feed.entries:

                      if contador >= LIMITE_POR_FONTE:
                          break


                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )


                      link = (
                          item.get(
                              "link",
                              ""
                          )
                          or ""
                      ).strip()


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      # ------------------------------------------------
                      # IMAGEM
                      # ------------------------------------------------

                      imagem = imagem_do_rss(
                          item,
                          link
                      )


                      # ------------------------------------------------
                      # SE NÃO TEM IMAGEM NO RSS,
                      # BUSCAR NA MATÉRIA ORIGINAL
                      # ------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # ------------------------------------------------
                      # DESCRIÇÃO
                      # ------------------------------------------------

                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      # ------------------------------------------------
                      # DATA
                      # ------------------------------------------------

                      data = ""

                      try:

                          if item.get(
                              "published_parsed"
                          ):

                              data = datetime.fromtimestamp(
                                  time.mktime(
                                      item.published_parsed
                                  ),
                                  timezone.utc
                              ).isoformat()

                      except Exception:
                          pass


                      if not data:

                          try:

                              if item.get(
                                  "updated_parsed"
                              ):

                                  data = datetime.fromtimestamp(
                                      time.mktime(
                                          item.updated_parsed
                                      ),
                                      timezone.utc
                                  ).isoformat()

                          except Exception:
                              pass


                      if not data:

                          data = datetime.now(
                              timezone.utc
                          ).isoformat()


                      # ------------------------------------------------
                      # NOTÍCIA
                      # ------------------------------------------------

                      noticia = {

                          "id":
                          criar_id(
                              titulo,
                              link
                          ),

                          "titulo":
                          titulo,

                          "descricao":
                          descricao,

                          "link":
                          link,

                          "fonte":
                          fonte["nome"],

                          "imagem":
                          imagem,

                          "data":
                          data,

                          "categoria":
                          "PARÁ"

                      }


                      novas.append(
                          noticia
                      )


                      contador += 1


                      print("")
                      print(
                          "Notícia:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


          # ==========================================================
          # COMBINAR NOVAS + ANTIGAS
          # ==========================================================

          todas = novas + antigas


          unicas = {}


          for noticia in todas:

              if not isinstance(
                  noticia,
                  dict
              ):
                  continue


              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()


              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  or ""
              ).strip()


              chave = link or titulo


              if not chave:
                  continue


              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or ""
              ).strip()


              # -------------------------------------------------------
              # Se a notícia já existe e tem imagem,
              # NÃO substituir por versão sem imagem.
              # -------------------------------------------------------

              if chave in unicas:

                  imagem_existente = (
                      unicas[chave].get(
                          "imagem",
                          ""
                      )
                      or ""
                  ).strip()


                  if (
                      not imagem_existente
                      and imagem
                  ):

                      unicas[chave] = noticia

              else:

                  unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # ==========================================================
          # GARANTIR IMAGENS ANTIGAS
          # ==========================================================

          for noticia in todas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()


              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or ""
              ).strip()


              if (
                  not imagem
                  and link
                  and link in imagens_antigas
              ):

                  noticia["imagem"] = (
                      imagens_antigas[
                          link
                      ]
                  )


          # ==========================================================
          # ORDENAR
          # ==========================================================

          def chave_data(noticia):

              return (
                  noticia.get(
                      "data",
                      ""
                  )
                  or ""
              )


          todas.sort(
              key=chave_data,
              reverse=True
          )


          # ==========================================================
          # PEGAR 8
          # ==========================================================

          resultado = todas[
              :LIMITE_FINAL
          ]


          # ==========================================================
          # SALVAR
          # ==========================================================

          dados_finais = {

              "atualizado":
              datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias":
              resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================================
          # RELATÓRIO FINAL
          # ==========================================================

          print("")
          print(
              "================================================"
          )

          print(
              "PROCESSO FINALIZADO"
          )

          print(
              "================================================"
          )

          print(
              "Total gravado:",
              len(resultado)
          )

          print("")


          for noticia in resultado:

              print(
                  "-----------------------------------------------"
              )

              print(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "Fonte:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "Imagem:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )


          PY


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar notícias"
            git push
          fi
