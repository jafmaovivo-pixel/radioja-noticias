name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["NEWSDATA_API_KEY"]
          API_URL = "https://newsdata.io/api/1/latest"

          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          BLOQUEADOS = [
              "mix vale",
              "mixvale"
          ]

          # Locais que consideramos realmente regionais
          TOME_ACU = [
              "tomé-açu",
              "tomé açu",
              "tome-acu",
              "tome acu"
          ]

          BELEM_RMB = [
              "belém",
              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do pará",
              "santa izabel do para",
              "santa bárbara do pará",
              "santa barbara do para"
          ]

          NORDESTE_PARA = [
              "castanhal",
              "bragança",
              "braganca",
              "capanema",
              "salinópolis",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cametá",
              "cameta",
              "vigia",
              "capitão poço",
              "capitao poco",
              "igarapé-açu",
              "igarape-acu"
          ]

          PARA = [
              "pará",
              "paraense",
              "paraenses",
              "estado do pará",
              "estado do para",
              "governo do pará",
              "governo do para",
              "belém",
              "belem"
          ]

          # Cidades/estados que NÃO queremos considerar
          # como notícia regional do Pará.
          OUTRAS_REGIOES = [
              "bahia",
              "salvador",
              "são paulo",
              "sao paulo",
              "rio de janeiro",
              "rio de janeiro",
              "minas gerais",
              "pernambuco",
              "recife",
              "ceará",
              "ceara",
              "paraná",
              "parana",
              "rio grande do sul",
              "brasília",
              "brasilia",
              "goiás",
              "goias",
              "amazonas",
              "acre",
              "rondônia",
              "rondonia",
              "mato grosso",
              "mato grosso do sul",
              "espírito santo",
              "espirito santo",
              "santa catarina"
          ]

          def normalizar(texto):
              if not texto:
                  return ""

              texto = texto.lower()

              return texto


          def buscar(consulta):

              parametros = {
                  "apikey": API_KEY,
                  "country": "br",
                  "language": "pt",
                  "q": consulta
              }

              url = (
                  API_URL +
                  "?" +
                  urllib.parse.urlencode(parametros)
              )

              try:

                  requisicao = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadioJA-FM-News/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      requisicao,
                      timeout=30
                  ) as resposta:

                      dados = json.loads(
                          resposta.read().decode("utf-8")
                      )

                  return dados.get("results", [])

              except Exception as erro:

                  print("ERRO NA BUSCA:", erro)
                  return []


          def texto_noticia(item):

              return normalizar(
                  " ".join([
                      item.get("title") or "",
                      item.get("description") or ""
                  ])
              )


          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = (
                  titulo + " " +
                  descricao + " " +
                  fonte
              )

              for termo in BLOQUEADOS:

                  if termo in texto:
                      return True

              if "mixvale.com.br" in link:
                  return True

              return False


          def pertence_ao_grupo(item, termos):

              texto = texto_noticia(item)

              for termo in termos:

                  if termo in texto:
                      return True

              return False


          def valido(item):

              if not item.get("title"):
                  return False

              if not item.get("link"):
                  return False

              if bloqueada(item):
                  return False

              return True


          def converter(item):

              return {
                  "id": item.get("article_id"),
                  "titulo": item.get("title"),
                  "descricao": item.get("description"),
                  "link": item.get("link"),
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate")
              }


          # =====================================================
          # COLETAR MUITAS NOTÍCIAS
          # =====================================================

          consultas = [

              # Tomé-Açu
              '"Tomé-Açu"',

              # Belém / RMB
              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',

              # Nordeste do Pará
              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',

              # Pará
              '"Pará"',
              '"governo do Pará"',
              '"polícia do Pará"',

              # Brasil
              '"Brasil"'
          ]


          candidatos = {}

          for consulta in consultas:

              print("")
              print("BUSCANDO:", consulta)

              resultados = buscar(consulta)

              print(
                  "RESULTADOS:",
                  len(resultados)
              )

              for item in resultados:

                  if not valido(item):
                      continue

                  link = (
                      item.get("link") or ""
                  ).strip()

                  if not link:
                      continue

                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []
          belem = []
          nordeste = []
          para = []
          brasil = []


          for item in candidatos.values():

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):
                  tome_acu.append(item)

              elif pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):
                  belem.append(item)

              elif pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):
                  nordeste.append(item)

              elif pertence_ao_grupo(
                  item,
                  PARA
              ):
                  para.append(item)

              else:
                  brasil.append(item)


          print("")
          print("CLASSIFICAÇÃO")
          print(
              "Tomé-Açu:",
              len(tome_acu)
          )
          print(
              "Belém/RMB:",
              len(belem)
          )
          print(
              "Nordeste do Pará:",
              len(nordeste)
          )
          print(
              "Pará:",
              len(para)
          )
          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS POR TÍTULO
          # =====================================================

          titulos_usados = set()
          links_usados = set()
          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(titulo)

              titulo = re.sub(
                  r"[^a-z0-9áéíóúãõâêôç ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          def adicionar(item, categoria):

              if len(noticias) >= 8:
                  return False

              link = (
                  item.get("link") or ""
              ).strip()

              titulo = titulo_normalizado(
                  item.get("title") or ""
              )

              if link in links_usados:
                  return False

              if titulo in titulos_usados:
                  return False

              links_usados.add(link)
              titulos_usados.add(titulo)

              noticia = converter(item)

              noticias.append(noticia)

              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"
              )

              return True


          # =====================================================
          # ORDEM DE PRIORIDADE
          # =====================================================

          # 1. TOMÉ-AÇU
          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):
                  break


          # 2. BELÉM / RMB
          for item in belem:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "BELÉM/RMB"
              )

              # máximo recomendado de 2
              if sum(
                  1 for n in noticias
                  if pertence_ao_grupo(
                      {
                          "title": n["titulo"],
                          "description": n["descricao"]
                      },
                      BELEM_RMB
                  )
              ) >= 2:
                  break


          # 3. NORDESTE DO PARÁ
          contador_nordeste = 0

          for item in nordeste:

              if len(noticias) >= 8:
                  break

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):
                  contador_nordeste += 1

              if contador_nordeste >= 2:
                  break


          # 4. OUTRAS NOTÍCIAS DO PARÁ
          for item in para:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "PARÁ"
              )


          # 5. BRASIL PARA COMPLETAR
          for item in brasil:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR
          # =====================================================

          resultado = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias": noticias[:8]
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("==============================")
          print(
              "TOTAL FINAL:",
              len(noticias[:8])
          )
          print("==============================")


          PY


      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio J.A FM"
          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"

          git push
