name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import unicodedata
          from datetime import datetime, timezone

          API_KEY = os.environ["NEWSDATA_API_KEY"]
          API_URL = "https://newsdata.io/api/1/latest"

          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          MAX_NOTICIAS = 8

          # -----------------------------------------------------
          # TERMOS PROIBIDOS
          # -----------------------------------------------------

          BLOQUEADOS = [
              "mix vale",
              "mixvale",
              "mixvale.com.br"
          ]

          # -----------------------------------------------------
          # TOMÉ-AÇU
          # -----------------------------------------------------

          TOME_ACU = [
              "tome acu",
              "tome-acu"
          ]

          # -----------------------------------------------------
          # BELÉM E REGIÃO METROPOLITANA
          # -----------------------------------------------------

          BELEM_RMB = [
              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"
          ]

          # -----------------------------------------------------
          # NORDESTE DO PARÁ
          # -----------------------------------------------------

          NORDESTE_PARA = [
              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "igarape-acu",
              "tracuateua"
          ]

          # -----------------------------------------------------
          # OUTRAS CIDADES IMPORTANTES DO PARÁ
          # -----------------------------------------------------

          OUTRAS_CIDADES_PARA = [
              "altamira",
              "santarem",
              "maraba",
              "parauapebas",
              "tucurui",
              "moju",
              "itaituba",
              "breves",
              "obidos",
              "redençao",
              "redencao",
              "ourilandia do norte",
              "xinguara",
              "tailandia",
              "cameta",
              "braganca",
              "abaetetuba",
              "salinopolis",
              "capitão poco",
              "capitao poco",
              "tracuateua"
          ]

          # -----------------------------------------------------
          # TERMOS QUE IDENTIFICAM O ESTADO DO PARÁ
          # -----------------------------------------------------

          PARA = [
              "para",
              "paraense",
              "paraenses",
              "estado do para",
              "governo do para",
              "governador do para",
              "policia do para",
              "policia civil do para",
              "seguranca publica do para",
              "assembleia legislativa do para",
              "tribunal de justica do para",
              "ministerio publico do para"
          ]

          # -----------------------------------------------------
          # OUTRAS REGIÕES
          # -----------------------------------------------------

          OUTRAS_REGIOES = [
              "bahia",
              "salvador",
              "sao paulo",
              "rio de janeiro",
              "minas gerais",
              "pernambuco",
              "recife",
              "ceara",
              "fortaleza",
              "parana",
              "curitiba",
              "rio grande do sul",
              "porto alegre",
              "brasilia",
              "goias",
              "goiania",
              "amazonas",
              "manaus",
              "acre",
              "rondonia",
              "mato grosso",
              "mato grosso do sul",
              "espirito santo",
              "santa catarina",
              "maranhao",
              "piaui",
              "paraiba",
              "alagoas",
              "sergipe",
              "rio grande do norte",
              "tocantins",
              "amapa"
          ]

          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):
              if not texto:
                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caractere
                  for caractere in texto
                  if unicodedata.category(caractere) != "Mn"
              )

              texto = texto.replace("–", "-")
              texto = texto.replace("—", "-")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def titulo_normalizado(titulo):
              titulo = normalizar(titulo)

              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          # =====================================================
          # BUSCAR NOTÍCIAS
          # =====================================================

          def buscar(consulta):

              parametros = {
                  "apikey": API_KEY,
                  "country": "br",
                  "language": "pt",
                  "q": consulta
              }

              url = (
                  API_URL
                  + "?"
                  + urllib.parse.urlencode(parametros)
              )

              try:

                  requisicao = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadioJA-FM-News/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      requisicao,
                      timeout=30
                  ) as resposta:

                      dados = json.loads(
                          resposta.read().decode("utf-8")
                      )

                  return dados.get(
                      "results",
                      []
                  )

              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # TEXTO DA NOTÍCIA
          # =====================================================

          def texto_titulo(item):
              return normalizar(
                  item.get("title") or ""
              )


          def texto_descricao(item):
              return normalizar(
                  item.get("description") or ""
              )


          def texto_completo(item):
              return normalizar(
                  " ".join([
                      item.get("title") or "",
                      item.get("description") or ""
                  ])
              )


          # =====================================================
          # VERIFICAR TERMOS
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)
              termo = normalizar(termo)

              if not termo:
                  return False

              # Para termos com espaço, procura normalmente.
              if " " in termo or "-" in termo:
                  return termo in texto

              # Para palavras únicas, evita falsos positivos.
              return re.search(
                  r"\b" + re.escape(termo) + r"\b",
                  texto
              ) is not None


          def pertence_ao_grupo_titulo(item, termos):

              titulo = texto_titulo(item)

              for termo in termos:

                  if contem_termo(
                      titulo,
                      termo
                  ):
                      return True

              return False


          def pertence_ao_grupo_descricao(item, termos):

              descricao = texto_descricao(item)

              for termo in termos:

                  if contem_termo(
                      descricao,
                      termo
                  ):
                      return True

              return False


          def pertence_ao_grupo(item, termos):

              titulo = texto_titulo(item)
              descricao = texto_descricao(item)

              for termo in termos:

                  if contem_termo(
                      titulo,
                      termo
                  ):
                      return True

                  if contem_termo(
                      descricao,
                      termo
                  ):
                      return True

              return False


          # =====================================================
          # BLOQUEIO
          # =====================================================

          def bloqueada(item):

              titulo = texto_titulo(item)
              descricao = texto_descricao(item)

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = " ".join([
                  titulo,
                  descricao,
                  fonte
              ])

              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):
                      return True

              if "mixvale.com.br" in link:
                  return True

              return False


          # =====================================================
          # IDENTIFICAR SE É NOTÍCIA REGIONAL
          # =====================================================

          def eh_regional_para(item):

              titulo = texto_titulo(item)
              descricao = texto_descricao(item)

              # -----------------------------------------------
              # 1. CIDADE DO PARÁ NO TÍTULO = MUITO FORTE
              # -----------------------------------------------

              grupos_cidade = [
                  TOME_ACU,
                  BELEM_RMB,
                  NORDESTE_PARA,
                  OUTRAS_CIDADES_PARA
              ]

              for grupo in grupos_cidade:

                  if pertence_ao_grupo_titulo(
                      item,
                      grupo
                  ):
                      return True

              # -----------------------------------------------
              # 2. "PARÁ" NO TÍTULO = FORTE
              # -----------------------------------------------

              for termo in PARA:

                  if contem_termo(
                      titulo,
                      termo
                  ):
                      return True

              # -----------------------------------------------
              # 3. CIDADE DO PARÁ NO TÍTULO/DESCRIÇÃO
              #    SOMENTE SE NÃO HOUVER OUTRO ESTADO FORTE
              # -----------------------------------------------

              encontrou_para = False

              for grupo in grupos_cidade:

                  if pertence_ao_grupo(
                      item,
                      grupo
                  ):
                      encontrou_para = True
                      break

              if not encontrou_para:

                  for termo in PARA:

                      if contem_termo(
                          descricao,
                          termo
                      ):
                          encontrou_para = True
                          break

              if not encontrou_para:
                  return False

              # -----------------------------------------------
              # 4. SE OUTRO ESTADO APARECER NO TÍTULO,
              #    CONSIDERAR NÃO REGIONAL
              # -----------------------------------------------

              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      titulo,
                      termo
                  ):

                      # Exceção: "Pará" continua sendo regional.
                      if (
                          "para" in titulo
                          and termo == "para"
                      ):
                          continue

                      return False

              return True


          # =====================================================
          # VALIDAÇÃO PRINCIPAL
          # =====================================================

          def valido(item):

              if not item.get("title"):
                  return False

              if not item.get("link"):
                  return False

              if bloqueada(item):
                  return False

              # Notícias sem qualquer sinal de relevância
              # para o Pará são descartadas.
              if not eh_regional_para(item):
                  return False

              return True


          # =====================================================
          # CONVERTER NOTÍCIA
          # =====================================================

          def converter(item, categoria):

              return {
                  "id": item.get("article_id"),
                  "titulo": item.get("title"),
                  "descricao": item.get("description"),
                  "link": item.get("link"),
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate"),
                  "categoria": categoria
              }


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              '"Tomé-Açu"',
              '"Tome Acu"',

              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',

              # -----------------------------------------------
              # NORDESTE DO PARÁ
              # -----------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',

              # -----------------------------------------------
              # OUTRAS CIDADES DO PARÁ
              # -----------------------------------------------

              '"Altamira"',
              '"Santarém"',
              '"Marabá"',
              '"Parauapebas"',
              '"Tucuruí"',
              '"Moju"',
              '"Itaituba"',
              '"Breves"',
              '"Óbidos"',
              '"Redenção"',
              '"Xinguara"',
              '"Tailândia"',

              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              '"Pará"',
              '"Governo do Pará"',
              '"Polícia do Pará"',
              '"Polícia Civil do Pará"',
              '"Segurança Pública do Pará"'
          ]


          # =====================================================
          # COLETAR
          # =====================================================

          candidatos = {}

          for consulta in consultas:

              print("")
              print(
                  "BUSCANDO:",
                  consulta
              )

              resultados = buscar(
                  consulta
              )

              print(
                  "RESULTADOS:",
                  len(resultados)
              )

              for item in resultados:

                  if not valido(item):
                      continue

                  link = (
                      item.get("link") or ""
                  ).strip()

                  if not link:
                      continue

                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS VÁLIDOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []
          belem = []
          nordeste = []
          para = []


          for item in candidatos.values():

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):
                  tome_acu.append(item)

              elif pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):
                  belem.append(item)

              elif pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):
                  nordeste.append(item)

              else:
                  para.append(item)


          print("")
          print("==============================")
          print("CLASSIFICAÇÃO")
          print("==============================")

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste do Pará:",
              len(nordeste)
          )

          print(
              "Outras notícias do Pará:",
              len(para)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()
          links_usados = set()

          noticias = []


          def adicionar(item, categoria):

              if len(noticias) >= MAX_NOTICIAS:
                  return False

              link = (
                  item.get("link") or ""
              ).strip()

              titulo = titulo_normalizado(
                  item.get("title") or ""
              )

              if not link:
                  return False

              if link in links_usados:
                  return False

              if titulo in titulos_usados:
                  return False

              links_usados.add(link)
              titulos_usados.add(titulo)

              noticia = converter(
                  item,
                  categoria
              )

              noticias.append(
                  noticia
              )

              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"
              )

              return True


          # =====================================================
          # PRIORIDADE
          # =====================================================

          # -----------------------------------------------------
          # 1. TOMÉ-AÇU
          # -----------------------------------------------------

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):
                  break


          # -----------------------------------------------------
          # 2. BELÉM / RMB
          # Máximo de 2
          # -----------------------------------------------------

          contador_belem = 0

          for item in belem:

              if len(noticias) >= MAX_NOTICIAS:
                  break

              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1

              if contador_belem >= 2:
                  break


          # -----------------------------------------------------
          # 3. NORDESTE DO PARÁ
          # Máximo de 2
          # -----------------------------------------------------

          contador_nordeste = 0

          for item in nordeste:

              if len(noticias) >= MAX_NOTICIAS:
                  break

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1

              if contador_nordeste >= 2:
                  break


          # -----------------------------------------------------
          # 4. OUTRAS NOTÍCIAS DO PARÁ
          # -----------------------------------------------------

          for item in para:

              if len(noticias) >= MAX_NOTICIAS:
                  break

              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias": noticias[:MAX_NOTICIAS]
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESUMO FINAL
          # =====================================================

          print("")
          print("==============================")
          print(
              "TOTAL FINAL:",
              len(noticias[:MAX_NOTICIAS])
          )
          print("==============================")


          for numero, noticia in enumerate(
              noticias[:MAX_NOTICIAS],
              1
          ):

              print(
                  f"{numero}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"
              )


          PY


      # ========================================================
      # SALVAR NO GITHUB
      # ========================================================

      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio J.A FM"
          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"

          git push
