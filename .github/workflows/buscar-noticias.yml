name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # ==========================================================
          # CONFIGURAÇÃO
          # ==========================================================

          ARQUIVO = "noticias.json"
          LIMITE = 8

          FONTES = [

              {
                  "nome": "O Liberal",
                  "url": "https://www.oliberal.com/para"
              },

              {
                  "nome": "G1",
                  "url": "https://g1.globo.com/pa/para/"
              },

              {
                  "nome": "Diário do Pará",
                  "url": "https://diariodopara.com.br/"
              }

          ]


          # ==========================================================
          # SESSÃO HTTP
          # ==========================================================

          sessao = requests.Session()

          sessao.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
                  "no-cache"
          })


          # ==========================================================
          # LIMPAR TEXTO
          # ==========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ==========================================================
          # ID
          # ==========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # NORMALIZAR URL
          # ==========================================================

          def normalizar_url(url, pagina):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              return urljoin(
                  pagina,
                  url
              )


          # ==========================================================
          # VALIDAR IMAGEM
          # ==========================================================

          def imagem_valida(url):

              if not url:
                  return False

              url = url.lower()

              bloqueadas = [
                  "logo",
                  "avatar",
                  "icon",
                  "icone",
                  "favicon",
                  "sprite",
                  "placeholder",
                  "pixel",
                  "banner"
              ]

              for palavra in bloqueadas:

                  if palavra in url:
                      return False

              extensoes = [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp"
              ]

              if any(
                  ext in url
                  for ext in extensoes
              ):
                  return True

              return True


          # ==========================================================
          # EXTRAIR IMAGEM JSON-LD
          # ==========================================================

          def extrair_jsonld_imagem(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = (
                          script.string
                          or script.get_text()
                      )

                      if not texto:
                          continue

                      dados = json.loads(texto)

                  except Exception:

                      continue


                  objetos = []

                  if isinstance(
                      dados,
                      dict
                  ):

                      objetos.append(
                          dados
                      )

                      graph = dados.get(
                          "@graph"
                      )

                      if isinstance(
                          graph,
                          list
                      ):

                          objetos.extend(
                              graph
                          )

                  elif isinstance(
                      dados,
                      list
                  ):

                      objetos.extend(
                          dados
                      )


                  for obj in objetos:

                      if not isinstance(
                          obj,
                          dict
                      ):
                          continue

                      imagem = obj.get(
                          "image"
                      )

                      if isinstance(
                          imagem,
                          str
                      ):

                          url = normalizar_url(
                              imagem,
                              pagina
                          )

                          if imagem_valida(
                              url
                          ):
                              return url


                      if isinstance(
                          imagem,
                          dict
                      ):

                          url = (
                              imagem.get("url")
                              or imagem.get("contentUrl")
                              or ""
                          )

                          url = normalizar_url(
                              url,
                              pagina
                          )

                          if imagem_valida(
                              url
                          ):
                              return url


                      if isinstance(
                          imagem,
                          list
                      ):

                          for item in imagem:

                              if isinstance(
                                  item,
                                  str
                              ):

                                  url = normalizar_url(
                                      item,
                                      pagina
                                  )

                                  if imagem_valida(
                                      url
                                  ):
                                      return url

                              elif isinstance(
                                  item,
                                  dict
                              ):

                                  url = (
                                      item.get("url")
                                      or item.get(
                                          "contentUrl"
                                      )
                                      or ""
                                  )

                                  url = normalizar_url(
                                      url,
                                      pagina
                                  )

                                  if imagem_valida(
                                      url
                                  ):
                                      return url

              return ""


          # ==========================================================
          # EXTRAIR IMAGEM DA MATÉRIA
          # ==========================================================

          def extrair_imagem(link):

              print(
                  "      Abrindo matéria:"
              )

              print(
                  "      " + link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

              except Exception as erro:

                  print(
                      "      Erro HTTP:",
                      erro
                  )

                  return ""


              print(
                  "      HTTP:",
                  resposta.status_code
              )

              if resposta.status_code != 200:

                  return ""


              soup = BeautifulSoup(
                  resposta.text,
                  "html.parser"
              )


              # ------------------------------------------------------
              # 1. OG IMAGE
              # ------------------------------------------------------

              for atributo in [
                  ("property", "og:image"),
                  ("property", "og:image:url"),
                  ("name", "twitter:image"),
                  ("name", "twitter:image:src")
              ]:

                  meta = soup.find(
                      "meta",
                      attrs={
                          atributo[0]:
                              atributo[1]
                      }
                  )

                  if meta:

                      imagem = normalizar_url(
                          meta.get("content", ""),
                          link
                      )

                      if imagem_valida(
                          imagem
                      ):

                          print(
                              "      IMAGEM OG:",
                              imagem
                          )

                          return imagem


              # ------------------------------------------------------
              # 2. JSON-LD
              # ------------------------------------------------------

              imagem = extrair_jsonld_imagem(
                  soup,
                  link
              )

              if imagem:

                  print(
                      "      IMAGEM JSON-LD:",
                      imagem
                  )

                  return imagem


              # ------------------------------------------------------
              # 3. ARTICLE / MAIN
              # ------------------------------------------------------

              areas = []

              article = soup.find(
                  "article"
              )

              if article:

                  areas.append(
                      article
                  )

              main = soup.find(
                  "main"
              )

              if main:

                  areas.append(
                      main
                  )


              # ------------------------------------------------------
              # 4. PROCURAR IMAGENS
              # ------------------------------------------------------

              for area in areas:

                  for img in area.find_all(
                      "img"
                  ):

                      candidatos = [

                          img.get("src"),

                          img.get(
                              "data-src"
                          ),

                          img.get(
                              "data-original"
                          ),

                          img.get(
                              "data-lazy-src"
                          ),

                          img.get(
                              "data-original-src"
                          ),

                          img.get(
                              "data-image"
                          )

                      ]

                      for candidato in candidatos:

                          imagem = normalizar_url(
                              candidato or "",
                              link
                          )

                          if not imagem:
                              continue

                          if not imagem_valida(
                              imagem
                          ):
                              continue

                          print(
                              "      IMAGEM HTML:",
                              imagem
                          )

                          return imagem


              # ------------------------------------------------------
              # 5. ÚLTIMA TENTATIVA
              # ------------------------------------------------------

              for img in soup.find_all(
                  "img"
              ):

                  candidatos = [

                      img.get("src"),

                      img.get(
                          "data-src"
                      ),

                      img.get(
                          "data-original"
                      ),

                      img.get(
                          "data-lazy-src"
                      )

                  ]

                  for candidato in candidatos:

                      imagem = normalizar_url(
                          candidato or "",
                          link
                      )

                      if not imagem:
                          continue

                      if not imagem_valida(
                          imagem
                      ):
                          continue

                      largura = img.get(
                          "width"
                      )

                      try:

                          if largura and int(
                              largura
                          ) < 200:

                              continue

                      except Exception:

                          pass


                      print(
                          "      IMAGEM:",
                          imagem
                      )

                      return imagem


              print(
                  "      NENHUMA IMAGEM ENCONTRADA"
              )

              return ""


          # ==========================================================
          # BLOQUEIOS
          # ==========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras = [

                  "mixvale",
                  "mix vale",
                  "/videos/",
                  "/video/",
                  "/webstories/",
                  "/podcasts/",
                  "/programas/",
                  "/ao-vivo",
                  "/newsletter",
                  "/login",
                  "/busca"

              ]

              return any(
                  palavra in texto
                  for palavra in palavras
              )


          # ==========================================================
          # VERIFICAR LINK DE MATÉRIA
          # ==========================================================

          def link_valido(
              fonte,
              link
          ):

              link_lower = link.lower()


              if fonte == "G1":

                  return (
                      "g1.globo.com" in link_lower
                      and
                      "/noticia/" in link_lower
                  )


              if fonte == "O Liberal":

                  if "oliberal.com" not in link_lower:
                      return False

                  secoes = [

                      "/para/",
                      "/belem/",
                      "/amazonia/",
                      "/policia/",
                      "/politica/",
                      "/economia/",
                      "/esportes/",
                      "/entretenimento/",
                      "/brasil/",
                      "/mundo/",
                      "/cultura/",
                      "/saude/",
                      "/concursos/"

                  ]

                  return any(
                      secao in link_lower
                      for secao in secoes
                  )


              if fonte == "Diário do Pará":

                  return (
                      "diariodopara.com.br"
                      in link_lower
                  )


              return False


          # ==========================================================
          # LER JSON EXISTENTE
          # ==========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []

              except Exception as erro:

                  print(
                      "Erro lendo JSON:",
                      erro
                  )

                  antigas = []


          print("")
          print(
              "Notícias existentes:",
              len(antigas)
          )


          # ==========================================================
          # MAPA DE IMAGENS EXISTENTES
          # ==========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          novas = []


          # ==========================================================
          # BUSCAR UMA FONTE
          # ==========================================================

          def buscar_fonte(fonte):

              print("")
              print(
                  "=========================================="
              )

              print(
                  "FONTE:",
                  fonte["nome"]
              )

              print(
                  "=========================================="
              )


              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30,
                      allow_redirects=True
                  )

              except Exception as erro:

                  print(
                      "Erro:",
                      erro
                  )

                  return []


              print(
                  "HTTP:",
                  resposta.status_code
              )


              if resposta.status_code != 200:

                  return []


              soup = BeautifulSoup(
                  resposta.text,
                  "html.parser"
              )


              encontrados = []
              links_vistos = set()


              # ------------------------------------------------------
              # PROCURAR LINKS
              # ------------------------------------------------------

              for a in soup.find_all(
                  "a",
                  href=True
              ):

                  titulo = limpar(
                      a.get_text(
                          " ",
                          strip=True
                      )
                  )

                  href = a.get(
                      "href",
                      ""
                  )


                  if not titulo:
                      continue


                  if len(titulo) < 25:
                      continue


                  if len(titulo) > 220:
                      continue


                  link = urljoin(
                      fonte["url"],
                      href
                  )


                  if link in links_vistos:
                      continue


                  links_vistos.add(
                      link
                  )


                  if not link_valido(
                      fonte["nome"],
                      link
                  ):

                      continue


                  if bloqueada(
                      titulo,
                      link
                  ):

                      continue


                  # --------------------------------------------------
                  # IMAGEM ANTIGA
                  # --------------------------------------------------

                  imagem = imagens_antigas.get(
                      link,
                      ""
                  )


                  # --------------------------------------------------
                  # BUSCAR IMAGEM
                  # --------------------------------------------------

                  if not imagem:

                      imagem = extrair_imagem(
                          link
                      )


                  # --------------------------------------------------
                  # DATA
                  # --------------------------------------------------

                  data = (
                      datetime.now(
                          timezone.utc
                      ).isoformat()
                  )


                  noticia = {

                      "id":
                          criar_id(
                              titulo,
                              link
                          ),

                      "titulo":
                          titulo,

                      "descricao":
                          titulo,

                      "link":
                          link,

                      "fonte":
                          fonte["nome"],

                      "imagem":
                          imagem,

                      "data":
                          data,

                      "categoria":
                          "PARÁ"

                  }


                  encontrados.append(
                      noticia
                  )


                  print("")
                  print(
                      "NOTÍCIA:",
                      titulo
                  )

                  print(
                      "FONTE:",
                      fonte["nome"]
                  )

                  print(
                      "IMAGEM:",
                      imagem
                      if imagem
                      else
                      "SEM IMAGEM"
                  )


                  if len(
                      encontrados
                  ) >= 4:

                      break


              print("")
              print(
                  "Total da fonte:",
                  len(encontrados)
              )


              return encontrados


          # ==========================================================
          # EXECUTAR FONTES
          # ==========================================================

          for fonte in FONTES:

              noticias = buscar_fonte(
                  fonte
              )

              novas.extend(
                  noticias
              )


          print("")
          print(
              "=========================================="
          )

          print(
              "TOTAL ENCONTRADO:",
              len(novas)
          )

          print(
              "=========================================="
          )


          # ==========================================================
          # COMBINAR
          # ==========================================================

          todas = novas + antigas


          # ==========================================================
          # DEDUPLICAR
          # ==========================================================

          unicas = {}


          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              titulo = str(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).strip()


              if not link and not titulo:

                  continue


              chave = (
                  link.lower()
                  if link
                  else
                  titulo.lower()
              )


              if chave not in unicas:

                  unicas[
                      chave
                  ] = noticia

              else:

                  atual = unicas[
                      chave
                  ]

                  imagem_atual = str(
                      atual.get(
                          "imagem",
                          ""
                      )
                  ).strip()

                  imagem_nova = str(
                      noticia.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      atual["imagem"] = (
                          imagem_nova
                      )


          todas = list(
              unicas.values()
          )


          # ==========================================================
          # RECUPERAR IMAGENS
          # ==========================================================

          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              if (
                  not imagem
                  and link
                  and link in imagens_antigas
              ):

                  noticia["imagem"] = (
                      imagens_antigas[
                          link
                      ]
                  )


          # ==========================================================
          # REMOVER LINKS GOOGLE NEWS
          # ==========================================================

          filtradas = []


          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).lower()


              if (
                  "news.google.com"
                  in link
              ):

                  continue


              filtradas.append(
                  noticia
              )


          todas = filtradas


          # ==========================================================
          # ORDENAR
          # ==========================================================

          todas.sort(
              key=lambda noticia:
                  noticia.get(
                      "data",
                      ""
                  ),
              reverse=True
          )


          # ==========================================================
          # PEGAR AS 8
          # ==========================================================

          resultado = todas[
              :LIMITE
          ]


          # ==========================================================
          # SALVAR
          # ==========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================================
          # RELATÓRIO FINAL
          # ==========================================================

          print("")
          print(
              "=========================================="
          )

          print(
              "PROCESSO CONCLUÍDO"
          )

          print(
              "=========================================="
          )

          print(
              "Notícias encontradas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print("")


          for noticia in resultado:

              print(
                  "------------------------------------------"
              )

              print(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "Fonte:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "Imagem:",
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or
                  "SEM IMAGEM"
              )


          PY


      # ==========================================================
      # SALVAR NO GITHUB
      # ==========================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar notícias"
            git push
          fi
