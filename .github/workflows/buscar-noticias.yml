        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no noticias.json."
          else
            git commit -m "Atualizar notícias"
            git push
          fi
