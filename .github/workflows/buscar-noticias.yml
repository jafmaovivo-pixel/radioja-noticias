name: Buscar notícias

on:

  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"


permissions:
  contents: write


jobs:

  buscar:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # BAIXAR REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos

        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:

          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}


        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"

          LIMITE_NOTICIAS = 8


          if not API_KEY:

              raise SystemExit(
                  "ERRO: NEWSDATA_API_KEY não configurada."
              )


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu",
              "tomé-açu"

          ]


          # =====================================================
          # BELÉM / REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "belém",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa izabel do pará",
              "santa barbara do para",
              "santa bárbara do pará"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "bragança",
              "capanema",
              "salinopolis",
              "salinópolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "cametá",
              "vigia",
              "capitao poco",
              "capitão poço",
              "igarape acu",
              "igarapé-açu",
              "tracuateua",
              "tracuateua"

          ]


          # =====================================================
          # TERMOS QUE INDICAM PARÁ
          # =====================================================

          PARA = [

              "para",
              "pará",
              "paraense",
              "paraenses",
              "estado do para",
              "estado do pará",
              "governo do para",
              "governo do pará",
              "policia do para",
              "polícia do pará",
              "ministerio publico do para",
              "ministério público do pará",
              "tribunal de justica do para",
              "tribunal de justiça do pará",
              "assembleia legislativa do para",
              "assembleia legislativa do pará",
              "governador do para",
              "governador do pará",
              "governadora do para",
              "governadora do pará"

          ]


          # =====================================================
          # OUTROS ESTADOS
          # =====================================================

          OUTRAS_REGIOES = [

              "bahia",
              "salvador",

              "sao paulo",
              "são paulo",

              "rio de janeiro",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceara",
              "ceará",
              "fortaleza",

              "parana",
              "paraná",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasilia",
              "brasília",
              "distrito federal",

              "goias",
              "goiás",
              "goiania",
              "goiânia",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondonia",
              "rondônia",
              "porto velho",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "espírito santo",
              "vitoria",
              "vitória",

              "santa catarina",
              "florianopolis",
              "florianópolis",

              "maranhao",
              "maranhão",
              "sao luis",
              "são luís",

              "piaui",
              "piauí",
              "teresina",

              "paraiba",
              "paraíba",
              "joao pessoa",
              "joão pessoa",

              "rio grande do norte",
              "natal",

              "alagoas",
              "maceio",
              "maceió",

              "sergipe",
              "aracaju",

              "tocantins",
              "palmas",

              "amapa",
              "amapá",
              "macapa",
              "macapá"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(

                  caractere
                  for caractere in texto

                  if unicodedata.category(caractere) != "Mn"

              )

              texto = texto.replace("-", " ")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # VERIFICAR TERMO
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:
                  return False

              padrao = (

                  r"(?<![a-z0-9])"
                  + re.escape(termo)
                  + r"(?![a-z0-9])"

              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",
                  item.get("description") or "",
                  item.get("source_name") or "",
                  item.get("link") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # NOTÍCIA BLOQUEADA
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )


              texto = " ".join([

                  titulo,
                  descricao,
                  fonte

              ])


              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              if "mixvale.com.br" in link:
                  return True

              if "mixvale" in link:
                  return True


              return False


          # =====================================================
          # NOTÍCIA VÁLIDA
          # =====================================================

          def valida(item):

              if not item:
                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:
                  return False


              if not link:
                  return False


              if bloqueada(item):
                  return False


              return True


          # =====================================================
          # BUSCAR NA NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta,

                  "size": "10"

              }


              url = (

                  API_URL
                  + "?"
                  + urllib.parse.urlencode(
                      parametros
                  )

              )


              print("")
              print("--------------------------------")
              print("CONSULTA:", consulta)
              print("--------------------------------")


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/2.0"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      conteudo = (
                          resposta
                          .read()
                          .decode("utf-8")
                      )


                  dados = json.loads(
                      conteudo
                  )


                  if dados.get("status") != "success":

                      print(
                          "RESPOSTA DA API:",
                          dados
                      )

                      return []


                  resultados = dados.get(
                      "results",
                      []
                  )


                  print(
                      "RESULTADOS:",
                      len(resultados)
                  )


                  return resultados


              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # CONSULTAS
          #
          # Poucas consultas para não gastar créditos
          # desnecessariamente.
          # =====================================================

          consultas = [

              # 1
              '"Tomé-Açu" OR "Tome-Acu"',

              # 2
              'Belém OR Ananindeua OR Marituba OR Benevides',

              # 3
              'Castanhal OR Bragança OR Capanema OR Salinópolis',

              # 4
              'Paragominas OR Barcarena OR Abaetetuba OR Cametá',

              # 5
              'Pará OR "governo do Pará" OR "polícia do Pará"',

              # 6
              'Brasil'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              resultados = buscar(
                  consulta
              )


              for item in resultados:

                  if not valida(item):
                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:
                      continue


                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print("================================")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )
          print("================================")


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []
          belem = []
          nordeste = []
          para = []
          brasil = []


          def pertence(item, termos):

              texto = texto_noticia(
                  item
              )


              for termo in termos:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          def eh_outra_regiao(item):

              texto = texto_noticia(
                  item
              )


              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          def eh_para(item):

              texto = texto_noticia(
                  item
              )


              # Primeiro verifica se existe referência
              # explícita ao Pará.

              tem_para = pertence(
                  item,
                  PARA
              )


              if not tem_para:

                  return False


              # Se houver outro estado junto,
              # ainda aceitamos somente se houver
              # referência explícita ao Pará.

              return True


          # =====================================================
          # CLASSIFICAR
          # =====================================================

          for item in candidatos.values():

              # ---------------------------------------------
              # TOMÉ-AÇU
              # ---------------------------------------------

              if pertence(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(
                      item
                  )

                  continue


              # ---------------------------------------------
              # BELÉM / RMB
              # ---------------------------------------------

              if pertence(
                  item,
                  BELEM_RMB
              ):

                  belem.append(
                      item
                  )

                  continue


              # ---------------------------------------------
              # NORDESTE
              # ---------------------------------------------

              if pertence(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(
                      item
                  )

                  continue


              # ---------------------------------------------
              # PARÁ
              # ---------------------------------------------

              if eh_para(item):

                  para.append(
                      item
                  )

                  continue


              # ---------------------------------------------
              # BRASIL
              # ---------------------------------------------

              brasil.append(
                  item
              )


          print("")
          print("================================")
          print("CLASSIFICAÇÃO")
          print("================================")

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          noticias = []

          links_usados = set()

          titulos_usados = set()


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )


              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )


              return titulo.strip()


          # =====================================================
          # CONVERTER
          # =====================================================

          def converter(item, categoria):

              return {

                  "id":
                      item.get(
                          "article_id"
                      ),

                  "titulo":
                      item.get(
                          "title"
                      ),

                  "descricao":
                      item.get(
                          "description"
                      ),

                  "link":
                      item.get(
                          "link"
                      ),

                  "fonte":
                      item.get(
                          "source_name"
                      ),

                  "imagem":
                      item.get(
                          "image_url"
                      ),

                  "data":
                      item.get(
                          "pubDate"
                      ),

                  "categoria":
                      categoria

              }


          # =====================================================
          # ADICIONAR
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE_NOTICIAS:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:
                  return False


              if not titulo:
                  return False


              if link in links_usados:
                  return False


              if titulo in titulos_usados:
                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticia = converter(
                  item,
                  categoria
              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM / RMB
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in belem:

              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador += 1


              if contador >= 2:
                  break


              if len(noticias) >= LIMITE_NOTICIAS:
                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in nordeste:

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador += 1


              if contador >= 2:
                  break


              if len(noticias) >= LIMITE_NOTICIAS:
                  break


          # =====================================================
          # PRIORIDADE 4
          # PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE_NOTICIAS:
                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          #
          # COMPLETA ATÉ 8
          # =====================================================

          for item in brasil:

              if len(noticias) >= LIMITE_NOTICIAS:
                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # RESULTADO FINAL
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE_NOTICIAS]

          }


          # =====================================================
          # SALVAR JSON
          # =====================================================

          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO
          # =====================================================

          print("")
          print("================================")
          print(
              "TOTAL FINAL:",
              len(noticias)
          )
          print("================================")


          for numero, noticia in enumerate(

              noticias,

              start=1

          ):

              print(

                  f"{numero}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"

              )


          # =====================================================
          # AVISO
          # =====================================================

          if len(noticias) < LIMITE_NOTICIAS:

              print("")
              print(
                  "AVISO: foram encontradas apenas",
                  len(noticias),
                  "notícias válidas."
              )

              print(
                  "O site exibirá somente essas notícias."
              )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"


          git add noticias.json


          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
