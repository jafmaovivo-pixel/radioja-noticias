name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["NEWSDATA_API_KEY"]

          params = urllib.parse.urlencode({
              "apikey": api_key,
              "country": "br",
              "language": "pt",
              "category": "top"
          })

          url = "https://newsdata.io/api/1/latest?" + params

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "RadioJA-FM-NewsBot/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          if data.get("status") != "success":
              print(data)
              raise SystemExit("Erro ao consultar NewsData")

          noticias = []

          for item in data.get("results", []):
              if not item.get("link") or not item.get("title"):
                  continue

              noticias.append({
                  "id": item.get("article_id"),
                  "titulo": item.get("title"),
                  "descricao": item.get("description"),
                  "link": item.get("link"),
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate")
              })

          resultado = {
              "atualizado": datetime.now(timezone.utc).isoformat(),
              "noticias": noticias[:20]
          }

          with open("noticias.json", "w", encoding="utf-8") as arquivo:
              json.dump(resultado, arquivo, ensure_ascii=False, indent=2)

          print(f"{len(noticias)} notícias encontradas.")
          PY

      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio J.A FM"
          git config user.email "actions@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Atualizar notícias"
          git push
