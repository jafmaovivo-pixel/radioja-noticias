name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # BAIXAR REPOSITÓRIO
      # =========================================================

      - name: Baixar repositório
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURAR PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # INSTALAR DEPENDÊNCIAS
      # =========================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # =========================================================
      # BUSCAR NOTÍCIAS
      # =========================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          ARQUIVO = "noticias.json"

          LIMITE = 8

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },

              {
                  "nome": "G1",
                  "tipo": "g1",
                  "url": "https://g1.globo.com/pa/para/"
              }

          ]


          # =========================================================
          # SESSÃO HTTP
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36",

              "Accept":
              "text/html,application/xhtml+xml,"
              "application/xml;q=0.9,image/avif,image/webp,"
              "*/*;q=0.8",

              "Accept-Language":
              "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
              "no-cache"

          })


          # =========================================================
          # LIMPAR TEXTO
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =========================================================
          # CRIAR ID
          # =========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # =========================================================
          # BLOQUEAR MIX VALE
          # =========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras = [
                  "mixvale",
                  "mix vale"
              ]

              return any(
                  palavra in texto
                  for palavra in palavras
              )


          # =========================================================
          # NORMALIZAR URL
          # =========================================================

          def normalizar_url(url, pagina):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              return urljoin(
                  pagina,
                  url
              )


          # =========================================================
          # IMAGEM OG
          # =========================================================

          def imagem_og(soup, pagina):

              metas = [

                  {
                      "property": "og:image"
                  },

                  {
                      "property": "og:image:url"
                  },

                  {
                      "name": "twitter:image"
                  },

                  {
                      "name": "twitter:image:src"
                  }

              ]

              for config in metas:

                  meta = soup.find(
                      "meta",
                      attrs=config
                  )

                  if meta:

                      url = (
                          meta.get("content")
                          or ""
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if url:
                          return url

              return ""


          # =========================================================
          # IMAGEM JSON-LD
          # =========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          continue

                      dados = json.loads(
                          texto
                      )

                      objetos = []

                      if isinstance(
                          dados,
                          dict
                      ):

                          objetos.append(
                              dados
                          )

                          graph = dados.get(
                              "@graph"
                          )

                          if isinstance(
                              graph,
                              list
                          ):
                              objetos.extend(
                                  graph
                              )

                      elif isinstance(
                          dados,
                          list
                      ):

                          objetos.extend(
                              dados
                          )

                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagem = obj.get(
                              "image"
                          )

                          if isinstance(
                              imagem,
                              str
                          ):

                              url = normalizar_url(
                                  imagem,
                                  pagina
                              )

                              if url:
                                  return url

                          if isinstance(
                              imagem,
                              dict
                          ):

                              url = (
                                  imagem.get(
                                      "url"
                                  )
                                  or
                                  imagem.get(
                                      "contentUrl"
                                  )
                                  or ""
                              )

                              url = normalizar_url(
                                  url,
                                  pagina
                              )

                              if url:
                                  return url

                          if isinstance(
                              imagem,
                              list
                          ):

                              for item in imagem:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      url = normalizar_url(
                                          item,
                                          pagina
                                      )

                                      if url:
                                          return url

                                  if isinstance(
                                      item,
                                      dict
                                  ):

                                      url = (
                                          item.get(
                                              "url"
                                          )
                                          or
                                          item.get(
                                              "contentUrl"
                                          )
                                          or ""
                                      )

                                      url = normalizar_url(
                                          url,
                                          pagina
                                      )

                                      if url:
                                          return url

                  except Exception:
                      continue

              return ""


          # =========================================================
          # BUSCAR IMAGEM NA MATÉRIA
          # =========================================================

          def extrair_imagem_pagina(link):

              print(
                  "      Buscando imagem da matéria..."
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "      HTTP matéria:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # 1 - OG IMAGE

                  imagem = imagem_og(
                      soup,
                      resposta.url
                  )

                  if imagem:

                      print(
                          "      Imagem OG:",
                          imagem
                      )

                      return imagem


                  # 2 - JSON-LD

                  imagem = imagem_jsonld(
                      soup,
                      resposta.url
                  )

                  if imagem:

                      print(
                          "      Imagem JSON-LD:",
                          imagem
                      )

                      return imagem


                  # 3 - IMAGEM DO ARTIGO

                  article = (
                      soup.find("article")
                      or
                      soup.find("main")
                  )

                  if article:

                      for img in article.find_all(
                          "img"
                      ):

                          url = (
                              img.get("src")
                              or
                              img.get("data-src")
                              or
                              img.get("data-original")
                              or
                              img.get("data-lazy-src")
                              or ""
                          )

                          url = normalizar_url(
                              url,
                              resposta.url
                          )

                          if url:
                              return url

              except Exception as erro:

                  print(
                      "      Erro imagem:",
                      erro
                  )

              return ""


          # =========================================================
          # DATA RSS
          # =========================================================

          def data_rss(item):

              try:

                  if item.get(
                      "published_parsed"
                  ):

                      return datetime(
                          *item.published_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if item.get(
                      "updated_parsed"
                  ):

                      return datetime(
                          *item.updated_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # =========================================================
          # LER JSON EXISTENTE
          # =========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []

              except Exception as erro:

                  print(
                      "Erro lendo JSON:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # =========================================================
          # MAPA DE IMAGENS ANTIGAS
          # =========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          # =========================================================
          # MAPA DE NOTÍCIAS ANTIGAS
          # =========================================================

          noticias_antigas_por_link = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              if link:

                  noticias_antigas_por_link[
                      link
                  ] = noticia


          novas = []


          # =========================================================
          # DIÁRIO DO PARÁ - RSS
          # =========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "========================================"
              )

              print(
                  "FONTE:",
                  fonte["nome"]
              )

              print(
                  "========================================"
              )

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  feed = feedparser.parse(
                      resposta.content
                  )

                  resultado = []


                  for item in feed.entries:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = str(
                          item.get(
                              "link",
                              ""
                          )
                      ).strip()


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      imagem = ""


                      # Tentar imagem do RSS

                      try:

                          for media in item.get(
                              "media_content",
                              []
                          ):

                              if media.get(
                                  "url"
                              ):

                                  imagem = normalizar_url(
                                      media["url"],
                                      link
                                  )

                                  break

                      except Exception:
                          pass


                      if not imagem:

                          try:

                              for media in item.get(
                                  "media_thumbnail",
                                  []
                              ):

                                  if media.get(
                                      "url"
                                  ):

                                      imagem = normalizar_url(
                                          media["url"],
                                          link
                                      )

                                      break

                          except Exception:
                              pass


                      # Preservar imagem antiga

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              data_rss(
                                  item
                              ),

                          "categoria":
                              "PARÁ"

                      })


                      if len(resultado) >= 6:
                          break


                  print(
                      "Encontradas:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )

                  return []


          # =========================================================
          # O LIBERAL - PÁGINA
          # =========================================================

          def buscar_o_liberal(fonte):

              print("")
              print(
                  "========================================"
              )

              print(
                  "FONTE:",
                  fonte["nome"]
              )

              print(
                  "========================================"
              )

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  resultado = []

                  vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue

                      if len(titulo) < 25:
                          continue

                      if len(titulo) > 180:
                          continue


                      link = urljoin(
                          resposta.url,
                          href
                      )

                      caminho = link.lower()


                      if "oliberal.com" not in caminho:
                          continue


                      if link in vistos:
                          continue

                      vistos.add(
                          link
                      )


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      bloqueios = [

                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo"

                      ]

                      if any(
                          x in caminho
                          for x in bloqueios
                      ):
                          continue


                      secoes = [

                          "/policia/",
                          "/para/",
                          "/belem/",
                          "/amazonia/",
                          "/politica/",
                          "/economia/",
                          "/esportes/",
                          "/entretenimento/",
                          "/mundo/",
                          "/brasil/",
                          "/tecnologia/",
                          "/cultura/",
                          "/saude/",
                          "/concursos/"

                      ]

                      if not any(
                          secao in caminho
                          for secao in secoes
                      ):
                          continue


                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          "Notícia:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= 6:
                          break


                  print(
                      "Encontradas:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "Erro O Liberal:",
                      erro
                  )

                  return []


          # =========================================================
          # G1 PARÁ - RSS ESPECÍFICO
          # =========================================================

          def buscar_g1(fonte):

              print("")
              print(
                  "========================================"
              )

              print(
                  "FONTE: G1 PARÁ"
              )

              print(
                  "========================================"
              )


              # -----------------------------------------------------
              # RSS OFICIAL DO G1 PARÁ
              # -----------------------------------------------------

              urls_rss = [

                  "https://g1.globo.com/rss/g1/pa/para/",

                  "https://g1.globo.com/dynamo/pa/para/rss2.xml"

              ]


              feed = None


              for rss_url in urls_rss:

                  try:

                      print(
                          "Tentando RSS:",
                          rss_url
                      )

                      resposta = sessao.get(
                          rss_url,
                          timeout=30
                      )

                      print(
                          "HTTP RSS:",
                          resposta.status_code
                      )

                      if resposta.status_code == 200:

                          teste = feedparser.parse(
                              resposta.content
                          )

                          if teste.entries:

                              feed = teste
                              break

                  except Exception as erro:

                      print(
                          "Erro RSS G1:",
                          erro
                      )


              # -----------------------------------------------------
              # PROCESSAR RSS
              # -----------------------------------------------------

              if feed and feed.entries:

                  resultado = []

                  vistos = set()


                  for item in feed.entries:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = str(
                          item.get(
                              "link",
                              ""
                          )
                      ).strip()


                      if not titulo or not link:
                          continue


                      link = normalizar_url(
                          link,
                          "https://g1.globo.com/pa/para/"
                      )


                      # SOMENTE G1 PARÁ

                      if (
                          "g1.globo.com" not in
                          link.lower()
                      ):
                          continue


                      if "/pa/para/" not in link.lower():
                          continue


                      if "/noticia/" not in link.lower():
                          continue


                      if link in vistos:
                          continue

                      vistos.add(
                          link
                      )


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      # -------------------------------------------------
                      # PRIMEIRO: IMAGEM DO RSS
                      # -------------------------------------------------

                      imagem = ""


                      try:

                          for media in item.get(
                              "media_content",
                              []
                          ):

                              url = media.get(
                                  "url"
                              )

                              if url:

                                  imagem = normalizar_url(
                                      url,
                                      link
                                  )

                                  break

                      except Exception:
                          pass


                      # -------------------------------------------------
                      # SEGUNDO: THUMBNAIL
                      # -------------------------------------------------

                      if not imagem:

                          try:

                              for media in item.get(
                                  "media_thumbnail",
                                  []
                              ):

                                  url = media.get(
                                      "url"
                                  )

                                  if url:

                                      imagem = normalizar_url(
                                          url,
                                          link
                                      )

                                      break

                          except Exception:
                              pass


                      # -------------------------------------------------
                      # TERCEIRO: IMAGEM NO HTML DO RSS
                      # -------------------------------------------------

                      if not imagem:

                          try:

                              html = (
                                  item.get(
                                      "summary",
                                      ""
                                  )
                                  or
                                  item.get(
                                      "description",
                                      ""
                                  )
                              )

                              soup = BeautifulSoup(
                                  html,
                                  "html.parser"
                              )

                              img = soup.find(
                                  "img"
                              )

                              if img:

                                  imagem = normalizar_url(
                                      img.get("src")
                                      or
                                      img.get("data-src")
                                      or "",
                                      link
                                  )

                          except Exception:
                              pass


                      # -------------------------------------------------
                      # QUARTO: IMAGEM DA PRÓPRIA MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # PRESERVAR IMAGEM ANTIGA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              "G1",

                          "imagem":
                              imagem,

                          "data":
                              data_rss(
                                  item
                              ),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          "Notícia G1:",
                          titulo
                      )

                      print(
                          "Imagem G1:",
                          imagem
                      )


                      if len(resultado) >= 6:
                          break


                  print(
                      "G1 encontrou:",
                      len(resultado)
                  )

                  return resultado


              # -----------------------------------------------------
              # FALLBACK: PÁGINA DO G1
              # -----------------------------------------------------

              print(
                  "RSS do G1 não retornou notícias."
              )

              print(
                  "Usando página do G1 como fallback."
              )


              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP página G1:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  resultado = []

                  vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue

                      if len(titulo) < 25:
                          continue

                      if len(titulo) > 180:
                          continue


                      link = urljoin(
                          resposta.url,
                          href
                      )

                      caminho = link.lower()


                      if "g1.globo.com" not in caminho:
                          continue


                      if "/pa/para/" not in caminho:
                          continue


                      if "/noticia/" not in caminho:
                          continue


                      if link in vistos:
                          continue

                      vistos.add(
                          link
                      )


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              "G1",

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          "Notícia G1:",
                          titulo
                      )

                      print(
                          "Imagem G1:",
                          imagem
                      )


                      if len(resultado) >= 6:
                          break


                  print(
                      "G1 fallback encontrou:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "Erro fallback G1:",
                      erro
                  )

                  return []


          # =========================================================
          # EXECUTAR FONTES
          # =========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_fonte = buscar_rss(
                      fonte
                  )

              elif fonte["tipo"] == "g1":

                  noticias_fonte = buscar_g1(
                      fonte
                  )

              else:

                  noticias_fonte = buscar_o_liberal(
                      fonte
                  )


              novas.extend(
                  noticias_fonte
              )


          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL ENCONTRADO:",
              len(novas)
          )

          print(
              "========================================"
          )


          # =========================================================
          # SE NENHUMA FONTE FUNCIONOU
          # =========================================================

          if len(novas) == 0:

              print(
                  "Nenhuma notícia encontrada."
              )

              print(
                  "JSON existente preservado."
              )

              raise SystemExit(0)


          # =========================================================
          # COMBINAR
          # =========================================================

          todas = novas + antigas


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}


          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              titulo = str(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).strip()


              chave = link.lower()


              if not chave:
                  chave = titulo.lower()


              if not chave:
                  continue


              if chave in unicas:

                  existente = unicas[
                      chave
                  ]

                  imagem_existente = str(
                      existente.get(
                          "imagem",
                          ""
                      )
                  ).strip()

                  imagem_nova = str(
                      noticia.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  # Preferir versão com imagem

                  if (
                      not imagem_existente
                      and imagem_nova
                  ):

                      unicas[
                          chave
                      ] = noticia

              else:

                  unicas[
                      chave
                  ] = noticia


          todas = list(
              unicas.values()
          )


          # =========================================================
          # RECUPERAR IMAGENS ANTIGAS
          # =========================================================

          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              if not imagem and link:

                  antiga = imagens_antigas.get(
                      link,
                      ""
                  )

                  if antiga:

                      noticia["imagem"] = antiga


          # =========================================================
          # ORDENAR
          # =========================================================

          def data_para_ordenacao(noticia):

              valor = noticia.get(
                  "data",
                  ""
              )

              try:

                  if valor.endswith(
                      "Z"
                  ):

                      valor = valor[:-1] + "+00:00"

                  return datetime.fromisoformat(
                      valor
                  )

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          todas.sort(
              key=data_para_ordenacao,
              reverse=True
          )


          # =========================================================
          # PEGAR 8
          # =========================================================

          resultado = todas[
              :LIMITE
          ]


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RELATÓRIO FINAL
          # =========================================================

          print("")
          print(
              "========================================"
          )

          print(
              "SUCESSO!"
          )

          print(
              "Notícias encontradas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print(
              "========================================"
          )


          for noticia in resultado:

              print(
                  "-",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "  fonte:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "  imagem:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )


          PY


