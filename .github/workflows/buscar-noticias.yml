```yaml
name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # BAIXAR REPOSITÓRIO
      # =========================================================

      - name: Baixar repositório
        uses: actions/checkout@v6


      # =========================================================
      # CONFIGURAR PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # =========================================================
      # INSTALAR DEPENDÊNCIAS
      # =========================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4


      # =========================================================
      # BUSCAR NOTÍCIAS
      # =========================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          ARQUIVO = "noticias.json"

          LIMITE_FINAL = 8

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },

              {
                  "nome": "G1",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              }

          ]


          # =========================================================
          # SESSÃO HTTP
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,"
                  "image/avif,image/webp,*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
                  "no-cache"

          })


          # =========================================================
          # LIMPAR TEXTO
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =========================================================
          # CRIAR ID
          # =========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # =========================================================
          # URL ABSOLUTA
          # =========================================================

          def normalizar_imagem(url, pagina):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              return urljoin(
                  pagina,
                  url
              )


          # =========================================================
          # IMAGEM VÁLIDA
          # =========================================================

          def imagem_valida(url):

              if not url:
                  return False

              url = url.lower()

              if not url.startswith("http"):
                  return False

              extensoes_ruins = [
                  ".svg",
                  ".ico"
              ]

              if any(
                  ext in url
                  for ext in extensoes_ruins
              ):
                  return False

              bloqueios = [
                  "favicon",
                  "sprite",
                  "placeholder",
                  "avatar",
                  "icon",
                  "icone",
                  "logo-menu",
                  "logo-footer"
              ]

              if any(
                  palavra in url
                  for palavra in bloqueios
              ):
                  return False

              return True


          # =========================================================
          # RESOLVER GOOGLE NEWS
          # =========================================================

          def resolver_link_google(link):

              if not link:
                  return ""

              if "news.google.com" not in link:
                  return link

              print("")
              print("RESOLVENDO LINK GOOGLE NEWS:")
              print(link)

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  final = resposta.url

                  print(
                      "URL FINAL:",
                      final
                  )

                  if final and "news.google.com" not in final:
                      return final

              except Exception as erro:

                  print(
                      "Erro ao resolver Google News:",
                      repr(erro)
                  )

              return link


          # =========================================================
          # IMAGEM JSON-LD
          # =========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          texto = script.get_text()

                      if not texto:
                          continue

                      dados = json.loads(texto)

                      objetos = []

                      if isinstance(
                          dados,
                          dict
                      ):

                          objetos.append(
                              dados
                          )

                          graph = dados.get(
                              "@graph"
                          )

                          if isinstance(
                              graph,
                              list
                          ):

                              objetos.extend(
                                  graph
                              )

                      elif isinstance(
                          dados,
                          list
                      ):

                          objetos.extend(
                              dados
                          )

                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagem = obj.get(
                              "image"
                          )

                          candidatos = []

                          if isinstance(
                              imagem,
                              str
                          ):

                              candidatos.append(
                                  imagem
                              )

                          elif isinstance(
                              imagem,
                              dict
                          ):

                              candidatos.extend([
                                  imagem.get("url"),
                                  imagem.get("contentUrl")
                              ])

                          elif isinstance(
                              imagem,
                              list
                          ):

                              for item in imagem:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      candidatos.append(
                                          item
                                      )

                                  elif isinstance(
                                      item,
                                      dict
                                  ):

                                      candidatos.extend([
                                          item.get("url"),
                                          item.get("contentUrl")
                                      ])

                          for candidato in candidatos:

                              candidato = normalizar_imagem(
                                  candidato,
                                  pagina
                              )

                              if imagem_valida(
                                  candidato
                              ):

                                  return candidato

                  except Exception:

                      continue

              return ""


          # =========================================================
          # PEGAR URL DE IMAGEM DE UM IMG
          # =========================================================

          def imagem_do_img(img, pagina):

              atributos = [

                  "src",

                  "data-src",

                  "data-original",

                  "data-lazy-src",

                  "data-image",

                  "data-url"

              ]

              for atributo in atributos:

                  valor = img.get(
                      atributo
                  )

                  if valor:

                      valor = normalizar_imagem(
                          valor,
                          pagina
                      )

                      if imagem_valida(
                          valor
                      ):

                          return valor


              # -----------------------------------------------------
              # SRCSET
              # -----------------------------------------------------

              for atributo in [
                  "srcset",
                  "data-srcset"
              ]:

                  valor = img.get(
                      atributo
                  )

                  if not valor:
                      continue

                  partes = valor.split(",")

                  melhor = ""

                  for parte in partes:

                      url = (
                          parte
                          .strip()
                          .split(" ")[0]
                      )

                      url = normalizar_imagem(
                          url,
                          pagina
                      )

                      if imagem_valida(
                          url
                      ):

                          melhor = url

                  if melhor:
                      return melhor

              return ""


          # =========================================================
          # PROCURAR IMAGEM NO CARD DA NOTÍCIA
          # =========================================================

          def extrair_imagem_do_card(a, pagina):

              # -----------------------------------------------------
              # 1 - própria tag <a>
              # -----------------------------------------------------

              img = a.find("img")

              if img:

                  imagem = imagem_do_img(
                      img,
                      pagina
                  )

                  if imagem:
                      return imagem


              # -----------------------------------------------------
              # 2 - pai imediato
              # -----------------------------------------------------

              atual = a

              for nivel in range(1, 7):

                  atual = atual.parent

                  if not atual:
                      break

                  imgs = atual.find_all(
                      "img"
                  )

                  if not imgs:
                      continue

                  candidatos = []

                  for img in imgs:

                      imagem = imagem_do_img(
                          img,
                          pagina
                      )

                      if imagem:

                          candidatos.append(
                              imagem
                          )

                  if not candidatos:
                      continue


                  # -------------------------------------------------
                  # Preferência Diário do Pará
                  # -------------------------------------------------

                  for imagem in candidatos:

                      if (
                          "uploads.diariodopara.com.br"
                          in imagem.lower()
                      ):

                          return imagem


                  # -------------------------------------------------
                  # Preferência G1
                  # -------------------------------------------------

                  for imagem in candidatos:

                      if (
                          "glbimg.com"
                          in imagem.lower()
                      ):

                          return imagem


                  # -------------------------------------------------
                  # Qualquer imagem
                  # -------------------------------------------------

                  return candidatos[0]


              return ""


          # =========================================================
          # EXTRAIR IMAGEM DA MATÉRIA
          # =========================================================

          def extrair_imagem_pagina(link):

              print("")
              print("------------------------------------")
              print("BUSCANDO IMAGEM:")
              print(link)

              try:

                  resposta = sessao.get(
                      link,
                      timeout=30,
                      allow_redirects=True
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  print(
                      "URL FINAL:",
                      resposta.url
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # -------------------------------------------------
                  # OG IMAGE
                  # -------------------------------------------------

                  metas = [

                      ("property", "og:image"),

                      ("property", "og:image:url"),

                      ("name", "twitter:image"),

                      ("name", "twitter:image:src")

                  ]

                  for atributo, valor in metas:

                      meta = soup.find(
                          "meta",
                          attrs={
                              atributo: valor
                          }
                      )

                      if meta:

                          imagem = meta.get(
                              "content",
                              ""
                          )

                          imagem = normalizar_imagem(
                              imagem,
                              resposta.url
                          )

                          if imagem_valida(
                              imagem
                          ):

                              print(
                                  "IMAGEM OG:",
                                  imagem
                              )

                              return imagem


                  # -------------------------------------------------
                  # JSON-LD
                  # -------------------------------------------------

                  imagem = imagem_jsonld(
                      soup,
                      resposta.url
                  )

                  if imagem:

                      print(
                          "IMAGEM JSON-LD:",
                          imagem
                      )

                      return imagem


                  # -------------------------------------------------
                  # LINK IMAGE_SRC
                  # -------------------------------------------------

                  for link_tag in soup.find_all(
                      "link"
                  ):

                      rel = link_tag.get(
                          "rel",
                          []
                      )

                      if isinstance(
                          rel,
                          str
                      ):

                          rel = [rel]

                      if "image_src" in rel:

                          imagem = normalizar_imagem(
                              link_tag.get(
                                  "href",
                                  ""
                              ),
                              resposta.url
                          )

                          if imagem_valida(
                              imagem
                          ):

                              print(
                                  "IMAGEM IMAGE_SRC:",
                                  imagem
                              )

                              return imagem


                  # -------------------------------------------------
                  # IMAGENS DO ARTICLE
                  # -------------------------------------------------

                  article = (
                      soup.find("article")
                      or soup.find("main")
                  )

                  if article:

                      for img in article.find_all(
                          "img"
                      ):

                          imagem = imagem_do_img(
                              img,
                              resposta.url
                          )

                          if imagem:

                              print(
                                  "IMAGEM ARTICLE:",
                                  imagem
                              )

                              return imagem


                  # -------------------------------------------------
                  # QUALQUER IMAGEM
                  # -------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      imagem = imagem_do_img(
                          img,
                          resposta.url
                      )

                      if imagem:

                          print(
                              "IMAGEM HTML:",
                              imagem
                          )

                          return imagem


              except Exception as erro:

                  print(
                      "ERRO IMAGEM:",
                      repr(erro)
                  )

              print(
                  "NENHUMA IMAGEM ENCONTRADA"
              )

              return ""


          # =========================================================
          # IMAGEM DO ITEM RSS
          # =========================================================

          def imagem_do_item(item):

              # -----------------------------------------------------
              # media_content
              # -----------------------------------------------------

              try:

                  for media in item.get(
                      "media_content",
                      []
                  ):

                      url = media.get(
                          "url"
                      )

                      if url:

                          return url

              except Exception:

                  pass


              # -----------------------------------------------------
              # media_thumbnail
              # -----------------------------------------------------

              try:

                  for media in item.get(
                      "media_thumbnail",
                      []
                  ):

                      url = media.get(
                          "url"
                      )

                      if url:

                          return url

              except Exception:

                  pass


              # -----------------------------------------------------
              # enclosure
              # -----------------------------------------------------

              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or
                          enclosure.get("url")
                      )

                      if url:

                          return url

              except Exception:

                  pass


              # -----------------------------------------------------
              # IMAGEM DENTRO DO DESCRIPTION
              # -----------------------------------------------------

              try:

                  html = (
                      item.get(
                          "summary",
                          ""
                      )
                      or
                      item.get(
                          "description",
                          ""
                      )
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find(
                      "img"
                  )

                  if img:

                      url = (
                          img.get("src")
                          or
                          img.get("data-src")
                          or
                          img.get("data-original")
                          or
                          ""
                      )

                      if url:

                          return url

              except Exception:

                  pass


              return ""


          # =========================================================
          # BLOQUEIOS
          # =========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras = [
                  "mixvale",
                  "mix vale"
              ]

              for palavra in palavras:

                  if palavra in texto:
                      return True

              return False


          # =========================================================
          # LER JSON EXISTENTE
          # =========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []

              except Exception as erro:

                  print(
                      "ERRO LENDO JSON:",
                      repr(erro)
                  )


          print("")
          print(
              "NOTÍCIAS EXISTENTES:",
              len(antigas)
          )


          # =========================================================
          # MAPA DE NOTÍCIAS EXISTENTES
          # =========================================================

          antigas_por_link = {}

          imagens_antigas = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()

              if link:

                  antigas_por_link[
                      link
                  ] = noticia

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          # =========================================================
          # BUSCAR RSS
          # =========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "===================================="
              )
              print(
                  "RSS:",
                  fonte["nome"]
              )
              print(
                  "===================================="
              )

              resultado = []

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP RSS:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:

                      return []


                  feed = feedparser.parse(
                      resposta.content
                  )


                  for item in feed.entries[:15]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link_original = item.get(
                          "link",
                          ""
                      )

                      if not titulo or not link_original:
                          continue


                      if bloqueada(
                          titulo,
                          link_original
                      ):
                          continue


                      # -------------------------------------------------
                      # RESOLVER GOOGLE NEWS
                      # -------------------------------------------------

                      link = resolver_link_google(
                          link_original
                      )


                      # -------------------------------------------------
                      # DESCRIÇÃO
                      # -------------------------------------------------

                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      # -------------------------------------------------
                      # IMAGEM RSS
                      # -------------------------------------------------

                      imagem = imagem_do_item(
                          item
                      )


                      if imagem:

                          imagem = normalizar_imagem(
                              imagem,
                              link
                          )


                      # -------------------------------------------------
                      # IMAGEM ANTIGA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link_original,
                              ""
                          )


                      # -------------------------------------------------
                      # BUSCAR IMAGEM NA MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # DATA
                      # -------------------------------------------------

                      data = ""

                      try:

                          if item.get(
                              "published_parsed"
                          ):

                              data = datetime.fromtimestamp(
                                  time.mktime(
                                      item.published_parsed
                                  ),
                                  timezone.utc
                              ).isoformat()

                      except Exception:

                          pass


                      if not data:

                          data = datetime.now(
                              timezone.utc
                          ).isoformat()


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              data,

                          "categoria":
                              "PARÁ"

                      })


                      print("")
                      print(
                          "NOTÍCIA:",
                          titulo
                      )

                      print(
                          "LINK:",
                          link
                      )

                      print(
                          "IMAGEM:",
                          imagem
                      )


                  return resultado


              except Exception as erro:

                  print(
                      "ERRO RSS:",
                      repr(erro)
                  )

                  return []


          # =========================================================
          # BUSCAR PÁGINA
          # =========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "===================================="
              )
              print(
                  "PÁGINA:",
                  fonte["nome"]
              )
              print(
                  "===================================="
              )

              resultado = []

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:

                      return []


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  links_vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue


                      if len(titulo) < 25:
                          continue


                      if len(titulo) > 220:
                          continue


                      link = urljoin(
                          fonte["url"],
                          href
                      )


                      if not link.startswith(
                          "http"
                      ):
                          continue


                      caminho = link.lower()


                      # -------------------------------------------------
                      # DOMÍNIO
                      # -------------------------------------------------

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in caminho:
                              continue


                      if fonte["nome"] == "G1":

                          if "g1.globo.com" not in caminho:
                              continue


                      # -------------------------------------------------
                      # LINKS DUPLICADOS
                      # -------------------------------------------------

                      if link in links_vistos:
                          continue

                      links_vistos.add(
                          link
                      )


                      # -------------------------------------------------
                      # BLOQUEIOS
                      # -------------------------------------------------

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      bloqueios = [

                          "/busca",

                          "/login",

                          "/newsletter",

                          "/videos",

                          "/video/",

                          "/webstories",

                          "/podcasts",

                          "/programas",

                          "/ao-vivo",

                          "#"

                      ]


                      if any(
                          trecho in caminho
                          for trecho in bloqueios
                      ):

                          continue


                      # -------------------------------------------------
                      # G1
                      # -------------------------------------------------

                      if fonte["nome"] == "G1":

                          if "/noticia/" not in caminho:

                              continue


                      # -------------------------------------------------
                      # O LIBERAL
                      # -------------------------------------------------

                      if fonte["nome"] == "O Liberal":

                          secoes = [

                              "/policia/",

                              "/para/",

                              "/belem/",

                              "/amazonia/",

                              "/politica/",

                              "/economia/",

                              "/esportes/",

                              "/entretenimento/",

                              "/mundo/",

                              "/brasil/",

                              "/tecnologia/",

                              "/cultura/",

                              "/saude/",

                              "/concursos/"

                          ]

                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):

                              continue


                      # -------------------------------------------------
                      # IMAGEM DO CARD
                      # -------------------------------------------------

                      imagem = extrair_imagem_do_card(
                          a,
                          resposta.url
                      )


                      # -------------------------------------------------
                      # IMAGEM ANTIGA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      # -------------------------------------------------
                      # IMAGEM DA MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # SALVAR
                      # -------------------------------------------------

                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print("")
                      print(
                          "NOTÍCIA:",
                          titulo
                      )

                      print(
                          "IMAGEM:",
                          imagem
                      )


                      # -------------------------------------------------
                      # LIMITE DA FONTE
                      # -------------------------------------------------

                      if len(resultado) >= 8:

                          break


                  print("")
                  print(
                      "TOTAL DA FONTE:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "ERRO PÁGINA:",
                      repr(erro)
                  )

                  return []


          # =========================================================
          # EXECUTAR FONTES
          # =========================================================

          novas = []


          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_fonte = buscar_rss(
                      fonte
                  )

              else:

                  noticias_fonte = buscar_pagina(
                      fonte
                  )


              novas.extend(
                  noticias_fonte
              )


          print("")
          print(
              "===================================="
          )
          print(
              "TOTAL ENCONTRADO:",
              len(novas)
          )
          print(
              "===================================="
          )


          # =========================================================
          # SE NENHUMA FONTE RESPONDEU
          # =========================================================

          if len(novas) == 0:

              print(
                  "Nenhuma notícia encontrada."
              )

              print(
                  "JSON existente será preservado."
              )

              raise SystemExit(0)


          # =========================================================
          # COMBINAR
          # =========================================================

          todas = novas + antigas


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}


          for noticia in todas:

              titulo = str(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).strip()

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              if not titulo and not link:
                  continue


              chave = (
                  link.lower()
                  if link
                  else titulo.lower()
              )


              if chave not in unicas:

                  unicas[
                      chave
                  ] = noticia

              else:

                  existente = unicas[
                      chave
                  ]


                  imagem_existente = str(
                      existente.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  imagem_nova = str(
                      noticia.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  # -------------------------------------------------
                  # SEMPRE PREFERIR A VERSÃO COM IMAGEM
                  # -------------------------------------------------

                  if (
                      not imagem_existente
                      and imagem_nova
                  ):

                      unicas[
                          chave
                      ] = noticia


          todas = list(
              unicas.values()
          )


          # =========================================================
          # RECUPERAR IMAGENS ANTIGAS
          # =========================================================

          for noticia in todas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              if not noticia.get(
                  "imagem",
                  ""
              ):

                  imagem = imagens_antigas.get(
                      link,
                      ""
                  )

                  if imagem:

                      noticia[
                          "imagem"
                      ] = imagem


          # =========================================================
          # REMOVER NOTÍCIAS SEM TÍTULO
          # =========================================================

          todas = [

              noticia

              for noticia in todas

              if noticia.get(
                  "titulo",
                  ""
              ).strip()

          ]


          # =========================================================
          # ORDENAR POR DATA
          # =========================================================

          def data_ordenacao(noticia):

              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=data_ordenacao,
              reverse=True
          )


          # =========================================================
          # PEGAR AS 8 MAIS RECENTES
          # =========================================================

          resultado = todas[
              :LIMITE_FINAL
          ]


          # =========================================================
          # SALVAR JSON
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RELATÓRIO FINAL
          # =========================================================

          print("")
          print(
              "===================================="
          )
          print(
              "SUCESSO!"
          )
          print(
              "===================================="
          )

          print(
              "Notícias coletadas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print(
              "===================================="
          )


          for noticia in resultado:

              print("")
              print(
                  "TÍTULO:",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "FONTE:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "LINK:",
                  noticia.get(
                      "link",
                      ""
                  )
              )

              print(
                  "IMAGEM:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )


          PY


      # =========================================================
      # SALVAR NO GITHUB
      # =========================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias e imagens"

          git push
