name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        shell: python
        run: |

          import json
          import os
          import re
          import time
          import hashlib
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone


          ARQUIVO = "noticias.json"
          PASTA_IMAGENS = "imagens"

          QUANTIDADE_MAXIMA = 8


          CONSULTAS = [
              "Pará",
              "Belém Pará",
              "Ananindeua Pará",
              "Tomé-Açu Pará",
              "Bragança Pará",
              "Capanema Pará",
              "Castanhal Pará",
              "Marituba Pará",
              "Paragominas Pará",
              "Abaetetuba Pará",
              "Brasil"
          ]


          FONTES_BLOQUEADAS = [
              "mix vale",
              "mixvale"
          ]


          DOMINIOS_BLOQUEADOS = [
              "mixvale.com.br",
              "mixvale"
          ]


          os.makedirs(
              PASTA_IMAGENS,
              exist_ok=True
          )


          # ---------------------------------------------------------
          # FUNÇÕES
          # ---------------------------------------------------------

          def limpar_texto(texto):

              if not texto:
                  return ""

              texto = re.sub(
                  r"<[^>]+>",
                  "",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def gerar_id(link, titulo):

              base = (
                  link
                  or titulo
                  or ""
              ).encode("utf-8")

              return hashlib.md5(
                  base
              ).hexdigest()


          def buscar_url(url, tentativas=4):

              headers = {
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/131.0 Safari/537.36",

                  "Accept":
                      "text/html,application/xhtml+xml,"
                      "application/xml;q=0.9,*/*;q=0.8",

                  "Accept-Language":
                      "pt-BR,pt;q=0.9"
              }


              for tentativa in range(tentativas):

                  try:

                      requisicao = urllib.request.Request(
                          url,
                          headers=headers
                      )

                      with urllib.request.urlopen(
                          requisicao,
                          timeout=25
                      ) as resposta:

                          return resposta.read()


                  except urllib.error.HTTPError as erro:

                      if erro.code == 429:

                          espera = 5 * (
                              tentativa + 1
                          )

                          print(
                              f"HTTP 429. "
                              f"Aguardando {espera}s..."
                          )

                          time.sleep(
                              espera
                          )

                          continue


                      print(
                          f"HTTP {erro.code}: {url}"
                      )

                      return None


                  except Exception as erro:

                      print(
                          f"Erro: {erro}"
                      )

                      if tentativa < tentativas - 1:
                          time.sleep(3)


              return None


          def extrair_texto(item, nomes):

              for nome in nomes:

                  elemento = item.find(nome)

                  if (
                      elemento is not None
                      and elemento.text
                  ):

                      return limpar_texto(
                          elemento.text
                      )

              return ""


          def extrair_link(item):

              elemento = item.find("link")

              if elemento is not None:

                  if elemento.text:
                      return elemento.text.strip()

                  href = elemento.attrib.get(
                      "href"
                  )

                  if href:
                      return href.strip()


              # Atom
              for elemento in item.findall(
                  "{http://www.w3.org/2005/Atom}link"
              ):

                  href = elemento.attrib.get(
                      "href"
                  )

                  if href:
                      return href.strip()


              return ""


          def extrair_fonte(item):

              # Google News RSS
              for elemento in item.iter():

                  tag = elemento.tag.lower()

                  if tag.endswith("source"):

                      if elemento.text:

                          return limpar_texto(
                              elemento.text
                          )


              return ""


          def extrair_imagem(item):

              # media:content
              for elemento in item.iter():

                  tag = elemento.tag.lower()

                  if (
                      tag.endswith("content")
                      or tag.endswith("thumbnail")
                  ):

                      url = elemento.attrib.get(
                          "url"
                      )

                      if url:
                          return url


              # enclosure
              enclosure = item.find(
                  "enclosure"
              )

              if enclosure is not None:

                  url = enclosure.attrib.get(
                      "url"
                  )

                  if url:
                      return url


              # descrição
              descricao = extrair_texto(
                  item,
                  [
                      "description",
                      "{http://www.w3.org/2005/Atom}summary"
                  ]
              )


              if descricao:

                  encontrado = re.search(
                      r'https?://[^"\']+'
                      r'\.(?:jpg|jpeg|png|webp)',
                      descricao,
                      re.IGNORECASE
                  )

                  if encontrado:

                      return encontrado.group(0)


              return ""


          def fonte_bloqueada(
              fonte,
              link
          ):

              fonte_lower = (
                  fonte or ""
              ).lower()

              link_lower = (
                  link or ""
              ).lower()


              for termo in FONTES_BLOQUEADAS:

                  if termo in fonte_lower:
                      return True


              for dominio in DOMINIOS_BLOQUEADOS:

                  if dominio in link_lower:
                      return True


              return False


          def baixar_imagem(
              url,
              id_noticia
          ):

              if not url:
                  return ""


              try:

                  extensao = ".jpg"

                  url_lower = url.lower()

                  if ".png" in url_lower:
                      extensao = ".png"

                  elif ".webp" in url_lower:
                      extensao = ".webp"

                  elif ".jpeg" in url_lower:
                      extensao = ".jpeg"


                  nome_arquivo = (
                      id_noticia
                      + extensao
                  )

                  caminho = os.path.join(
                      PASTA_IMAGENS,
                      nome_arquivo
                  )


                  headers = {
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/131.0 Safari/537.36",

                      "Referer":
                          "https://news.google.com/"
                  }


                  requisicao = urllib.request.Request(
                      url,
                      headers=headers
                  )


                  with urllib.request.urlopen(
                      requisicao,
                      timeout=25
                  ) as resposta:

                      dados = resposta.read()


                  if not dados:
                      return ""


                  with open(
                      caminho,
                      "wb"
                  ) as arquivo:

                      arquivo.write(dados)


                  print(
                      f"Imagem salva: {caminho}"
                  )


                  return (
                      "https://raw.githubusercontent.com/"
                      "jafmaovivo-pixel/"
                      "radioja-noticias/"
                      "main/"
                      "imagens/"
                      + nome_arquivo
                  )


              except Exception as erro:

                  print(
                      f"Não foi possível baixar "
                      f"a imagem: {url}"
                  )

                  print(
                      f"Motivo: {erro}"
                  )

                  return ""


          def processar_feed(
              xml,
              consulta
          ):

              noticias = []


              try:

                  raiz = ET.fromstring(
                      xml
                  )

              except Exception as erro:

                  print(
                      f"Erro no XML: {erro}"
                  )

                  return noticias


              itens = raiz.findall(
                  ".//item"
              )


              if not itens:

                  itens = raiz.findall(
                      ".//{http://www.w3.org/2005/Atom}entry"
                  )


              for item in itens:

                  titulo = extrair_texto(
                      item,
                      [
                          "title",
                          "{http://www.w3.org/2005/Atom}title"
                      ]
                  )


                  link = extrair_link(
                      item
                  )


                  descricao = extrair_texto(
                      item,
                      [
                          "description",
                          "summary",
                          "{http://www.w3.org/2005/Atom}summary"
                      ]
                  )


                  data = extrair_texto(
                      item,
                      [
                          "pubDate",
                          "published",
                          "updated",
                          "{http://www.w3.org/2005/Atom}published",
                          "{http://www.w3.org/2005/Atom}updated"
                      ]
                  )


                  fonte = extrair_fonte(
                      item
                  )


                  imagem_original = (
                      extrair_imagem(
                          item
                      )
                  )


                  if not titulo or not link:
                      continue


                  if fonte_bloqueada(
                      fonte,
                      link
                  ):
                      continue


                  id_noticia = gerar_id(
                      link,
                      titulo
                  )


                  imagem_local = (
                      baixar_imagem(
                          imagem_original,
                          id_noticia
                      )
                  )


                  noticia = {

                      "id":
                          id_noticia,

                      "titulo":
                          titulo,

                      "descricao":
                          descricao,

                      "link":
                          link,

                      "fonte":
                          fonte
                          or "Rádio JA FM",

                      "imagem":
                          imagem_local,

                      "data":
                          data,

                      "categoria":
                          "PARÁ"
                  }


                  noticias.append(
                      noticia
                  )


              return noticias


          # ---------------------------------------------------------
          # LER NOTÍCIAS ANTIGAS
          # ---------------------------------------------------------

          noticias_antigas = []


          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      if isinstance(
                          dados.get("noticias"),
                          list
                      ):

                          noticias_antigas = (
                              dados["noticias"]
                          )


              except Exception as erro:

                  print(
                      f"Erro lendo noticias.json: "
                      f"{erro}"
                  )


          # ---------------------------------------------------------
          # BUSCAR
          # ---------------------------------------------------------

          noticias_novas = []


          for consulta in CONSULTAS:

              print("")
              print(
                  "=" * 60
              )
              print(
                  f"Consultando: {consulta}"
              )
              print(
                  "=" * 60
              )


              parametros = urllib.parse.urlencode({

                  "q":
                      consulta,

                  "hl":
                      "pt-BR",

                  "gl":
                      "BR",

                  "ceid":
                      "BR:pt-419"

              })


              url = (
                  "https://news.google.com/rss/search?"
                  + parametros
              )


              xml = buscar_url(
                  url
              )


              if not xml:

                  print(
                      f"Consulta falhou: {consulta}"
                  )

                  time.sleep(2)

                  continue


              encontrados = processar_feed(
                  xml,
                  consulta
              )


              print(
                  f"Encontradas: "
                  f"{len(encontrados)}"
              )


              noticias_novas.extend(
                  encontrados
              )


              time.sleep(2)


          # ---------------------------------------------------------
          # REMOVER DUPLICADAS
          # ---------------------------------------------------------

          todas = []
          vistos = set()


          for noticia in noticias_novas:

              chave = (
                  noticia.get("link")
                  or noticia.get("titulo")
                  or noticia.get("id")
              )


              if chave in vistos:
                  continue


              vistos.add(
                  chave
              )

              todas.append(
                  noticia
              )


          # Notícias antigas somente como reserva
          for noticia in noticias_antigas:

              chave = (
                  noticia.get("link")
                  or noticia.get("titulo")
                  or noticia.get("id")
              )


              if chave in vistos:
                  continue


              if fonte_bloqueada(
                  noticia.get("fonte", ""),
                  noticia.get("link", "")
              ):
                  continue


              vistos.add(
                  chave
              )

              todas.append(
                  noticia
              )


          # ---------------------------------------------------------
          # ORDENAR
          # ---------------------------------------------------------

          todas.sort(
              key=lambda x:
                  x.get("data", ""),
              reverse=True
          )


          noticias_finais = (
              todas[:QUANTIDADE_MAXIMA]
          )


          # ---------------------------------------------------------
          # PRESERVAR SE NÃO HOUVER RESULTADO
          # ---------------------------------------------------------

          if not noticias_finais:

              print(
                  "Nenhuma notícia nova."
              )

              noticias_finais = (
                  noticias_antigas[
                      :QUANTIDADE_MAXIMA
                  ]
              )


          # ---------------------------------------------------------
          # JSON FINAL
          # ---------------------------------------------------------

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias_finais

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "=" * 60
          )
          print(
              f"NOTÍCIAS SALVAS: "
              f"{len(noticias_finais)}"
          )
          print(
              "=" * 60
          )


      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email \
            "radiojafm@users.noreply.github.com"

          git add noticias.json
          git add imagens/

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit \
              -m "Atualizar noticias e imagens"

            git push

          fi
