name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |
          python3 - <<'PY'

          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import unicodedata
          from datetime import datetime, timezone


          API_KEY = os.environ["NEWSDATA_API_KEY"]

          API_URL = "https://newsdata.io/api/1/latest"


          # =====================================================
          # CONFIGURAÇÕES
          # =====================================================

          LIMITE_NOTICIAS = 8


          # =====================================================
          # FONTES / TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [
              "mix vale",
              "mixvale",
              "mixvale.com.br"
          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [
              "tomé-açu",
              "tomé açu",
              "tome-acu",
              "tome acu",
              "tomeaçu",
              "tomeacu"
          ]


          # =====================================================
          # BELÉM E REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [
              "belém",
              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do pará",
              "santa izabel do para",
              "santa bárbara do pará",
              "santa barbara do para"
          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [
              "castanhal",
              "bragança",
              "braganca",
              "capanema",
              "salinópolis",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cametá",
              "cameta",
              "vigia",
              "capitão poço",
              "capitao poco",
              "igarapé-açu",
              "igarape-acu"
          ]


          # =====================================================
          # OUTRAS CIDADES IMPORTANTES DO PARÁ
          # =====================================================

          OUTRAS_CIDADES_PARA = [
              "santarém",
              "santarem",
              "altamira",
              "marabá",
              "maraba",
              "parauapebas",
              "redenção",
              "redencao",
              "tucuruí",
              "tucurui",
              "tailândia",
              "tailandia",
              "moju",
              "itaituba",
              "breves",
              "cametá",
              "cameta",
              "óbidos",
              "obidos",
              "juruti",
              "ourilândia",
              "ourilandia",
              "xinguara",
              "dom eliseu",
              "ulianópolis",
              "ulianopolis",
              "tomé-açu",
              "tome acu"
          ]


          # =====================================================
          # TERMOS QUE IDENTIFICAM O ESTADO DO PARÁ
          # =====================================================

          PARA = [
              "pará",
              "paraense",
              "paraenses",
              "estado do pará",
              "estado do para",
              "governo do pará",
              "governo do para",
              "assembleia legislativa do pará",
              "assembleia legislativa do para",
              "polícia do pará",
              "policia do para",
              "polícia civil do pará",
              "policia civil do para",
              "polícia militar do pará",
              "policia militar do para",
              "tribunal de justiça do pará",
              "tribunal de justiça do para",
              "ministério público do pará",
              "ministerio publico do para",
              "defensoria pública do pará",
              "defensoria publica do para",
              "ufpa",
              "ifpa",
              "uepa"
          ]


          # =====================================================
          # OUTROS ESTADOS / REGIÕES
          #
          # Usados para evitar que uma notícia nacional seja
          # interpretada como notícia do Pará apenas porque
          # menciona uma cidade paraense.
          # =====================================================

          OUTRAS_REGIOES = [

              "acre",
              "alagoas",
              "amapá",
              "amapa",
              "amazonas",

              "bahia",
              "salvador",

              "ceará",
              "ceara",
              "fortaleza",

              "distrito federal",
              "brasília",
              "brasilia",

              "espírito santo",
              "espirito santo",

              "goiás",
              "goias",
              "goiânia",
              "goiania",

              "maranhão",
              "maranhao",
              "são luís",
              "sao luis",

              "mato grosso",
              "mato grosso do sul",

              "minas gerais",
              "belo horizonte",

              "paraíba",
              "paraiba",
              "joão pessoa",
              "joao pessoa",

              "paraná",
              "parana",
              "curitiba",

              "pernambuco",
              "recife",

              "piauí",
              "piaui",
              "teresina",

              "rio de janeiro",
              "rio grande do norte",
              "rio grande do sul",

              "rondônia",
              "rondonia",

              "roraima",

              "santa catarina",

              "são paulo",
              "sao paulo",

              "sergipe",

              "tocantins",

              "mato grosso"
          ]


          # =====================================================
          # TERMOS NACIONAIS
          #
          # Esses assuntos frequentemente produzem matérias
          # nacionais que citam o Pará apenas em listas.
          # =====================================================

          ASSUNTOS_NACIONAIS = [

              "inss",
              "previdência social",
              "previdencia social",
              "meu inss",

              "imposto de renda",
              "receita federal",

              "fgts",
              "abono salarial",
              "pis/pasep",
              "pis pasep",

              "bolsa família",
              "bolsa familia",

              "cadúnico",
              "cadunico",

              "seguro-desemprego",
              "seguro desemprego",

              "saque aniversário",
              "saque aniversario",

              "benefício social",
              "beneficio social",

              "concurso nacional",

              "governo federal",

              "câmara dos deputados",
              "camara dos deputados",

              "senado federal",

              "supremo tribunal federal",
              "stf",

              "eleições 2026",
              "eleicoes 2026"
          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFKD",
                  texto
              )

              texto = "".join(
                  c for c in texto
                  if not unicodedata.combining(c)
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # TEXTO COMPLETO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # BUSCAR API
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta
              }


              url = (

                  API_URL +

                  "?" +

                  urllib.parse.urlencode(
                      parametros
                  )
              )


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={
                          "User-Agent":
                          "RadioJA-FM-News/2.0"
                      }
                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      dados = json.loads(

                          resposta
                          .read()
                          .decode("utf-8")
                      )


                  return dados.get(
                      "results",
                      []
                  )


              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # VERIFICAR BLOQUEIOS
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )


              texto = " ".join([

                  titulo,

                  descricao,

                  fonte
              ])


              for termo in BLOQUEADOS:

                  if normalizar(termo) in texto:

                      return True


              for termo in BLOQUEADOS:

                  if normalizar(termo) in link:

                      return True


              return False


          # =====================================================
          # VALIDAR CAMPOS BÁSICOS
          # =====================================================

          def campos_validos(item):

              if not item.get("title"):

                  return False


              if not item.get("link"):

                  return False


              if bloqueada(item):

                  return False


              return True


          # =====================================================
          # CONTAR OCORRÊNCIAS
          # =====================================================

          def contar_termos(texto, termos):

              contador = 0

              for termo in termos:

                  termo_normalizado = normalizar(
                      termo
                  )

                  if termo_normalizado in texto:

                      contador += 1

              return contador


          # =====================================================
          # VERIFICAR OUTROS ESTADOS
          # =====================================================

          def menciona_outra_regiao(texto):

              encontrados = []

              for termo in OUTRAS_REGIOES:

                  termo_normalizado = normalizar(
                      termo
                  )

                  if termo_normalizado in texto:

                      encontrados.append(
                          termo_normalizado
                      )


              return encontrados


          # =====================================================
          # IDENTIFICAR SE É NOTÍCIA REALMENTE SOBRE O PARÁ
          #
          # IMPORTANTE:
          #
          # Não basta aparecer "Pará" na descrição.
          #
          # O Pará precisa aparecer no título OU existir uma
          # forte indicação regional.
          # =====================================================

          def e_realmente_do_para(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )


              texto = " ".join([

                  titulo,

                  descricao,

                  fonte
              ])


              # -------------------------------------------------
              # 1. Cidades específicas no TÍTULO
              # -------------------------------------------------

              if contar_termos(
                  titulo,
                  TOME_ACU
              ) > 0:

                  return True


              if contar_termos(
                  titulo,
                  BELEM_RMB
              ) > 0:

                  return True


              if contar_termos(
                  titulo,
                  NORDESTE_PARA
              ) > 0:

                  return True


              if contar_termos(
                  titulo,
                  OUTRAS_CIDADES_PARA
              ) > 0:

                  return True


              # -------------------------------------------------
              # 2. "Pará" ou termos oficiais no TÍTULO
              # -------------------------------------------------

              if contar_termos(
                  titulo,
                  PARA
              ) > 0:

                  return True


              # -------------------------------------------------
              # 3. Instituições paraenses no título
              # -------------------------------------------------

              instituicoes_para = [

                  "ufpa",
                  "ifpa",
                  "uepa",
                  "governo do para",
                  "governo do pará",
                  "policia do para",
                  "polícia do pará",
                  "tribunal de justiça do pará",
                  "tribunal de justiça do para"
              ]


              if contar_termos(
                  titulo,
                  instituicoes_para
              ) > 0:

                  return True


              # -------------------------------------------------
              # 4. Cidade + Pará no texto
              #
              # Isso é mais forte que simplesmente "Pará".
              # -------------------------------------------------

              cidades_para = (

                  TOME_ACU +

                  BELEM_RMB +

                  NORDESTE_PARA +

                  OUTRAS_CIDADES_PARA
              )


              cidade_encontrada = (
                  contar_termos(
                      texto,
                      cidades_para
                  ) > 0
              )


              para_encontrado = (
                  contar_termos(
                      texto,
                      PARA
                  ) > 0
              )


              if cidade_encontrada and para_encontrado:

                  return True


              # -------------------------------------------------
              # 5. Fonte claramente paraense
              # -------------------------------------------------

              fontes_para = [

                  "g1 - o portal",
                  "diário do pará",
                  "diario do para"
              ]


              if any(
                  fonte_nome in fonte
                  for fonte_nome in fontes_para
              ):

                  if para_encontrado:

                      return True


              # -------------------------------------------------
              # 6. Se aparecer outra região forte, rejeita.
              # -------------------------------------------------

              outras = menciona_outra_regiao(
                  titulo
              )


              if outras:

                  return False


              # -------------------------------------------------
              # 7. Apenas "Pará" na descrição não é suficiente.
              # -------------------------------------------------

              return False


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          def classificar(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              texto = " ".join([
                  titulo,
                  descricao
              ])


              if contar_termos(
                  titulo,
                  TOME_ACU
              ) > 0:

                  return "TOMÉ-AÇU"


              if contar_termos(
                  titulo,
                  BELEM_RMB
              ) > 0:

                  return "BELÉM/RMB"


              if contar_termos(
                  titulo,
                  NORDESTE_PARA
              ) > 0:

                  return "NORDESTE DO PARÁ"


              if contar_termos(
                  titulo,
                  OUTRAS_CIDADES_PARA
              ) > 0:

                  return "PARÁ"


              if contar_termos(
                  titulo,
                  PARA
              ) > 0:

                  return "PARÁ"


              return "PARÁ"


          # =====================================================
          # CONVERTER NOTÍCIA
          # =====================================================

          def converter(item):

              return {

                  "id":
                      item.get(
                          "article_id"
                      ),

                  "titulo":
                      item.get(
                          "title"
                      ),

                  "descricao":
                      item.get(
                          "description"
                      ),

                  "link":
                      item.get(
                          "link"
                      ),

                  "fonte":
                      item.get(
                          "source_name"
                      ),

                  "imagem":
                      item.get(
                          "image_url"
                      ),

                  "data":
                      item.get(
                          "pubDate"
                      )
              }


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -------------------------------
              # TOMÉ-AÇU
              # -------------------------------

              '"Tomé-Açu"',

              '"Tome Acu"',


              # -------------------------------
              # BELÉM / RMB
              # -------------------------------

              '"Belém"',

              '"Ananindeua"',

              '"Marituba"',

              '"Benevides"',

              '"Santa Izabel do Pará"',


              # -------------------------------
              # NORDESTE DO PARÁ
              # -------------------------------

              '"Castanhal"',

              '"Bragança"',

              '"Capanema"',

              '"Salinópolis"',

              '"Paragominas"',

              '"Barcarena"',

              '"Abaetetuba"',

              '"Cametá"',

              '"Vigia"',

              '"Capitão Poço"',

              '"Igarapé-Açu"',


              # -------------------------------
              # OUTRAS CIDADES
              # -------------------------------

              '"Santarém"',

              '"Altamira"',

              '"Marabá"',

              '"Parauapebas"',

              '"Redenção"',

              '"Tucuruí"',

              '"Tailândia"',

              '"Moju"',

              '"Itaituba"',


              # -------------------------------
              # PARÁ
              # -------------------------------

              '"Pará"',

              '"governo do Pará"',

              '"polícia do Pará"',

              '"UFPA"',

              '"IFPA"',

              '"UEPA"',


              # -------------------------------
              # BRASIL
              #
              # Mantido somente como consulta
              # secundária.
              # -------------------------------

              '"Brasil"'
          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print(
                  "BUSCANDO:",
                  consulta
              )


              resultados = buscar(
                  consulta
              )


              print(
                  "RESULTADOS:",
                  len(resultados)
              )


              for item in resultados:

                  if not campos_validos(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:

                      continue


                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # FILTRAR NOTÍCIAS
          # =====================================================

          filtradas = []


          for item in candidatos.values():

              if e_realmente_do_para(item):

                  filtradas.append(item)


          print("")
          print(
              "NOTÍCIAS REALMENTE DO PARÁ:",
              len(filtradas)
          )


          # =====================================================
          # CLASSIFICAR
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []


          for item in filtradas:

              categoria = classificar(
                  item
              )


              if categoria == "TOMÉ-AÇU":

                  tome_acu.append(item)


              elif categoria == "BELÉM/RMB":

                  belem.append(item)


              elif categoria == "NORDESTE DO PARÁ":

                  nordeste.append(item)


              else:

                  para.append(item)


          print("")
          print(
              "TOMÉ-AÇU:",
              len(tome_acu)
          )

          print(
              "BELÉM/RMB:",
              len(belem)
          )

          print(
              "NORDESTE DO PARÁ:",
              len(nordeste)
          )

          print(
              "OUTRAS DO PARÁ:",
              len(para)
          )


          # =====================================================
          # REMOÇÃO DE DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(

                  r"[^a-z0-9 ]",

                  " ",

                  titulo
              )


              titulo = re.sub(

                  r"\s+",

                  " ",

                  titulo
              )


              return titulo.strip()


          # =====================================================
          # DETECTAR TÍTULOS SEMELHANTES
          # =====================================================

          def palavras_titulo(titulo):

              texto = titulo_normalizado(
                  titulo
              )


              palavras = texto.split()


              palavras = [

                  p for p in palavras

                  if len(p) >= 4
              ]


              return set(palavras)


          def titulo_parecido(titulo):

              palavras_novas = palavras_titulo(
                  titulo
              )


              if not palavras_novas:

                  return False


              for titulo_existente in titulos_usados:

                  palavras_existentes = palavras_titulo(
                      titulo_existente
                  )


                  if not palavras_existentes:

                      continue


                  intersecao = (
                      palavras_novas &
                      palavras_existentes
                  )


                  menor = min(

                      len(palavras_novas),

                      len(palavras_existentes)
                  )


                  if menor > 0:

                      semelhanca = (
                          len(intersecao)
                          /
                          menor
                      )


                      if semelhanca >= 0.70:

                          return True


              return False


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE_NOTICIAS:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo_original = (
                  item.get("title") or ""
              )


              titulo = titulo_normalizado(
                  titulo_original
              )


              if not link:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              if titulo_parecido(
                  titulo_original
              ):

                  print(
                      "DUPLICADA SEMELHANTE:",
                      titulo_original
                  )

                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticia = converter(
                  item
              )


              noticias.append(
                  noticia
              )


              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"
              )


              return True


          # =====================================================
          # PRIORIDADE 1
          #
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          #
          # BELÉM / RMB
          #
          # MÁXIMO 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1


              if contador_belem >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          #
          # NORDESTE DO PARÁ
          #
          # MÁXIMO 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1


              if contador_nordeste >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          #
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # SE NÃO HOUVER 8 NOTÍCIAS
          #
          # NÃO vamos colocar notícias nacionais aleatórias.
          #
          # É melhor retornar menos notícias do Pará do que
          # preencher o JSON com notícias que não são regionais.
          # =====================================================


          # =====================================================
          # ORDENAR POR DATA
          #
          # Mantemos a prioridade definida acima, portanto
          # NÃO fazemos uma ordenação global aqui.
          # =====================================================


          # =====================================================
          # RESULTADO FINAL
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE_NOTICIAS]
          }


          # =====================================================
          # SALVAR JSON
          # =====================================================

          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2
              )


          # =====================================================
          # RELATÓRIO
          # =====================================================

          print("")

          print(
              "=============================="
          )

          print(
              "TOTAL FINAL:",
              len(
                  noticias[
                      :LIMITE_NOTICIAS
                  ]
              )
          )

          print(
              "=============================="
          )

          print("")

          for i, noticia in enumerate(

              noticias[
                  :LIMITE_NOTICIAS
              ],

              start=1

          ):

              print(
                  f"{i}. "
                  f"{noticia['titulo']}"
              )

          print("")

          PY


