name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup


          ARQUIVO = "noticias.json"

          LIMITE = 8


          # =========================================================
          # FONTES
          # =========================================================

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },

              {
                  "nome": "G1 - O Portal",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              }

          ]


          # =========================================================
          # SESSÃO HTTP
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36",

              "Accept":
              "text/html,application/xhtml+xml,"
              "application/xml;q=0.9,*/*;q=0.8"

          })


          # =========================================================
          # FUNÇÕES
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          def imagem_do_item(item):

              try:

                  if hasattr(
                      item,
                      "media_content"
                  ):

                      for media in item.media_content:

                          if media.get("url"):

                              return media["url"]

              except Exception:
                  pass


              try:

                  if hasattr(
                      item,
                      "media_thumbnail"
                  ):

                      for media in item.media_thumbnail:

                          if media.get("url"):

                              return media["url"]

              except Exception:
                  pass


              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  html = (
                      item.get("summary", "")
                      or item.get("description", "")
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find("img")

                  if img:

                      return (
                          img.get("src")
                          or img.get("data-src")
                          or ""
                      )

              except Exception:
                  pass


              return ""


          def data_item(item):

              try:

                  if item.get(
                      "published_parsed"
                  ):

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.published_parsed
                          ),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if item.get(
                      "updated_parsed"
                  ):

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.updated_parsed
                          ),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()


              palavras = [

                  "mixvale",
                  "mix vale"

              ]


              for palavra in palavras:

                  if palavra in texto:
                      return True


              return False


          # =========================================================
          # LER NOTÍCIAS EXISTENTES
          # =========================================================

          antigas = []


          if os.path.exists(ARQUIVO):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []


              except Exception as erro:

                  print(
                      "Aviso ao ler JSON:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          novas = []


          # =========================================================
          # RSS
          # =========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "===================================="
              )

              print(
                  "Consultando:",
                  fonte["nome"]
              )

              print(
                  "===================================="
              )


              try:

                  time.sleep(2)


                  resposta = sessao.get(
                      fonte["url"],
                      timeout=20
                  )


                  print(
                      "HTTP:",
                      resposta.status_code
                  )


                  if resposta.status_code == 429:

                      print(
                          "429 - Fonte bloqueou temporariamente."
                      )

                      return []


                  if resposta.status_code != 200:

                      print(
                          "Fonte indisponível."
                      )

                      return []


                  feed = feedparser.parse(
                      resposta.content
                  )


                  resultado = []


                  for item in feed.entries[:12]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = item.get(
                          "link",
                          ""
                      )


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      resultado.append({

                          "id": criar_id(
                              titulo,
                              link
                          ),

                          "titulo": titulo,

                          "descricao": descricao,

                          "link": link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem_do_item(
                                  item
                              ),

                          "data":
                              data_item(
                                  item
                              ),

                          "categoria":
                              "PARÁ"

                      })


                  print(
                      "Encontradas:",
                      len(resultado)
                  )


                  return resultado


              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )

                  return []


          # =========================================================
          # PÁGINA HTML
          # =========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "===================================="
              )

              print(
                  "Consultando:",
                  fonte["nome"]
              )

              print(
                  "===================================="
              )


              try:

                  time.sleep(3)


                  resposta = sessao.get(
                      fonte["url"],
                      timeout=25
                  )


                  print(
                      "HTTP:",
                      resposta.status_code
                  )


                  if resposta.status_code == 429:

                      print(
                          "429 - Fonte bloqueou temporariamente."
                      )

                      return []


                  if resposta.status_code != 200:

                      return []


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  resultado = []


                  # -------------------------------------------------
                  # Procurar links de notícias
                  # -------------------------------------------------

                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )


                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue


                      if len(titulo) < 25:
                          continue


                      if len(titulo) > 180:
                          continue


                      # Link absoluto
                      if href.startswith("/"):
                          link = (
                              fonte["url"].rstrip("/")
                              + href
                          )

                      elif href.startswith(
                          "http://"
                      ) or href.startswith(
                          "https://"
                      ):

                          link = href

                      else:

                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      # Só aceitar matérias
                      # das próprias fontes

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in link:
                              continue


                      if fonte["nome"] == "G1 - O Portal":

                          if "g1.globo.com" not in link:
                              continue


                      # Evitar páginas gerais

                      partes_bloqueadas = [

                          "/",
                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/webstories"

                      ]


                      if link.rstrip("/") in partes_bloqueadas:
                          continue


                      # ------------------------------------------------
                      # Procurar imagem próxima ao link
                      # ------------------------------------------------

                      imagem = ""


                      try:

                          pai = a.parent

                          if pai:

                              img = pai.find(
                                  "img"
                              )

                              if img:

                                  imagem = (
                                      img.get("src")
                                      or img.get(
                                          "data-src"
                                      )
                                      or ""
                                  )

                      except Exception:
                          pass


                      resultado.append({

                          "id": criar_id(
                              titulo,
                              link
                          ),

                          "titulo": titulo,

                          "descricao":
                              titulo,

                          "link": link,

                          "fonte":
                              fonte["nome"],

                          "imagem": imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      if len(resultado) >= 6:
                          break


                  print(
                      "Encontradas:",
                      len(resultado)
                  )


                  return resultado


              except Exception as erro:

                  print(
                      "Erro página:",
                      erro
                  )

                  return []


          # =========================================================
          # EXECUTAR FONTES
          # =========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_fonte = buscar_rss(
                      fonte
                  )

              else:

                  noticias_fonte = buscar_pagina(
                      fonte
                  )


              novas.extend(
                  noticias_fonte
              )


          print("")
          print(
              "===================================="
          )

          print(
              "TOTAL DE NOVAS NOTÍCIAS:",
              len(novas)
          )

          print(
              "===================================="
          )


          # =========================================================
          # COMBINAR
          # =========================================================

          todas = novas + antigas


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}


          for noticia in todas:

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )


              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
                  .lower()
              )


              chave = link or titulo


              if not chave:
                  continue


              if chave not in unicas:

                  unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # =========================================================
          # ORDENAR
          # =========================================================

          def ordenar(noticia):

              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=ordenar,
              reverse=True
          )


          # =========================================================
          # LIMITE
          # =========================================================

          resultado = todas[:LIMITE]


          # =========================================================
          # PROTEÇÃO
          # =========================================================

          if len(novas) == 0:

              print("")
              print(
                  "Nenhuma fonte entregou notícias novas."
              )

              print(
                  "O noticias.json atual será preservado."
              )

              raise SystemExit(0)


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "===================================="
          )

          print(
              "SUCESSO!"
          )

          print(
              "Notícias novas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print(
              "===================================="

          )

          PY


      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || git commit -m "Atualizar notícias"

          git push
