name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["NEWSDATA_API_KEY"]

          API_URL = "https://newsdata.io/api/1/latest"


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          BLOQUEADOS = [
              "mix vale",
              "mixvale",
              "mixvale.com.br"
          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [
              "tomé-açu",
              "tomé açu",
              "tome-açu",
              "tome acu",
              "tome-acu"
          ]


          # =====================================================
          # BELÉM / REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [
              "belém",
              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do pará",
              "santa izabel do para",
              "santa bárbara do pará",
              "santa barbara do para"
          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [
              "castanhal",
              "bragança",
              "braganca",
              "capanema",
              "salinópolis",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cametá",
              "cameta",
              "vigia",
              "capitão poço",
              "capitao poco",
              "igarapé-açu",
              "igarape-acu"
          ]


          # =====================================================
          # PARÁ
          # =====================================================

          PARA = [
              "pará",
              "paraense",
              "paraenses",
              "estado do pará",
              "estado do para",
              "governo do pará",
              "governo do para",
              "polícia do pará",
              "policia do para",
              "assembleia legislativa do pará",
              "tribunal de justiça do pará",
              "tjpa",
              "mppa",
              "ufpa",
              "ifpa",
              "susipe",
              "sefa pará",
              "sefa para",
              "detraf",
              "segup pará",
              "segup para"
          ]


          # =====================================================
          # OUTRAS REGIÕES
          # =====================================================

          OUTRAS_REGIOES = [
              "bahia",
              "salvador",
              "feira de santana",

              "são paulo",
              "sao paulo",
              "campinas",
              "guarulhos",

              "rio de janeiro",
              "niterói",
              "duque de caxias",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceará",
              "ceara",
              "fortaleza",

              "paraná",
              "parana",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasília",
              "brasilia",

              "goiás",
              "goias",
              "goiânia",
              "goiania",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondônia",
              "rondonia",
              "porto velho",

              "mato grosso",
              "cuiabá",
              "cuiaba",

              "mato grosso do sul",
              "campo grande",

              "espírito santo",
              "espirito santo",
              "vitória",
              "vitoria",

              "santa catarina",
              "florianópolis",
              "florianopolis"
          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = texto.lower()

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # BUSCA NA NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {
                  "apikey": API_KEY,
                  "country": "br",
                  "language": "pt",
                  "q": consulta
              }

              url = (
                  API_URL
                  + "?"
                  + urllib.parse.urlencode(parametros)
              )

              try:

                  requisicao = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadioJA-FM-News/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      requisicao,
                      timeout=30
                  ) as resposta:

                      dados = json.loads(
                          resposta.read().decode("utf-8")
                      )

                  return dados.get(
                      "results",
                      []
                  )

              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # TEXTO COMPLETO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              return normalizar(
                  " ".join([
                      item.get("title") or "",
                      item.get("description") or "",
                      item.get("source_name") or ""
                  ])
              )


          # =====================================================
          # NOTÍCIA BLOQUEADA
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = (
                  titulo
                  + " "
                  + descricao
                  + " "
                  + fonte
              )

              for termo in BLOQUEADOS:

                  if termo in texto:
                      return True

              for termo in BLOQUEADOS:

                  if termo in link:
                      return True

              return False


          # =====================================================
          # VERIFICAR SE POSSUI TERMO
          # =====================================================

          def pertence_ao_grupo(
              item,
              termos
          ):

              texto = texto_noticia(item)

              for termo in termos:

                  if termo in texto:
                      return True

              return False


          # =====================================================
          # VERIFICAR SE É OUTRA REGIÃO
          # =====================================================

          def eh_outra_regiao(item):

              texto = texto_noticia(item)

              for termo in OUTRAS_REGIOES:

                  if termo in texto:
                      return True

              return False


          # =====================================================
          # VALIDAÇÃO PRINCIPAL
          # =====================================================

          def valido(item):

              titulo = (
                  item.get("title") or ""
              ).strip()

              link = (
                  item.get("link") or ""
              ).strip()

              descricao = (
                  item.get("description") or ""
              ).strip()

              fonte = (
                  item.get("source_name") or ""
              ).strip()

              if not titulo:
                  return False

              if not link:
                  return False

              if bloqueada(item):
                  return False

              # -------------------------------------------------
              # Rejeita notícias claramente identificadas
              # como pertencentes a outros estados/regiões.
              # -------------------------------------------------

              texto = normalizar(
                  " ".join([
                      titulo,
                      descricao,
                      fonte
                  ])
              )

              # Se a notícia fala explicitamente de outra
              # região e não apresenta nenhuma referência
              # ao Pará, não entra.
              tem_para = pertence_ao_grupo(
                  item,
                  PARA
              )

              tem_belem = pertence_ao_grupo(
                  item,
                  BELEM_RMB
              )

              tem_nordeste = pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              )

              tem_tome = pertence_ao_grupo(
                  item,
                  TOME_ACU
              )

              eh_regional = (
                  tem_para
                  or tem_belem
                  or tem_nordeste
                  or tem_tome
              )

              outra_regiao = eh_outra_regiao(
                  item
              )

              if outra_regiao and not eh_regional:

                  return False

              return True


          # =====================================================
          # CONVERTER
          # =====================================================

          def converter(item):

              return {
                  "id": item.get("article_id"),
                  "titulo": item.get("title"),
                  "descricao": item.get("description"),
                  "link": item.get("link"),
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate")
              }


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -------------------------------------------------
              # TOMÉ-AÇU
              # -------------------------------------------------

              '"Tomé-Açu"',


              # -------------------------------------------------
              # BELÉM / RMB
              # -------------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',


              # -------------------------------------------------
              # NORDESTE DO PARÁ
              # -------------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',


              # -------------------------------------------------
              # PARÁ
              # -------------------------------------------------

              '"Pará"',
              '"governo do Pará"',
              '"polícia do Pará"',


              # -------------------------------------------------
              # BRASIL
              # -------------------------------------------------

              '"Brasil"'
          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print(
                  "BUSCANDO:",
                  consulta
              )

              resultados = buscar(
                  consulta
              )

              print(
                  "RESULTADOS:",
                  len(resultados)
              )

              for item in resultados:

                  if not valido(item):
                      continue

                  link = (
                      item.get("link") or ""
                  ).strip()

                  if not link:
                      continue

                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []
          belem = []
          nordeste = []
          para = []
          brasil = []


          for item in candidatos.values():

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

              elif pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

              elif pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

              elif pertence_ao_grupo(
                  item,
                  PARA
              ):

                  para.append(item)

              else:

                  # Só permite entrar como Brasil
                  # se não for claramente de outra região.

                  if not eh_outra_regiao(item):

                      brasil.append(item)


          print("")
          print(
              "=============================="
          )
          print(
              "CLASSIFICAÇÃO"
          )
          print(
              "Tomé-Açu:",
              len(tome_acu)
          )
          print(
              "Belém/RMB:",
              len(belem)
          )
          print(
              "Nordeste do Pará:",
              len(nordeste)
          )
          print(
              "Pará:",
              len(para)
          )
          print(
              "Brasil:",
              len(brasil)
          )
          print(
              "=============================="
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )

              titulo = re.sub(
                  r"[^a-z0-9áéíóúãõâêôç ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= 8:

                  return False

              link = (
                  item.get("link") or ""
              ).strip()

              titulo = titulo_normalizado(
                  item.get("title") or ""
              )

              if not link:
                  return False

              if not titulo:
                  return False

              if link in links_usados:

                  return False

              if titulo in titulos_usados:

                  return False

              links_usados.add(
                  link
              )

              titulos_usados.add(
                  titulo
              )

              noticia = converter(
                  item
              )

              noticias.append(
                  noticia
              )

              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"
              )

              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM / RMB
          # MÁXIMO 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= 8:
                  break

              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1

              if contador_belem >= 2:
                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE DO PARÁ
          # MÁXIMO 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= 8:
                  break

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1

              if contador_nordeste >= 2:
                  break


          # =====================================================
          # PRIORIDADE 4
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          # =====================================================

          for item in brasil:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:8]
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESUMO FINAL
          # =====================================================

          print("")
          print(
              "=============================="
          )

          print(
              "TOTAL FINAL:",
              len(noticias[:8])
          )

          print(
              "=============================="
          )

          print("")
          print(
              "ARQUIVO noticias.json ATUALIZADO!"
          )

          PY


      # =======================================================
      # SALVAR NO GITHUB
      # =======================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio J.A FM"

          git config user.email \
            "actions@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit \
            -m "Atualizar notícias"

          git push
