name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos
        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request
          import urllib.error

          from datetime import datetime, timezone, timedelta


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"

          ARQUIVO_JSON = "noticias.json"

          LIMITE_FINAL = 8

          # Notícias das últimas 48 horas.
          # 48h é o máximo aceito pelo endpoint latest.
          TIMEFRAME = "48"


          if not API_KEY:

              print("ERRO: NEWSDATA_API_KEY não encontrada.")

              raise SystemExit(1)


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu"

          ]


          # =====================================================
          # BELÉM / REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "braganca do para",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua"

          ]


          # =====================================================
          # TERMOS FORTES DO PARÁ
          # =====================================================

          PARA_FORTE = [

              "estado do para",
              "governo do para",
              "policia do para",
              "policia civil do para",
              "policia militar do para",
              "ministerio publico do para",
              "tribunal de justica do para",
              "assembleia legislativa do para",
              "governador do para",
              "governadora do para",
              "paraense",
              "paraenses"

          ]


          # =====================================================
          # CIDADES DO PARÁ
          # =====================================================

          CIDADES_PARA = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para",

              "tome acu",
              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua",

              "santarem",
              "maraba",
              "altamira",
              "parauapebas",
              "redençao",
              "redencao",
              "tucurui",
              "tailandia",
              "moju",
              "breves",
              "itaituba",
              "obidos",
              "oriximina",
              "juruti",
              "soure",
              "salvaterra",
              "mosqueiro"

          ]


          # =====================================================
          # OUTROS ESTADOS
          # =====================================================

          OUTROS_ESTADOS = [

              "acre",
              "alagoas",
              "amapa",
              "amazonas",
              "bahia",
              "ceara",
              "distrito federal",
              "espirito santo",
              "goias",
              "maranhao",
              "mato grosso",
              "mato grosso do sul",
              "minas gerais",
              "paraiba",
              "parana",
              "pernambuco",
              "piaui",
              "rio de janeiro",
              "rio grande do norte",
              "rio grande do sul",
              "rondonia",
              "roraima",
              "santa catarina",
              "sao paulo",
              "sergipe",
              "tocantins",

              "salvador",
              "fortaleza",
              "recife",
              "curitiba",
              "manaus",
              "goiania",
              "sao luis",
              "teresina",
              "joao pessoa",
              "natal",
              "maceio",
              "aracaju",
              "palmas",
              "macapa",
              "porto velho",
              "rio branco",
              "porto alegre",
              "belo horizonte",
              "brasilia",
              "vitoria",
              "florianopolis"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:

                  return ""

              texto = str(texto)

              texto = texto.lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(

                  c

                  for c in texto

                  if unicodedata.category(c) != "Mn"

              )

              texto = texto.replace("-", " ")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # TESTAR TERMO
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:

                  return False

              padrao = (

                  r"(?<![a-z0-9])"

                  + re.escape(termo)

                  + r"(?![a-z0-9])"

              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO COMPLETO
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or "",

                  item.get("link") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # NOTÍCIA BLOQUEADA
          # =====================================================

          def bloqueada(item):

              texto = texto_noticia(item)

              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True

              return False


          # =====================================================
          # NOTÍCIA BÁSICA VÁLIDA
          # =====================================================

          def valida_basica(item):

              if not item:

                  return False

              titulo = (
                  item.get("title") or ""
              ).strip()

              link = (
                  item.get("link") or ""
              ).strip()

              if not titulo:

                  return False

              if not link:

                  return False

              if bloqueada(item):

                  return False

              return True


          # =====================================================
          # VERIFICAR TERMO EM LISTA
          # =====================================================

          def pertence(item, lista):

              texto = texto_noticia(item)

              for termo in lista:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True

              return False


          # =====================================================
          # VERIFICAR SE É DO PARÁ
          # =====================================================

          def eh_para(item):

              texto = texto_noticia(item)


              # ---------------------------------------------
              # 1. CIDADE DO PARÁ
              # ---------------------------------------------

              for cidade in CIDADES_PARA:

                  if contem_termo(
                      texto,
                      cidade
                  ):

                      return True


              # ---------------------------------------------
              # 2. TERMOS FORTES
              # ---------------------------------------------

              for termo in PARA_FORTE:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              # ---------------------------------------------
              # 3. "PARÁ" ISOLADO
              #
              # O normalizador transforma:
              #
              # Pará -> para
              # Paraná -> parana
              #
              # Como usamos palavra inteira,
              # "para" NÃO casa com "parana".
              # ---------------------------------------------

              if contem_termo(
                  texto,
                  "para"
              ):

                  # Se houver outro estado claramente
                  # predominante, rejeitamos.
                  outros = 0

                  for estado in OUTROS_ESTADOS:

                      if contem_termo(
                          texto,
                          estado
                      ):

                          outros += 1


                  # Se existir referência explícita
                  # ao Pará junto com outro estado,
                  # ainda aceitamos.
                  if contem_termo(
                      texto,
                      "para"
                  ):

                      return True


              return False


          # =====================================================
          # DATA DA NOTÍCIA
          # =====================================================

          def data_noticia(item):

              valor = (
                  item.get("pubDate") or ""
              ).strip()

              if not valor:

                  return datetime(
                      1970,
                      1,
                      1,
                      tzinfo=timezone.utc
                  )

              formatos = [

                  "%Y-%m-%d %H:%M:%S",

                  "%Y-%m-%dT%H:%M:%S",

                  "%Y-%m-%dT%H:%M:%S%z"

              ]

              for formato in formatos:

                  try:

                      data = datetime.strptime(
                          valor,
                          formato
                      )

                      if data.tzinfo is None:

                          data = data.replace(
                              tzinfo=timezone.utc
                          )

                      return data

                  except:

                      pass


              return datetime(
                  1970,
                  1,
                  1,
                  tzinfo=timezone.utc
              )


          # =====================================================
          # BUSCAR API
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta,

                  "timeframe": TIMEFRAME,

                  "removeduplicate": "1"

              }


              url = (

                  API_URL

                  + "?"

                  + urllib.parse.urlencode(
                      parametros
                  )

              )


              print("")
              print("BUSCA:", consulta)


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/2.0",

                          "Accept":
                          "application/json"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=40

                  ) as resposta:

                      conteudo = (
                          resposta
                          .read()
                          .decode("utf-8")
                      )


                  dados = json.loads(
                      conteudo
                  )


                  status = dados.get(
                      "status"
                  )


                  if status != "success":

                      print(
                          "API retornou:",
                          dados
                      )

                      return []


                  resultados = dados.get(
                      "results",
                      []
                  )


                  print(
                      "RESULTADOS:",
                      len(resultados)
                  )


                  return resultados


              except urllib.error.HTTPError as erro:

                  print(
                      "ERRO HTTP:",
                      erro.code
                  )

                  try:

                      corpo = (
                          erro.read()
                          .decode("utf-8")
                      )

                      print(
                          corpo
                      )

                  except:

                      pass

                  return []


              except Exception as erro:

                  print(
                      "ERRO:",
                      erro
                  )

                  return []


          # =====================================================
          # CONSULTAS
          #
          # IMPORTANTE:
          # Consultas específicas primeiro.
          # Brasil por último.
          # =====================================================

          consultas = [

              # Tomé-Açu
              '"Tomé-Açu"',

              # Belém / RMB
              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',

              # Nordeste
              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',

              # Pará
              '"governo do Pará"',
              '"polícia do Pará"',
              '"Estado do Pará"',
              '"Pará"',

              # Brasil
              '"Brasil"'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              resultados = buscar(
                  consulta
              )


              for item in resultados:

                  if not valida_basica(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if link:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          for item in candidatos.values():

              # Tomé-Açu
              if pertence(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

                  continue


              # Belém/RMB
              if pertence(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

                  continue


              # Nordeste
              if pertence(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

                  continue


              # Pará
              if eh_para(item):

                  para.append(item)

                  continue


              # Brasil
              brasil.append(item)


          # =====================================================
          # ORDENAR POR DATA
          # MAIS NOVAS PRIMEIRO
          # =====================================================

          tome_acu.sort(
              key=data_noticia,
              reverse=True
          )

          belem.sort(
              key=data_noticia,
              reverse=True
          )

          nordeste.sort(
              key=data_noticia,
              reverse=True
          )

          para.sort(
              key=data_noticia,
              reverse=True
          )

          brasil.sort(
              key=data_noticia,
              reverse=True
          )


          # =====================================================
          # MOSTRAR CLASSIFICAÇÃO
          # =====================================================

          print("")
          print(
              "===================================="
          )

          print(
              "CLASSIFICAÇÃO"
          )

          print(
              "===================================="
          )

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )

              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          # =====================================================
          # CONVERTER
          # =====================================================

          def converter(
              item,
              categoria
          ):

              return {

                  "id":
                      item.get("article_id"),

                  "titulo":
                      item.get("title"),

                  "descricao":
                      item.get("description"),

                  "link":
                      item.get("link"),

                  "fonte":
                      item.get("source_name"),

                  "imagem":
                      item.get("image_url"),

                  "data":
                      item.get("pubDate"),

                  "categoria":
                      categoria

              }


          # =====================================================
          # ADICIONAR
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE_FINAL:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link or not titulo:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              links_usados.add(
                  link
              )

              titulos_usados.add(
                  titulo
              )


              noticia = converter(
                  item,
                  categoria
              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "

                  f"{categoria} | "

                  f"{noticia['fonte']} | "

                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM/RMB
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in belem:

              if len(noticias) >= LIMITE_FINAL:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador += 1


              if contador >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in nordeste:

              if len(noticias) >= LIMITE_FINAL:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador += 1


              if contador >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          # PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE_FINAL:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          # =====================================================

          for item in brasil:

              if len(noticias) >= LIMITE_FINAL:

                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # PROTEÇÃO CONTRA JSON VAZIO
          #
          # Se a API não retornar nada, NÃO apaga
          # o arquivo que já estava funcionando.
          # =====================================================

          if len(noticias) == 0:

              print("")
              print(
                  "===================================="
              )

              print(
                  "NENHUMA NOTÍCIA NOVA ENCONTRADA"
              )

              print(
                  "O JSON EXISTENTE SERÁ PRESERVADO."
              )

              print(
                  "===================================="
              )

              raise SystemExit(0)


          # =====================================================
          # SALVAR
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE_FINAL]

          }


          with open(

              ARQUIVO_JSON,

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO
          # =====================================================

          print("")
          print(
              "===================================="
          )

          print(
              "ATUALIZAÇÃO CONCLUÍDA"
          )

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "===================================="
          )


          for i, noticia in enumerate(

              noticias,

              start=1

          ):

              print(

                  f"{i}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"

              )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"

          git push
