name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          if not API_KEY:
              raise SystemExit("ERRO: NEWSDATA_API_KEY não configurada.")

          API_URL = "https://newsdata.io/api/1/latest"

          LIMITE = 8

          consultas = [
              "Pará",
              "Belém",
              "Ananindeua",
              "Tomé-Açu",
              "Bragança",
              "Capanema",
              "Castanhal",
              "Marituba",
              "Paragominas",
              "Abaetetuba",
              "Brasil"
          ]

          bloqueados = [
              "mix vale",
              "mixvale",
              "mixvale.com.br"
          ]

          def normalizar(texto):
              if not texto:
                  return ""

              return str(texto).lower().strip()

          def bloqueada(item):

              texto = " ".join([
                  item.get("title") or "",
                  item.get("description") or "",
                  item.get("source_name") or "",
                  item.get("link") or ""
              ])

              texto = normalizar(texto)

              for termo in bloqueados:
                  if termo in texto:
                      return True

              return False

          def buscar(consulta):

              parametros = {
                  "apikey": API_KEY,
                  "country": "br",
                  "language": "pt",
                  "q": consulta,
                  "size": "10"
              }

              url = (
                  API_URL
                  + "?"
                  + urllib.parse.urlencode(parametros)
              )

              try:

                  requisicao = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadioJA-FM-NewsBot/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      requisicao,
                      timeout=30
                  ) as resposta:

                      dados = json.loads(
                          resposta.read().decode("utf-8")
                      )

                  if dados.get("status") != "success":

                      print(
                          "Erro na consulta:",
                          consulta
                      )

                      return []

                  return dados.get("results", [])

              except Exception as erro:

                  print(
                      "Erro ao buscar",
                      consulta,
                      ":",
                      erro
                  )

                  return []

          noticias = []

          links_usados = set()

          titulos_usados = set()

          for consulta in consultas:

              if len(noticias) >= LIMITE:
                  break

              print("")
              print("Consultando:", consulta)

              resultados = buscar(consulta)

              for item in resultados:

                  if len(noticias) >= LIMITE:
                      break

                  if not item.get("title"):
                      continue

                  if not item.get("link"):
                      continue

                  if bloqueada(item):
                      continue

                  link = item.get("link").strip()

                  titulo = (
                      item.get("title")
                      .strip()
                      .lower()
                  )

                  if link in links_usados:
                      continue

                  if titulo in titulos_usados:
                      continue

                  links_usados.add(link)

                  titulos_usados.add(titulo)

                  noticia = {
                      "id": item.get("article_id"),
                      "titulo": item.get("title"),
                      "descricao": item.get("description"),
                      "link": item.get("link"),
                      "fonte": item.get("source_name"),
                      "imagem": item.get("image_url"),
                      "data": item.get("pubDate"),
                      "categoria": "PARÁ"
                  }

                  noticias.append(noticia)

                  print(
                      f"{len(noticias)} - "
                      f"{noticia['fonte']} - "
                      f"{noticia['titulo']}"
                  )

          # -------------------------------------------------
          # IMPORTANTE:
          # SE A API NÃO TROUXER NOTÍCIAS,
          # NÃO APAGA O JSON EXISTENTE.
          # -------------------------------------------------

          arquivo_json = "noticias.json"

          noticias_antigas = []

          if os.path.exists(arquivo_json):

              try:

                  with open(
                      arquivo_json,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      antigo = json.load(arquivo)

                  noticias_antigas = antigo.get(
                      "noticias",
                      []
                  )

              except Exception:

                  noticias_antigas = []

          # -------------------------------------------------
          # COMPLETAR COM NOTÍCIAS ANTIGAS SE NECESSÁRIO
          # -------------------------------------------------

          if len(noticias) < LIMITE:

              for antiga in noticias_antigas:

                  if len(noticias) >= LIMITE:
                      break

                  link = (
                      antiga.get("link") or ""
                  ).strip()

                  titulo = (
                      antiga.get("titulo") or ""
                  ).strip().lower()

                  if not link or not titulo:
                      continue

                  if link in links_usados:
                      continue

                  if titulo in titulos_usados:
                      continue

                  links_usados.add(link)

                  titulos_usados.add(titulo)

                  noticias.append(antiga)

          # -------------------------------------------------
          # RESULTADO FINAL
          # -------------------------------------------------

          if not noticias:

              raise SystemExit(
                  "ERRO: nenhuma notícia encontrada. "
                  "O noticias.json existente foi preservado."
              )

          resultado = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias": noticias[:LIMITE]
          }

          with open(
              arquivo_json,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==============================")
          print(
              "TOTAL DE NOTÍCIAS:",
              len(noticias[:LIMITE])
          )
          print("==============================")

          PY

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
