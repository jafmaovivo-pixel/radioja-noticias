```yaml
name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse


          # ==========================================================
          # CONFIGURAÇÃO
          # ==========================================================

          ARQUIVO = "noticias.json"
          LIMITE_FINAL = 8

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "G1",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              }

          ]


          # ==========================================================
          # SESSÃO HTTP
          # ==========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
                  "no-cache",

              "Pragma":
                  "no-cache"

          })


          # ==========================================================
          # TEXTO
          # ==========================================================

          def limpar(texto):

              if not texto:
                  return ""

              try:
                  soup = BeautifulSoup(
                      str(texto),
                      "html.parser"
                  )

                  texto = soup.get_text(
                      " ",
                      strip=True
                  )

              except Exception:
                  texto = str(texto)

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ==========================================================
          # ID
          # ==========================================================

          def criar_id(titulo, link):

              base = (
                  str(titulo).strip()
                  + "|"
                  + str(link).strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # BLOQUEIOS
          # ==========================================================

          def bloqueada(titulo, link):

              texto = (
                  str(titulo)
                  + " "
                  + str(link)
              ).lower()

              palavras = [
                  "mixvale",
                  "mix vale"
              ]

              return any(
                  palavra in texto
                  for palavra in palavras
              )


          # ==========================================================
          # NORMALIZAR URL
          # ==========================================================

          def normalizar_url(url, base=""):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              url = url.replace(
                  "\\/",
                  "/"
              )

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("/"):
                  return urljoin(
                      base,
                      url
                  )

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              if base:
                  return urljoin(
                      base,
                      url
                  )

              return url


          # ==========================================================
          # GOOGLE NEWS
          #
          # O RSS do Google News pode entregar:
          #
          # news.google.com/rss/articles/...
          #
          # Nesse caso precisamos abrir o link e descobrir a matéria
          # original antes de procurar a imagem.
          # ==========================================================

          def resolver_link_google(link):

              if not link:
                  return ""

              if "news.google.com" not in link:
                  return link

              print(
                  "Link Google News detectado:"
              )

              print(
                  link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=20,
                      allow_redirects=True
                  )

                  print(
                      "Google News HTTP:",
                      resposta.status_code
                  )

                  print(
                      "URL final:",
                      resposta.url
                  )

                  final = resposta.url

                  if final and "news.google.com" not in final:

                      return final


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # --------------------------------------------------
                  # CANONICAL
                  # --------------------------------------------------

                  canonical = soup.find(
                      "link",
                      rel="canonical"
                  )

                  if canonical:

                      href = canonical.get(
                          "href",
                          ""
                      )

                      href = normalizar_url(
                          href,
                          resposta.url
                      )

                      if (
                          href
                          and "news.google.com" not in href
                      ):

                          return href


                  # --------------------------------------------------
                  # OG URL
                  # --------------------------------------------------

                  meta = soup.find(
                      "meta",
                      attrs={
                          "property": "og:url"
                      }
                  )

                  if meta:

                      href = meta.get(
                          "content",
                          ""
                      )

                      href = normalizar_url(
                          href,
                          resposta.url
                      )

                      if (
                          href
                          and "news.google.com" not in href
                      ):

                          return href


                  # --------------------------------------------------
                  # LINKS DA PÁGINA
                  # --------------------------------------------------

                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      href = normalizar_url(
                          a.get("href"),
                          resposta.url
                      )

                      if not href:
                          continue

                      dominio = urlparse(
                          href
                      ).netloc.lower()

                      if dominio in [
                          "g1.globo.com",
                          "www.g1.globo.com",
                          "diariodopara.com.br",
                          "www.diariodopara.com.br",
                          "oliberal.com",
                          "www.oliberal.com"
                      ]:

                          return href


              except Exception as erro:

                  print(
                      "Erro ao resolver Google News:",
                      erro
                  )


              # Se não conseguiu resolver,
              # mantém o link original.

              return link


          # ==========================================================
          # JSON-LD
          # ==========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          texto = script.get_text()

                      if not texto:
                          continue

                      dados = json.loads(
                          texto
                      )

                      objetos = []

                      if isinstance(
                          dados,
                          list
                      ):

                          objetos.extend(
                              dados
                          )

                      elif isinstance(
                          dados,
                          dict
                      ):

                          objetos.append(
                              dados
                          )

                          graph = dados.get(
                              "@graph"
                          )

                          if isinstance(
                              graph,
                              list
                          ):

                              objetos.extend(
                                  graph
                              )


                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagem = obj.get(
                              "image"
                          )

                          # STRING

                          if isinstance(
                              imagem,
                              str
                          ):

                              url = normalizar_url(
                                  imagem,
                                  pagina
                              )

                              if url:
                                  return url


                          # DICT

                          if isinstance(
                              imagem,
                              dict
                          ):

                              url = (
                                  imagem.get(
                                      "url"
                                  )
                                  or imagem.get(
                                      "contentUrl"
                                  )
                                  or imagem.get(
                                      "@id"
                                  )
                                  or ""
                              )

                              url = normalizar_url(
                                  url,
                                  pagina
                              )

                              if url:
                                  return url


                          # LIST

                          if isinstance(
                              imagem,
                              list
                          ):

                              for item in imagem:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      url = normalizar_url(
                                          item,
                                          pagina
                                      )

                                      if url:
                                          return url

                                  if isinstance(
                                      item,
                                      dict
                                  ):

                                      url = (
                                          item.get(
                                              "url"
                                          )
                                          or item.get(
                                              "contentUrl"
                                          )
                                          or ""
                                      )

                                      url = normalizar_url(
                                          url,
                                          pagina
                                      )

                                      if url:
                                          return url


                  except Exception:

                      continue


              return ""


          # ==========================================================
          # EXTRAIR IMAGEM DA MATÉRIA
          # ==========================================================

          def extrair_imagem_pagina(link):

              if not link:
                  return ""

              print(
                  "Buscando imagem da matéria:"
              )

              print(
                  link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "HTTP matéria:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  pagina_final = (
                      resposta.url
                      or link
                  )

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # --------------------------------------------------
                  # 1. OG IMAGE
                  # --------------------------------------------------

                  og_tags = [

                      (
                          "property",
                          "og:image"
                      ),

                      (
                          "property",
                          "og:image:url"
                      ),

                      (
                          "name",
                          "twitter:image"
                      ),

                      (
                          "name",
                          "twitter:image:src"
                      )

                  ]


                  for atributo, valor in og_tags:

                      meta = soup.find(
                          "meta",
                          attrs={
                              atributo:
                                  valor
                          }
                      )

                      if meta:

                          url = meta.get(
                              "content",
                              ""
                          )

                          url = normalizar_url(
                              url,
                              pagina_final
                          )

                          if url:

                              print(
                                  "Imagem OG/Twitter:"
                              )

                              print(
                                  url
                              )

                              return url


                  # --------------------------------------------------
                  # 2. JSON-LD
                  # --------------------------------------------------

                  url = imagem_jsonld(
                      soup,
                      pagina_final
                  )

                  if url:

                      print(
                          "Imagem JSON-LD:"
                      )

                      print(
                          url
                      )

                      return url


                  # --------------------------------------------------
                  # 3. META ITEMPROP
                  # --------------------------------------------------

                  for meta in soup.find_all(
                      "meta"
                  ):

                      itemprop = (
                          meta.get(
                              "itemprop",
                              ""
                          )
                          .lower()
                      )

                      if itemprop in [
                          "image",
                          "thumbnailurl"
                      ]:

                          url = meta.get(
                              "content",
                              ""
                          )

                          url = normalizar_url(
                              url,
                              pagina_final
                          )

                          if url:
                              return url


                  # --------------------------------------------------
                  # 4. IMAGEM DENTRO DO ARTICLE
                  # --------------------------------------------------

                  article = (
                      soup.find(
                          "article"
                      )
                      or soup.find(
                          "main"
                      )
                  )

                  if article:

                      imagens = article.find_all(
                          "img"
                      )

                      for img in imagens:

                          candidatos = [

                              img.get("src"),

                              img.get(
                                  "data-src"
                              ),

                              img.get(
                                  "data-original"
                              ),

                              img.get(
                                  "data-lazy-src"
                              ),

                              img.get(
                                  "data-lazy"
                              ),

                              img.get(
                                  "data-original-src"
                              )

                          ]

                          for candidato in candidatos:

                              url = normalizar_url(
                                  candidato,
                                  pagina_final
                              )

                              if not url:
                                  continue

                              if (
                                  "logo" in url.lower()
                                  or
                                  "icon" in url.lower()
                                  or
                                  "avatar" in url.lower()
                              ):
                                  continue

                              print(
                                  "Imagem do article:"
                              )

                              print(
                                  url
                              )

                              return url


                  # --------------------------------------------------
                  # 5. QUALQUER IMG RELEVANTE
                  # --------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      candidatos = [

                          img.get("src"),

                          img.get(
                              "data-src"
                          ),

                          img.get(
                              "data-original"
                          ),

                          img.get(
                              "data-lazy-src"
                          ),

                          img.get(
                              "data-lazy"
                          )

                      ]

                      for candidato in candidatos:

                          url = normalizar_url(
                              candidato,
                              pagina_final
                          )

                          if not url:
                              continue

                          url_lower = url.lower()

                          ignorar = [

                              "logo",
                              "icon",
                              "avatar",
                              "favicon",
                              "sprite",
                              "pixel",
                              "tracking"
                          ]

                          if any(
                              palavra in url_lower
                              for palavra in ignorar
                          ):
                              continue

                          print(
                              "Imagem HTML:"
                          )

                          print(
                              url
                          )

                          return url


              except Exception as erro:

                  print(
                      "Erro ao extrair imagem:"
                  )

                  print(
                      erro
                  )


              return ""


          # ==========================================================
          # IMAGEM DO ITEM RSS
          # ==========================================================

          def imagem_do_item(item):

              try:

                  for campo in [
                      "media_content",
                      "media_thumbnail"
                  ]:

                      dados = item.get(
                          campo,
                          []
                      )

                      if isinstance(
                          dados,
                          list
                      ):

                          for media in dados:

                              if not isinstance(
                                  media,
                                  dict
                              ):
                                  continue

                              url = (
                                  media.get(
                                      "url"
                                  )
                                  or media.get(
                                      "href"
                                  )
                                  or ""
                              )

                              if url:
                                  return url


              except Exception:
                  pass


              try:

                  enclosures = item.get(
                      "enclosures",
                      []
                  )

                  for enclosure in enclosures:

                      url = (
                          enclosure.get(
                              "href"
                          )
                          or enclosure.get(
                              "url"
                          )
                          or ""
                      )

                      if url:
                          return url


              except Exception:
                  pass


              try:

                  html = (
                      item.get(
                          "summary",
                          ""
                      )
                      or
                      item.get(
                          "description",
                          ""
                      )
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find(
                      "img"
                  )

                  if img:

                      return (
                          img.get("src")
                          or img.get(
                              "data-src"
                          )
                          or ""
                      )


              except Exception:
                  pass


              return ""


          # ==========================================================
          # LER JSON EXISTENTE
          # ==========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []


              except Exception as erro:

                  print(
                      "Erro ao ler JSON:"
                  )

                  print(
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # ==========================================================
          # MAPA DE DADOS ANTIGOS
          # ==========================================================

          dados_antigos = {}

          for noticia in antigas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()

              if not link:
                  continue

              dados_antigos[
                  link
              ] = noticia


          # ==========================================================
          # LISTA NOVA
          # ==========================================================

          novas = []


          # ==========================================================
          # BUSCAR RSS
          # ==========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "========================================"
              )

              print(
                  "RSS:",
                  fonte["nome"]
              )

              print(
                  "========================================"
              )

              resultado = []

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return resultado

                  feed = feedparser.parse(
                      resposta.content
                  )


                  for item in feed.entries[:15]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = (
                          item.get(
                              "link",
                              ""
                          )
                          or ""
                      ).strip()


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      # ------------------------------------------------
                      # RESOLVER GOOGLE NEWS
                      # ------------------------------------------------

                      link_original = (
                          resolver_link_google(
                              link
                          )
                      )


                      # ------------------------------------------------
                      # IMAGEM RSS
                      # ------------------------------------------------

                      imagem = imagem_do_item(
                          item
                      )


                      imagem = normalizar_url(
                          imagem,
                          link_original
                      )


                      # ------------------------------------------------
                      # IMAGEM ANTIGA
                      # ------------------------------------------------

                      antiga = (
                          dados_antigos.get(
                              link
                          )
                          or
                          dados_antigos.get(
                              link_original
                          )
                      )


                      if (
                          not imagem
                          and antiga
                      ):

                          imagem = (
                              antiga.get(
                                  "imagem",
                                  ""
                              )
                              or ""
                          )


                      # ------------------------------------------------
                      # SE NÃO TEM IMAGEM,
                      # BUSCAR NA MATÉRIA ORIGINAL
                      # ------------------------------------------------

                      if (
                          not imagem
                          and link_original
                      ):

                          imagem = (
                              extrair_imagem_pagina(
                                  link_original
                              )
                          )


                      # ------------------------------------------------
                      # DATA
                      # ------------------------------------------------

                      data = ""

                      try:

                          if item.get(
                              "published_parsed"
                          ):

                              data = datetime.fromtimestamp(
                                  time.mktime(
                                      item.published_parsed
                                  ),
                                  timezone.utc
                              ).isoformat()

                      except Exception:
                          pass


                      if not data:

                          data = datetime.now(
                              timezone.utc
                          ).isoformat()


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link_original
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              limpar(
                                  item.get(
                                      "summary",
                                      item.get(
                                          "description",
                                          ""
                                      )
                                  )
                              ),

                          "link":
                              link_original,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              data,

                          "categoria":
                              "PARÁ"

                      })


                      if len(resultado) >= 6:
                          break


              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )


              print(
                  "Encontradas:",
                  len(resultado)
              )

              return resultado


          # ==========================================================
          # BUSCAR PÁGINA
          # ==========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "========================================"
              )

              print(
                  "PÁGINA:",
                  fonte["nome"]
              )

              print(
                  "========================================"
              )

              resultado = []

              links_vistos = set()


              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return resultado


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = (
                          a.get(
                              "href",
                              ""
                          )
                          or ""
                      )


                      if not titulo:
                          continue


                      if len(titulo) < 25:
                          continue


                      if len(titulo) > 200:
                          continue


                      link = normalizar_url(
                          href,
                          fonte["url"]
                      )


                      if not link:
                          continue


                      if link in links_vistos:
                          continue


                      links_vistos.add(
                          link
                      )


                      caminho = link.lower()


                      # ------------------------------------------------
                      # DOMÍNIO
                      # ------------------------------------------------

                      if fonte["nome"] == "G1":

                          if "g1.globo.com" not in caminho:
                              continue

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in caminho:
                              continue


                      # ------------------------------------------------
                      # BLOQUEIOS
                      # ------------------------------------------------

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      bloqueios = [

                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo",
                          "/colunas/",
                          "/coluna/"

                      ]


                      if any(
                          trecho in caminho
                          for trecho in bloqueios
                      ):

                          continue


                      # ------------------------------------------------
                      # SOMENTE MATÉRIAS
                      # ------------------------------------------------

                      if fonte["nome"] == "G1":

                          if "/noticia/" not in caminho:
                              continue


                      if fonte["nome"] == "O Liberal":

                          secoes = [

                              "/policia/",
                              "/para/",
                              "/belem/",
                              "/amazonia/",
                              "/politica/",
                              "/economia/",
                              "/esportes/",
                              "/entretenimento/",
                              "/mundo/",
                              "/brasil/",
                              "/tecnologia/",
                              "/cultura/",
                              "/saude/",
                              "/concursos/"

                          ]


                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):

                              continue


                      # ------------------------------------------------
                      # IMAGEM EXISTENTE
                      # ------------------------------------------------

                      imagem = ""


                      antiga = (
                          dados_antigos.get(
                              link
                          )
                      )


                      if antiga:

                          imagem = (
                              antiga.get(
                                  "imagem",
                                  ""
                              )
                              or ""
                          )


                      # ------------------------------------------------
                      # BUSCAR IMAGEM
                      # ------------------------------------------------

                      if not imagem:

                          imagem = (
                              extrair_imagem_pagina(
                                  link
                              )
                          )


                      # ------------------------------------------------
                      # ADICIONAR
                      # ------------------------------------------------

                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print("")
                      print(
                          "NOTÍCIA:"
                      )

                      print(
                          titulo
                      )

                      print(
                          "LINK:"
                      )

                      print(
                          link
                      )

                      print(
                          "IMAGEM:"
                      )

                      print(
                          imagem
                      )


                      if len(resultado) >= 6:
                          break


              except Exception as erro:

                  print(
                      "Erro página:"
                  )

                  print(
                      erro
                  )


              print(
                  "Encontradas:",
                  len(resultado)
              )

              return resultado


          # ==========================================================
          # EXECUTAR FONTES
          # ==========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  resultado_fonte = (
                      buscar_rss(
                          fonte
                      )
                  )

              else:

                  resultado_fonte = (
                      buscar_pagina(
                          fonte
                      )
                  )


              novas.extend(
                  resultado_fonte
              )


          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL:",
              len(novas)
          )

          print(
              "========================================"
          )


          # ==========================================================
          # SE NENHUMA NOTÍCIA FOI ENCONTRADA
          # ==========================================================

          if not novas:

              print(
                  "Nenhuma notícia encontrada."
              )

              print(
                  "JSON existente será preservado."
              )

              raise SystemExit(0)


          # ==========================================================
          # COMBINAR NOVAS + ANTIGAS
          # ==========================================================

          todas = (
              novas
              + antigas
          )


          # ==========================================================
          # DUPLICADAS
          # ==========================================================

          unicas = {}


          for noticia in todas:

              titulo = limpar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()


              if not titulo and not link:
                  continue


              chave = (
                  link.lower()
                  if link
                  else titulo.lower()
              )


              if chave not in unicas:

                  unicas[
                      chave
                  ] = noticia

              else:

                  atual = unicas[
                      chave
                  ]

                  imagem_atual = (
                      atual.get(
                          "imagem",
                          ""
                      )
                      or ""
                  ).strip()

                  imagem_nova = (
                      noticia.get(
                          "imagem",
                          ""
                      )
                      or ""
                  ).strip()


                  # Sempre preferir a versão
                  # que possui imagem.

                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      unicas[
                          chave
                      ] = noticia


          todas = list(
              unicas.values()
          )


          # ==========================================================
          # RECUPERAR IMAGENS ANTIGAS
          # ==========================================================

          for noticia in todas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  or ""
              ).strip()


              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or ""
              ).strip()


              if not imagem and link:

                  antiga = (
                      dados_antigos.get(
                          link
                      )
                  )


                  if antiga:

                      imagem_antiga = (
                          antiga.get(
                              "imagem",
                              ""
                          )
                          or ""
                      ).strip()


                      if imagem_antiga:

                          noticia[
                              "imagem"
                          ] = imagem_antiga


          # ==========================================================
          # ORDENAR POR DATA
          # ==========================================================

          def data_ordenacao(noticia):

              data = (
                  noticia.get(
                      "data",
                      ""
                  )
                  or ""
              )

              return data


          todas.sort(
              key=data_ordenacao,
              reverse=True
          )


          # ==========================================================
          # GARANTIR PRIORIDADE PARA NOTÍCIAS COM IMAGEM
          #
          # Se houver mais de 8 notícias disponíveis, primeiro ficam
          # as que possuem imagem.
          # ==========================================================

          com_imagem = []

          sem_imagem = []


          for noticia in todas:

              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  or ""
              ).strip()


              if imagem:

                  com_imagem.append(
                      noticia
                  )

              else:

                  sem_imagem.append(
                      noticia
                  )


          ordenadas = (
              com_imagem
              + sem_imagem
          )


          # ==========================================================
          # LIMITE
          # ==========================================================

          resultado = ordenadas[
              :LIMITE_FINAL
          ]


          # ==========================================================
          # SALVAR
          # ==========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================================
          # RELATÓRIO
          # ==========================================================

          print("")
          print(
              "========================================"
          )

          print(
              "SUCESSO"
          )

          print(
              "========================================"
          )

          print(
              "Novas:",
              len(novas)
          )

          print(
              "Finais:",
              len(resultado)
          )

          print(
              "========================================"
          )


          for noticia in resultado:

              print("")
              print(
                  "TÍTULO:",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "FONTE:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "LINK:",
                  noticia.get(
                      "link",
                      ""
                  )
              )

              print(
                  "IMAGEM:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )


          PY


