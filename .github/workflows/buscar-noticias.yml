name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # BAIXAR REPOSITÓRIO
      # =========================================================

      - name: Baixar repositório
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURAR PYTHON
      # =========================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # INSTALAR DEPENDÊNCIAS
      # =========================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # =========================================================
      # BUSCAR NOTÍCIAS
      # =========================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          ARQUIVO = "noticias.json"

          LIMITE = 8

          LIMITE_O_LIBERAL = 3
          LIMITE_DIARIO = 2
          LIMITE_G1 = 2

          URL_O_LIBERAL = "https://www.oliberal.com/"
          URL_DIARIO = "https://diariodopara.com.br/feed/"
          URL_G1 = "https://g1.globo.com/pa/para/"


          # =========================================================
          # SESSÃO HTTP
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,"
                  "image/avif,image/webp,*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
                  "no-cache"
          })


          # =========================================================
          # LIMPAR TEXTO
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =========================================================
          # CRIAR ID
          # =========================================================

          def criar_id(titulo, link):

              base = (
                  str(titulo).strip()
                  + "|"
                  + str(link).strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # =========================================================
          # BLOQUEAR MIX VALE
          # =========================================================

          def bloqueada(titulo, link):

              texto = (
                  str(titulo or "")
                  + " "
                  + str(link or "")
              ).lower()

              bloqueios = [
                  "mixvale",
                  "mix vale",
                  "mixvale.com.br"
              ]

              return any(
                  palavra in texto
                  for palavra in bloqueios
              )


          # =========================================================
          # NORMALIZAR URL
          # =========================================================

          def normalizar_url(url, pagina=""):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              return urljoin(
                  pagina,
                  url
              )


          # =========================================================
          # IMAGEM OG
          # =========================================================

          def imagem_og(soup, pagina):

              configuracoes = [
                  {"property": "og:image"},
                  {"property": "og:image:url"},
                  {"name": "twitter:image"},
                  {"name": "twitter:image:src"}
              ]

              for config in configuracoes:

                  meta = soup.find(
                      "meta",
                      attrs=config
                  )

                  if not meta:
                      continue

                  url = (
                      meta.get("content")
                      or ""
                  )

                  url = normalizar_url(
                      url,
                      pagina
                  )

                  if url:
                      return url

              return ""


          # =========================================================
          # IMAGEM JSON-LD
          # =========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          continue

                      dados = json.loads(texto)

                      objetos = []

                      if isinstance(
                          dados,
                          dict
                      ):

                          objetos.append(dados)

                          graph = dados.get("@graph")

                          if isinstance(
                              graph,
                              list
                          ):
                              objetos.extend(graph)

                      elif isinstance(
                          dados,
                          list
                      ):

                          objetos.extend(dados)


                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagem = obj.get("image")


                          if isinstance(
                              imagem,
                              str
                          ):

                              url = normalizar_url(
                                  imagem,
                                  pagina
                              )

                              if url:
                                  return url


                          if isinstance(
                              imagem,
                              dict
                          ):

                              url = (
                                  imagem.get("url")
                                  or
                                  imagem.get("contentUrl")
                                  or ""
                              )

                              url = normalizar_url(
                                  url,
                                  pagina
                              )

                              if url:
                                  return url


                          if isinstance(
                              imagem,
                              list
                          ):

                              for item in imagem:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      url = normalizar_url(
                                          item,
                                          pagina
                                      )

                                      if url:
                                          return url


                                  if isinstance(
                                      item,
                                      dict
                                  ):

                                      url = (
                                          item.get("url")
                                          or
                                          item.get("contentUrl")
                                          or ""
                                      )

                                      url = normalizar_url(
                                          url,
                                          pagina
                                      )

                                      if url:
                                          return url

                  except Exception:
                      continue

              return ""


          # =========================================================
          # IMAGEM DO HTML DO RSS
          # =========================================================

          def imagem_html(html, pagina):

              if not html:
                  return ""

              try:

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find("img")

                  if not img:
                      return ""

                  url = (
                      img.get("src")
                      or
                      img.get("data-src")
                      or
                      img.get("data-original")
                      or
                      img.get("data-lazy-src")
                      or
                      ""
                  )

                  return normalizar_url(
                      url,
                      pagina
                  )

              except Exception:
                  return ""


          # =========================================================
          # EXTRAIR IMAGEM DA MATÉRIA
          # =========================================================

          def extrair_imagem_pagina(link):

              print(
                  "      Procurando imagem:",
                  link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "      HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # -------------------------------------------------
                  # 1 - OG IMAGE
                  # -------------------------------------------------

                  imagem = imagem_og(
                      soup,
                      resposta.url
                  )

                  if imagem:

                      print(
                          "      Imagem OG encontrada"
                      )

                      return imagem


                  # -------------------------------------------------
                  # 2 - JSON-LD
                  # -------------------------------------------------

                  imagem = imagem_jsonld(
                      soup,
                      resposta.url
                  )

                  if imagem:

                      print(
                          "      Imagem JSON-LD encontrada"
                      )

                      return imagem


                  # -------------------------------------------------
                  # 3 - IMAGEM DO ARTICLE
                  # -------------------------------------------------

                  article = (
                      soup.find("article")
                      or
                      soup.find("main")
                  )

                  if article:

                      for img in article.find_all(
                          "img"
                      ):

                          url = (
                              img.get("src")
                              or
                              img.get("data-src")
                              or
                              img.get("data-original")
                              or
                              img.get("data-lazy-src")
                              or
                              ""
                          )

                          url = normalizar_url(
                              url,
                              resposta.url
                          )

                          if url:
                              return url


                  # -------------------------------------------------
                  # 4 - QUALQUER IMAGEM RELEVANTE
                  # -------------------------------------------------

                  for img in soup.find_all("img"):

                      url = (
                          img.get("src")
                          or
                          img.get("data-src")
                          or
                          img.get("data-original")
                          or
                          img.get("data-lazy-src")
                          or
                          ""
                      )

                      url = normalizar_url(
                          url,
                          resposta.url
                      )

                      if not url:
                          continue

                      if (
                          "logo" in url.lower()
                          or
                          "icon" in url.lower()
                          or
                          "avatar" in url.lower()
                      ):
                          continue

                      return url


              except Exception as erro:

                  print(
                      "      Erro imagem:",
                      erro
                  )

              return ""


          # =========================================================
          # DATA RSS
          # =========================================================

          def data_rss(item):

              try:

                  if item.get(
                      "published_parsed"
                  ):

                      return datetime(
                          *item.published_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if item.get(
                      "updated_parsed"
                  ):

                      return datetime(
                          *item.updated_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # =========================================================
          # LER NOTÍCIAS EXISTENTES
          # =========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []

              except Exception as erro:

                  print(
                      "Erro lendo JSON:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # =========================================================
          # MAPA DE IMAGENS ANTIGAS
          # =========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          # =========================================================
          # MAPA DE NOTÍCIAS ANTIGAS
          # =========================================================

          noticias_antigas_por_link = {}

          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              if link:

                  noticias_antigas_por_link[
                      link
                  ] = noticia


          # =========================================================
          # DIÁRIO DO PARÁ
          # =========================================================

          def buscar_diario():

              print("")
              print("========================================")
              print("FONTE: Diário do Pará")
              print("========================================")

              resultado = []

              try:

                  resposta = sessao.get(
                      URL_DIARIO,
                      timeout=30
                  )

                  print(
                      "HTTP Diário:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  feed = feedparser.parse(
                      resposta.content
                  )


                  for item in feed.entries:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = str(
                          item.get(
                              "link",
                              ""
                          )
                      ).strip()


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      imagem = ""


                      # -------------------------------------------------
                      # 1 - MEDIA CONTENT
                      # -------------------------------------------------

                      try:

                          for media in item.get(
                              "media_content",
                              []
                          ):

                              url = media.get(
                                  "url"
                              )

                              if url:

                                  imagem = normalizar_url(
                                      url,
                                      link
                                  )

                                  break

                      except Exception:
                          pass


                      # -------------------------------------------------
                      # 2 - MEDIA THUMBNAIL
                      # -------------------------------------------------

                      if not imagem:

                          try:

                              for media in item.get(
                                  "media_thumbnail",
                                  []
                              ):

                                  url = media.get(
                                      "url"
                                  )

                                  if url:

                                      imagem = normalizar_url(
                                          url,
                                          link
                                      )

                                      break

                          except Exception:
                              pass


                      # -------------------------------------------------
                      # 3 - ENCLOSURE
                      # -------------------------------------------------

                      if not imagem:

                          try:

                              for enclosure in item.get(
                                  "enclosures",
                                  []
                              ):

                                  url = enclosure.get(
                                      "href"
                                  ) or enclosure.get(
                                      "url"
                                  )

                                  if url:

                                      imagem = normalizar_url(
                                          url,
                                          link
                                      )

                                      break

                          except Exception:
                              pass


                      # -------------------------------------------------
                      # 4 - IMAGEM DENTRO DO RSS
                      # -------------------------------------------------

                      if not imagem:

                          html = (
                              item.get(
                                  "summary",
                                  ""
                              )
                              or
                              item.get(
                                  "description",
                                  ""
                              )
                          )

                          imagem = imagem_html(
                              html,
                              link
                          )


                      # -------------------------------------------------
                      # 5 - IMAGEM DA MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # 6 - IMAGEM ANTIGA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      noticia = {

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              "Diário do Pará",

                          "imagem":
                              imagem,

                          "data":
                              data_rss(
                                  item
                              ),

                          "categoria":
                              "PARÁ"
                      }


                      resultado.append(
                          noticia
                      )


                      print(
                          "Diário:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_DIARIO:
                          break


              except Exception as erro:

                  print(
                      "Erro Diário:",
                      erro
                  )

                  return []


              print(
                  "Diário encontrou:",
                  len(resultado)
              )

              return resultado


          # =========================================================
          # O LIBERAL
          # =========================================================

          def buscar_o_liberal():

              print("")
              print("========================================")
              print("FONTE: O Liberal")
              print("========================================")

              resultado = []
              vistos = set()

              try:

                  resposta = sessao.get(
                      URL_O_LIBERAL,
                      timeout=30
                  )

                  print(
                      "HTTP O Liberal:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  bloqueios = [
                      "/busca",
                      "/login",
                      "/newsletter",
                      "/videos",
                      "/video/",
                      "/webstories",
                      "/podcasts",
                      "/programas",
                      "/ao-vivo"
                  ]


                  secoes = [
                      "/policia/",
                      "/para/",
                      "/belem/",
                      "/amazonia/",
                      "/politica/",
                      "/economia/",
                      "/esportes/",
                      "/entretenimento/",
                      "/mundo/",
                      "/brasil/",
                      "/tecnologia/",
                      "/cultura/",
                      "/saude/",
                      "/concursos/"
                  ]


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue

                      if len(titulo) < 25:
                          continue

                      if len(titulo) > 180:
                          continue


                      link = urljoin(
                          resposta.url,
                          href
                      )

                      caminho = link.lower()


                      if "oliberal.com" not in caminho:
                          continue


                      if link in vistos:
                          continue

                      vistos.add(
                          link
                      )


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      if any(
                          item in caminho
                          for item in bloqueios
                      ):
                          continue


                      if not any(
                          secao in caminho
                          for secao in secoes
                      ):
                          continue


                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      noticia = {

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              "O Liberal",

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"
                      }


                      resultado.append(
                          noticia
                      )


                      print(
                          "O Liberal:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_O_LIBERAL:
                          break


              except Exception as erro:

                  print(
                      "Erro O Liberal:",
                      erro
                  )

                  return []


              print(
                  "O Liberal encontrou:",
                  len(resultado)
              )

              return resultado


          # =========================================================
          # G1 PARÁ
          # =========================================================

          def buscar_g1():

              print("")
              print("========================================")
              print("FONTE: G1 PARÁ")
              print("========================================")


              urls_rss = [

                  "https://g1.globo.com/rss/g1/pa/para/",

                  "https://g1.globo.com/dynamo/pa/para/rss2.xml"

              ]


              feed = None


              # -------------------------------------------------
              # TENTAR RSS
              # -------------------------------------------------

              for rss_url in urls_rss:

                  try:

                      print(
                          "Tentando RSS:",
                          rss_url
                      )

                      resposta = sessao.get(
                          rss_url,
                          timeout=30
                      )

                      print(
                          "HTTP:",
                          resposta.status_code
                      )


                      if resposta.status_code == 200:

                          teste = feedparser.parse(
                              resposta.content
                          )

                          if teste.entries:

                              feed = teste

                              break

                  except Exception as erro:

                      print(
                          "Erro RSS G1:",
                          erro
                      )


              resultado = []


              # =================================================
              # PROCESSAR RSS
              # =================================================

              if feed and feed.entries:

                  vistos = set()


                  for item in feed.entries:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = str(
                          item.get(
                              "link",
                              ""
                          )
                      ).strip()


                      if not titulo or not link:
                          continue


                      link = normalizar_url(
                          link,
                          URL_G1
                      )


                      caminho = link.lower()


                      if "g1.globo.com" not in caminho:
                          continue


                      if "/pa/para/" not in caminho:
                          continue


                      if "/noticia/" not in caminho:
                          continue


                      if link in vistos:
                          continue


                      vistos.add(
                          link
                      )


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      imagem = ""


                      # -------------------------------------------------
                      # 1 - MEDIA CONTENT
                      # -------------------------------------------------

                      try:

                          for media in item.get(
                              "media_content",
                              []
                          ):

                              url = media.get(
                                  "url"
                              )

                              if url:

                                  imagem = normalizar_url(
                                      url,
                                      link
                                  )

                                  break

                      except Exception:
                          pass


                      # -------------------------------------------------
                      # 2 - THUMBNAIL
                      # -------------------------------------------------

                      if not imagem:

                          try:

                              for media in item.get(
                                  "media_thumbnail",
                                  []
                              ):

                                  url = media.get(
                                      "url"
                                  )

                                  if url:

                                      imagem = normalizar_url(
                                          url,
                                          link
                                      )

                                      break

                          except Exception:
                              pass


                      # -------------------------------------------------
                      # 3 - HTML
                      # -------------------------------------------------

                      if not imagem:

                          html = (
                              item.get(
                                  "summary",
                                  ""
                              )
                              or
                              item.get(
                                  "description",
                                  ""
                              )
                          )

                          imagem = imagem_html(
                              html,
                              link
                          )


                      # -------------------------------------------------
                      # 4 - MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # 5 - IMAGEM ANTIGA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      noticia = {

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              "G1",

                          "imagem":
                              imagem,

                          "data":
                              data_rss(
                                  item
                              ),

                          "categoria":
                              "PARÁ"
                      }


                      resultado.append(
                          noticia
                      )


                      print(
                          "G1:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_G1:
                          break


              # =================================================
              # FALLBACK - PÁGINA DO G1
              # =================================================

              if len(resultado) < LIMITE_G1:

                  print(
                      "G1 RSS retornou poucas notícias."
                  )

                  print(
                      "Usando página do G1 como complemento."
                  )


                  try:

                      resposta = sessao.get(
                          URL_G1,
                          timeout=30
                      )

                      print(
                          "HTTP página G1:",
                          resposta.status_code
                      )


                      if resposta.status_code == 200:

                          soup = BeautifulSoup(
                              resposta.text,
                              "html.parser"
                          )


                          vistos = {
                              noticia["link"]
                              for noticia in resultado
                          }


                          for a in soup.find_all(
                              "a",
                              href=True
                          ):

                              titulo = limpar(
                                  a.get_text(
                                      " ",
                                      strip=True
                                  )
                              )

                              href = a.get(
                                  "href",
                                  ""
                              )


                              if not titulo:
                                  continue

                              if len(titulo) < 25:
                                  continue

                              if len(titulo) > 180:
                                  continue


                              link = urljoin(
                                  resposta.url,
                                  href
                              )

                              caminho = link.lower()


                              if "g1.globo.com" not in caminho:
                                  continue

                              if "/pa/para/" not in caminho:
                                  continue

                              if "/noticia/" not in caminho:
                                  continue


                              if link in vistos:
                                  continue


                              if bloqueada(
                                  titulo,
                                  link
                              ):
                                  continue


                              vistos.add(
                                  link
                              )


                              imagem = imagens_antigas.get(
                                  link,
                                  ""
                              )


                              if not imagem:

                                  imagem = extrair_imagem_pagina(
                                      link
                                  )


                              noticia = {

                                  "id":
                                      criar_id(
                                          titulo,
                                          link
                                      ),

                                  "titulo":
                                      titulo,

                                  "descricao":
                                      titulo,

                                  "link":
                                      link,

                                  "fonte":
                                      "G1",

                                  "imagem":
                                      imagem,

                                  "data":
                                      datetime.now(
                                          timezone.utc
                                      ).isoformat(),

                                  "categoria":
                                      "PARÁ"
                              }


                              resultado.append(
                                  noticia
                              )


                              print(
                                  "G1 fallback:",
                                  titulo
                              )


                              if len(resultado) >= LIMITE_G1:
                                  break


                  except Exception as erro:

                      print(
                          "Erro fallback G1:",
                          erro
                      )


              print(
                  "G1 encontrou:",
                  len(resultado)
              )


              return resultado


          # =========================================================
          # BUSCAR AS 3 FONTES
          # =========================================================

          noticias_diario = buscar_diario()

          noticias_liberal = buscar_o_liberal()

          noticias_g1 = buscar_g1()


          print("")
          print("========================================")
          print("RESULTADO POR FONTE")
          print("========================================")

          print(
              "Diário do Pará:",
              len(noticias_diario)
          )

          print(
              "O Liberal:",
              len(noticias_liberal)
          )

          print(
              "G1:",
              len(noticias_g1)
          )


          # =========================================================
          # MONTAR RESULTADO CONTROLADO
          # =========================================================

          selecionadas = []

          selecionadas.extend(
              noticias_liberal[:LIMITE_O_LIBERAL]
          )

          selecionadas.extend(
              noticias_diario[:LIMITE_DIARIO]
          )

          selecionadas.extend(
              noticias_g1[:LIMITE_G1]
          )


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}

          for noticia in selecionadas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              if not link:
                  continue


              chave = link.lower()


              if chave in unicas:

                  atual = unicas[chave]

                  imagem_atual = str(
                      atual.get(
                          "imagem",
                          ""
                      )
                  ).strip()

                  imagem_nova = str(
                      noticia.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      unicas[chave] = noticia

              else:

                  unicas[chave] = noticia


          selecionadas = list(
              unicas.values()
          )


          # =========================================================
          # COMPLETAR A 8ª VAGA
          #
          # Usa notícias adicionais das fontes, sem ultrapassar
          # os limites principais.
          # =========================================================

          adicionais = []


          adicionais.extend(
              noticias_liberal[LIMITE_O_LIBERAL:]
          )

          adicionais.extend(
              noticias_diario[LIMITE_DIARIO:]
          )

          adicionais.extend(
              noticias_g1[LIMITE_G1:]
          )


          # Ordenar adicionais pela data

          def data_para_ordenacao(noticia):

              valor = noticia.get(
                  "data",
                  ""
              )

              try:

                  if valor.endswith("Z"):
                      valor = (
                          valor[:-1]
                          + "+00:00"
                      )

                  data = datetime.fromisoformat(
                      valor
                  )

                  if data.tzinfo is None:
                      data = data.replace(
                          tzinfo=timezone.utc
                      )

                  return data

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          adicionais.sort(
              key=data_para_ordenacao,
              reverse=True
          )


          # =========================================================
          # ADICIONAR ATÉ COMPLETAR 8
          # =========================================================

          for noticia in adicionais:

              if len(selecionadas) >= LIMITE:
                  break


              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              if not link:
                  continue


              if link.lower() in unicas:
                  continue


              selecionadas.append(
                  noticia
              )

              unicas[
                  link.lower()
              ] = noticia


          # =========================================================
          # SE AINDA FALTAR, USAR NOTÍCIAS ANTIGAS
          # =========================================================

          if len(selecionadas) < LIMITE:

              antigas_ordenadas = sorted(
                  antigas,
                  key=data_para_ordenacao,
                  reverse=True
              )


              for noticia in antigas_ordenadas:

                  if len(selecionadas) >= LIMITE:
                      break


                  link = str(
                      noticia.get(
                          "link",
                          ""
                      )
                  ).strip()


                  if not link:
                      continue


                  if bloqueada(
                      noticia.get(
                          "titulo",
                          ""
                      ),
                      link
                  ):
                      continue


                  if link.lower() in unicas:
                      continue


                  selecionadas.append(
                      noticia
                  )

                  unicas[
                      link.lower()
                  ] = noticia


          # =========================================================
          # RECUPERAR IMAGENS ANTIGAS
          # =========================================================

          for noticia in selecionadas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              if not imagem and link:

                  antiga = imagens_antigas.get(
                      link,
                      ""
                  )

                  if antiga:

                      noticia["imagem"] = antiga


          # =========================================================
          # ORDENAR RESULTADO FINAL POR DATA
          # =========================================================

          selecionadas.sort(
              key=data_para_ordenacao,
              reverse=True
          )


          # =========================================================
          # GARANTIR SOMENTE 8
          # =========================================================

          resultado = selecionadas[
              :LIMITE
          ]


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RELATÓRIO
          # =========================================================

          print("")
          print("========================================")
          print("SUCESSO!")
          print("========================================")

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print("")

          for noticia in resultado:

              print(
                  "-",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "  Fonte:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "  Imagem:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )

          print("========================================")


          PY

      # =========================================================
      # SALVAR NO GITHUB
      # =========================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email \
            "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
