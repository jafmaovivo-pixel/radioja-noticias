name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "ERRO: NEWSDATA_API_KEY não configurada."
              )

          URL = "https://newsdata.io/api/1/latest"

          parametros = {
              "apikey": API_KEY,
              "country": "br",
              "language": "pt",
              "q": "Pará",
              "size": "10"
          }

          url = URL + "?" + urllib.parse.urlencode(parametros)

          print("Consultando NewsData...")
          print("Consulta: Pará")

          try:

              requisicao = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "RadioJA-FM-NewsBot/1.0"
                  }
              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=30
              ) as resposta:

                  dados = json.loads(
                      resposta.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as erro:

              print(
                  f"ERRO HTTP {erro.code}: {erro.reason}"
              )

              if erro.code == 429:

                  raise SystemExit(
                      "A NewsData recusou a requisição "
                      "por limite de uso (429). "
                      "Aguarde o limite ser reiniciado "
                      "e execute novamente."
                  )

              raise

          except Exception as erro:

              raise SystemExit(
                  f"ERRO ao acessar NewsData: {erro}"
              )

          if dados.get("status") != "success":

              print("Resposta da API:")
              print(json.dumps(
                  dados,
                  ensure_ascii=False,
                  indent=2
              ))

              raise SystemExit(
                  "A NewsData não retornou sucesso."
              )

          resultados = dados.get(
              "results",
              []
          )

          print(
              f"Notícias recebidas: {len(resultados)}"
          )

          noticias = []

          links = set()
          titulos = set()

          bloqueados = [
              "mix vale",
              "mixvale",
              "mixvale.com.br"
          ]

          for item in resultados:

              titulo = (
                  item.get("title") or ""
              ).strip()

              link = (
                  item.get("link") or ""
              ).strip()

              if not titulo or not link:
                  continue

              texto = (
                  titulo
                  + " "
                  + str(item.get("source_name") or "")
                  + " "
                  + link
              ).lower()

              if any(
                  termo in texto
                  for termo in bloqueados
              ):
                  continue

              titulo_chave = titulo.lower()

              if link in links:
                  continue

              if titulo_chave in titulos:
                  continue

              links.add(link)
              titulos.add(titulo_chave)

              noticias.append({
                  "id": item.get("article_id"),
                  "titulo": titulo,
                  "descricao": item.get("description"),
                  "link": link,
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate"),
                  "categoria": "PARÁ"
              })

              if len(noticias) >= 8:
                  break

          # -----------------------------------------------
          # NÃO APAGAR O JSON SE A API NÃO RETORNAR NOTÍCIAS
          # -----------------------------------------------

          arquivo = "noticias.json"

          antigas = []

          if os.path.exists(arquivo):

              try:

                  with open(
                      arquivo,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      antigas = json.load(
                          f
                      ).get(
                          "noticias",
                          []
                      )

              except Exception:

                  antigas = []

          # -----------------------------------------------
          # COMPLETA COM NOTÍCIAS ANTIGAS
          # -----------------------------------------------

          if len(noticias) < 8:

              for antiga in antigas:

                  link = (
                      antiga.get("link") or ""
                  )

                  titulo = (
                      antiga.get("titulo") or ""
                  ).lower()

                  if not link or not titulo:
                      continue

                  if link in links:
                      continue

                  if titulo in titulos:
                      continue

                  noticias.append(antiga)

                  links.add(link)
                  titulos.add(titulo)

                  if len(noticias) >= 8:
                      break

          # -----------------------------------------------
          # NÃO DEIXAR O JSON VAZIO
          # -----------------------------------------------

          if not noticias:

              raise SystemExit(
                  "Nenhuma notícia encontrada. "
                  "O noticias.json foi preservado."
              )

          resultado = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias": noticias[:8]
          }

          with open(
              arquivo,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==============================")
          print(
              "NOTÍCIAS SALVAS:",
              len(noticias[:8])
          )
          print("==============================")


          PY

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
