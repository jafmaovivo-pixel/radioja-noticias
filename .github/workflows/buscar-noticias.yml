name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Buscar notícias
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["NEWSDATA_API_KEY"]
          API_URL = "https://newsdata.io/api/1/latest"

          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          BLOQUEADOS = [
              "mix vale",
              "mixvale"
          ]

          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [
              "tomé-açu",
              "tomé açu",
              "tome-acu",
              "tome acu"
          ]

          # =====================================================
          # BELÉM E REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [
              "belém",
              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do pará",
              "santa izabel do para",
              "santa bárbara do pará",
              "santa barbara do para"
          ]

          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [
              "castanhal",
              "bragança",
              "braganca",
              "capanema",
              "salinópolis",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cametá",
              "cameta",
              "vigia",
              "capitão poço",
              "capitao poco",
              "igarapé-açu",
              "igarape-acu"
          ]

          # =====================================================
          # PARÁ
          # =====================================================

          PARA = [
              "pará",
              "paraense",
              "paraenses",
              "estado do pará",
              "estado do para",
              "governo do pará",
              "governo do para",
              "polícia do pará",
              "policia do para",
              "assembleia legislativa do pará",
              "assembleia legislativa do para",
              "tribunal de justiça do pará",
              "tribunal de justica do para"
          ]

          # =====================================================
          # OUTRAS REGIÕES
          #
          # Se a notícia mencionar claramente uma dessas regiões
          # e NÃO tiver relação clara com o Pará, ela será descartada.
          # =====================================================

          OUTRAS_REGIOES = [

              # Bahia
              "bahia",
              "salvador",
              "feira de santana",
              "vitória da conquista",
              "vitoria da conquista",

              # São Paulo
              "são paulo",
              "sao paulo",
              "campinas",
              "santos",
              "guarulhos",

              # Rio de Janeiro
              "rio de janeiro",
              "niterói",
              "niteroi",
              "duque de caxias",
              "nova iguaçu",
              "nova iguacu",

              # Minas Gerais
              "minas gerais",
              "belo horizonte",
              "uberlandia",
              "uberlândia",

              # Pernambuco
              "pernambuco",
              "recife",

              # Ceará
              "ceará",
              "ceara",
              "fortaleza",

              # Paraná
              "paraná",
              "parana",
              "curitiba",

              # Rio Grande do Sul
              "rio grande do sul",
              "porto alegre",

              # Santa Catarina
              "santa catarina",
              "florianópolis",
              "florianopolis",

              # Goiás
              "goiás",
              "goias",
              "goiânia",
              "goiania",

              # Distrito Federal
              "brasília",
              "brasilia",
              "distrito federal",

              # Amazonas
              "amazonas",
              "manaus",

              # Acre
              "acre",
              "rio branco",

              # Rondônia
              "rondônia",
              "rondonia",
              "porto velho",

              # Mato Grosso
              "mato grosso",
              "cuiabá",
              "cuiaba",

              # Mato Grosso do Sul
              "mato grosso do sul",
              "campo grande",

              # Espírito Santo
              "espírito santo",
              "espirito santo",
              "vitória",
              "vitoria"
          ]

          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = texto.lower()

              return texto


          # =====================================================
          # BUSCAR NOTÍCIAS
          # =====================================================

          def buscar(consulta):

              parametros = {
                  "apikey": API_KEY,
                  "country": "br",
                  "language": "pt",
                  "q": consulta
              }

              url = (
                  API_URL +
                  "?" +
                  urllib.parse.urlencode(parametros)
              )

              try:

                  requisicao = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "RadioJA-FM-News/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      requisicao,
                      timeout=30
                  ) as resposta:

                      dados = json.loads(
                          resposta.read().decode("utf-8")
                      )

                  return dados.get("results", [])

              except Exception as erro:

                  print("ERRO NA BUSCA:", erro)

                  return []


          # =====================================================
          # TEXTO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              return normalizar(
                  " ".join([
                      item.get("title") or "",
                      item.get("description") or ""
                  ])
              )


          # =====================================================
          # NOTÍCIAS BLOQUEADAS
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = (
                  titulo + " " +
                  descricao + " " +
                  fonte
              )

              for termo in BLOQUEADOS:

                  if termo in texto:
                      return True

              if "mixvale.com.br" in link:
                  return True

              return False


          # =====================================================
          # VERIFICAR GRUPO
          # =====================================================

          def pertence_ao_grupo(item, termos):

              texto = texto_noticia(item)

              for termo in termos:

                  if termo in texto:
                      return True

              return False


          # =====================================================
          # VERIFICAR SE É NOTÍCIA VÁLIDA
          # =====================================================

          def valido(item):

              if not item.get("title"):
                  return False

              if not item.get("link"):
                  return False

              if bloqueada(item):
                  return False

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = (
                  titulo + " " +
                  descricao + " " +
                  fonte
              )

              # =================================================
              # PRIORIDADE PARA NOTÍCIAS DO PARÁ
              # =================================================

              eh_para = (
                  pertence_ao_grupo(item, PARA)
                  or
                  pertence_ao_grupo(item, TOME_ACU)
                  or
                  pertence_ao_grupo(item, BELEM_RMB)
                  or
                  pertence_ao_grupo(item, NORDESTE_PARA)
              )

              # =================================================
              # REJEITAR NOTÍCIAS DE OUTROS ESTADOS
              # =================================================

              for regiao in OUTRAS_REGIOES:

                  if regiao in texto:

                      # Se tiver relação clara com o Pará,
                      # permitimos.
                      if eh_para:
                          continue

                      return False

              return True


          # =====================================================
          # CONVERTER NOTÍCIA
          # =====================================================

          def converter(item):

              return {
                  "id": item.get("article_id"),
                  "titulo": item.get("title"),
                  "descricao": item.get("description"),
                  "link": item.get("link"),
                  "fonte": item.get("source_name"),
                  "imagem": item.get("image_url"),
                  "data": item.get("pubDate")
              }


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              '"Tomé-Açu"',

              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',

              # -----------------------------------------------
              # NORDESTE DO PARÁ
              # -----------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',

              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              '"Pará"',
              '"governo do Pará"',
              '"polícia do Pará"',

              # -----------------------------------------------
              # NOTÍCIAS NACIONAIS
              # -----------------------------------------------

              '"economia brasileira"',
              '"política nacional"',
              '"saúde no Brasil"',
              '"educação no Brasil"',
              '"segurança pública"',
              '"mercado brasileiro"',
              '"Congresso Nacional"',
              '"Supremo Tribunal Federal"',
              '"Presidência da República"'
          ]


          # =====================================================
          # COLETAR NOTÍCIAS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print("BUSCANDO:", consulta)

              resultados = buscar(consulta)

              print(
                  "RESULTADOS:",
                  len(resultados)
              )

              for item in resultados:

                  if not valido(item):
                      continue

                  link = (
                      item.get("link") or ""
                  ).strip()

                  if not link:
                      continue

                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS VÁLIDOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []
          belem = []
          nordeste = []
          para = []
          brasil = []


          for item in candidatos.values():

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

              elif pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

              elif pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

              elif pertence_ao_grupo(
                  item,
                  PARA
              ):

                  para.append(item)

              else:

                  brasil.append(item)


          print("")
          print("CLASSIFICAÇÃO")
          print(
              "Tomé-Açu:",
              len(tome_acu)
          )
          print(
              "Belém/RMB:",
              len(belem)
          )
          print(
              "Nordeste do Pará:",
              len(nordeste)
          )
          print(
              "Pará:",
              len(para)
          )
          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()
          links_usados = set()
          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(titulo)

              titulo = re.sub(
                  r"[^a-z0-9áéíóúãõâêôç ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(item, categoria):

              if len(noticias) >= 8:
                  return False

              link = (
                  item.get("link") or ""
              ).strip()

              titulo = titulo_normalizado(
                  item.get("title") or ""
              )

              if link in links_usados:
                  return False

              if titulo in titulos_usados:
                  return False

              links_usados.add(link)
              titulos_usados.add(titulo)

              noticia = converter(item)

              noticias.append(noticia)

              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"
              )

              return True


          # =====================================================
          # ORDEM DE PRIORIDADE
          # =====================================================

          # -----------------------------------------------
          # 1. TOMÉ-AÇU
          # -----------------------------------------------

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # -----------------------------------------------
          # 2. BELÉM / RMB
          # Máximo de 2
          # -----------------------------------------------

          contador_belem = 0

          for item in belem:

              if len(noticias) >= 8:
                  break

              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1

              if contador_belem >= 2:
                  break


          # -----------------------------------------------
          # 3. NORDESTE DO PARÁ
          # Máximo de 2
          # -----------------------------------------------

          contador_nordeste = 0

          for item in nordeste:

              if len(noticias) >= 8:
                  break

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1

              if contador_nordeste >= 2:
                  break


          # -----------------------------------------------
          # 4. OUTRAS NOTÍCIAS DO PARÁ
          # -----------------------------------------------

          for item in para:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "PARÁ"
              )


          # -----------------------------------------------
          # 5. NOTÍCIAS NACIONAIS
          # -----------------------------------------------

          for item in brasil:

              if len(noticias) >= 8:
                  break

              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR ARQUIVO
          # =====================================================

          resultado = {

              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "noticias": noticias[:8]
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RESULTADO FINAL
          # =====================================================

          print("")
          print("==============================")
          print(
              "TOTAL FINAL:",
              len(noticias[:8])
          )
          print("==============================")


          PY


      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio J.A FM"
          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"

          git push
