name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup


          ARQUIVO = "noticias.json"

          # ---------------------------------------------------------
          # CONFIGURAÇÃO
          # ---------------------------------------------------------

          LIMITE = 8

          FONTES = [

              {
                  "nome": "G1 - O Portal",
                  "url": "https://g1.globo.com/rss/g1/para/"
              },

              {
                  "nome": "O Liberal",
                  "url": "https://www.oliberal.com/rss"
              },

              {
                  "nome": "Diário do Pará",
                  "url": "https://diariodopara.com.br/feed/"
              }

          ]


          # ---------------------------------------------------------
          # FUNÇÕES
          # ---------------------------------------------------------

          def limpar_texto(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(texto, "html.parser")

              texto = soup.get_text(" ", strip=True)

              texto = re.sub(r"\s+", " ", texto)

              return texto.strip()


          def criar_id(titulo, link):

              base = (titulo + "|" + link).encode("utf-8")

              return hashlib.md5(base).hexdigest()


          def extrair_imagem(item):

              # media_content
              if hasattr(item, "media_content"):

                  try:

                      for media in item.media_content:

                          if media.get("url"):

                              return media.get("url")

                  except Exception:
                      pass


              # media_thumbnail
              if hasattr(item, "media_thumbnail"):

                  try:

                      for media in item.media_thumbnail:

                          if media.get("url"):

                              return media.get("url")

                  except Exception:
                      pass


              # enclosure
              if hasattr(item, "enclosures"):

                  try:

                      for enclosure in item.enclosures:

                          url = enclosure.get("href") or enclosure.get("url")

                          if url:
                              return url

                  except Exception:
                      pass


              # imagem dentro da descrição
              descricao = item.get("description", "")

              if descricao:

                  soup = BeautifulSoup(descricao, "html.parser")

                  img = soup.find("img")

                  if img and img.get("src"):

                      return img.get("src")


              return ""


          def obter_data(item):

              try:

                  if item.get("published_parsed"):

                      return datetime.fromtimestamp(
                          time.mktime(item.published_parsed),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass

              try:

                  if item.get("updated_parsed"):

                      return datetime.fromtimestamp(
                          time.mktime(item.updated_parsed),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass

              return datetime.now(timezone.utc).isoformat()


          # ---------------------------------------------------------
          # LER JSON ATUAL
          # ---------------------------------------------------------

          noticias_antigas = []

          if os.path.exists(ARQUIVO):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados_antigos = json.load(arquivo)

                      if isinstance(
                          dados_antigos,
                          dict
                      ):

                          noticias_antigas = dados_antigos.get(
                              "noticias",
                              []
                          )

              except Exception as erro:

                  print(
                      "Aviso: não foi possível ler o JSON atual:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(noticias_antigas)
          )


          # ---------------------------------------------------------
          # BUSCAR NOVAS NOTÍCIAS
          # ---------------------------------------------------------

          novas = []


          for fonte in FONTES:

              nome = fonte["nome"]
              url = fonte["url"]

              print("")
              print("====================================")
              print("Consultando:", nome)
              print(url)
              print("====================================")

              try:

                  # Pequena pausa para evitar bloqueios
                  time.sleep(3)

                  resposta = requests.get(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (compatible; RadioJA-FM/1.0)"
                      },
                      timeout=20
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code == 429:

                      print(
                          "429 - Fonte limitou as consultas."
                      )

                      print(
                          "Ignorando esta fonte e continuando..."
                      )

                      continue


                  if resposta.status_code != 200:

                      print(
                          "Fonte indisponível:",
                          resposta.status_code
                      )

                      continue


                  feed = feedparser.parse(
                      resposta.content
                  )


                  if not feed.entries:

                      print(
                          "Nenhuma notícia encontrada."
                      )

                      continue


                  contador = 0


                  for item in feed.entries:

                      titulo = limpar_texto(
                          item.get("title", "")
                      )

                      link = item.get(
                          "link",
                          ""
                      )


                      if not titulo or not link:

                          continue


                      titulo_lower = titulo.lower()
                      link_lower = link.lower()


                      # ------------------------------------------------
                      # BLOQUEIOS
                      # ------------------------------------------------

                      if "mixvale" in titulo_lower:
                          continue

                      if "mixvale" in link_lower:
                          continue

                      if "mix vale" in titulo_lower:
                          continue


                      imagem = extrair_imagem(
                          item
                      )


                      descricao = limpar_texto(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      data = obter_data(
                          item
                      )


                      noticia = {

                          "id": criar_id(
                              titulo,
                              link
                          ),

                          "titulo": titulo,

                          "descricao": descricao,

                          "link": link,

                          "fonte": nome,

                          "imagem": imagem,

                          "data": data,

                          "categoria": "PARÁ"

                      }


                      novas.append(
                          noticia
                      )

                      contador += 1


                      if contador >= 10:
                          break


                  print(
                      "Notícias encontradas:",
                      contador
                  )


              except Exception as erro:

                  print(
                      "Erro nesta fonte:",
                      erro
                  )

                  print(
                      "Continuando normalmente..."
                  )

                  continue


          # ---------------------------------------------------------
          # JUNTAR NOTÍCIAS NOVAS + ANTIGAS
          # ---------------------------------------------------------

          todas = novas + noticias_antigas


          # ---------------------------------------------------------
          # REMOVER DUPLICADAS
          # ---------------------------------------------------------

          unicas = {}

          for noticia in todas:

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
                  .lower()
              )


              chave = link or titulo


              if not chave:
                  continue


              if chave not in unicas:

                  unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # ---------------------------------------------------------
          # ORDENAR POR DATA
          # ---------------------------------------------------------

          def data_noticia(noticia):

              try:

                  return noticia.get(
                      "data",
                      ""
                  )

              except Exception:

                  return ""


          todas.sort(
              key=data_noticia,
              reverse=True
          )


          # ---------------------------------------------------------
          # PEGAR AS 8 MAIS RECENTES
          # ---------------------------------------------------------

          resultado = todas[:LIMITE]


          # ---------------------------------------------------------
          # SE NÃO ENCONTROU NADA
          # NÃO APAGA O JSON EXISTENTE
          # ---------------------------------------------------------

          if len(novas) == 0:

              print("")
              print(
                  "===================================="
              )

              print(
                  "NENHUMA NOTÍCIA NOVA FOI ENCONTRADA."
              )

              print(
                  "O noticias.json será preservado."
              )

              print(
                  "===================================="
              )

              raise SystemExit(0)


          # ---------------------------------------------------------
          # SALVAR JSON
          # ---------------------------------------------------------

          dados = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "===================================="
          )

          print(
              "SUCESSO!"
          )

          print(
              "Novas notícias:",
              len(novas)
          )

          print(
              "Total gravado:",
              len(resultado)
          )

          print(
              "===================================="

          )

          PY


      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || git commit -m "Atualizar notícias"

          git push

