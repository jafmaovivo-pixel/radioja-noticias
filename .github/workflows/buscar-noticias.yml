name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR O REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos
        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"

          LIMITE_NOTICIAS = 8


          # =====================================================
          # VERIFICAR API KEY
          # =====================================================

          if not API_KEY:

              print("ERRO: NEWSDATA_API_KEY não configurada.")

              raise SystemExit(1)


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu"

          ]


          # =====================================================
          # BELÉM E REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua",
              "braganca do para"

          ]


          # =====================================================
          # TERMOS QUE IDENTIFICAM O PARÁ
          # =====================================================

          PARA = [

              "para",
              "paraense",
              "paraenses",
              "estado do para",
              "governo do para",
              "policia do para",
              "policia civil do para",
              "policia militar do para",
              "ministerio publico do para",
              "tribunal de justica do para",
              "assembleia legislativa do para",
              "governador do para",
              "governadora do para",
              "eleicoes do para",
              "eleicoes paraenses",
              "amazonas paraense"

          ]


          # =====================================================
          # OUTRAS REGIÕES / ESTADOS
          # =====================================================

          OUTRAS_REGIOES = [

              "bahia",
              "salvador",

              "sao paulo",

              "rio de janeiro",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceara",
              "fortaleza",

              "parana",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasilia",
              "distrito federal",

              "goias",
              "goiania",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondonia",
              "porto velho",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "vitoria",

              "santa catarina",
              "florianopolis",

              "maranhao",
              "sao luis",

              "piaui",
              "teresina",

              "paraiba",
              "joao pessoa",

              "rio grande do norte",
              "natal",

              "alagoas",
              "maceio",

              "sergipe",
              "aracaju",

              "tocantins",
              "palmas",

              "amapa",
              "macapa"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caractere
                  for caractere in texto
                  if unicodedata.category(caractere) != "Mn"
              )

              texto = texto.replace("-", " ")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # VERIFICAR TERMO
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:
                  return False

              padrao = (
                  r"(?<![a-z0-9])"
                  + re.escape(termo)
                  + r"(?![a-z0-9])"
              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO COMPLETO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or "",

                  item.get("content") or "",

                  item.get("creator") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # VERIFICAR NOTÍCIA BLOQUEADA
          # =====================================================

          def bloqueada(item):

              texto = texto_noticia(item)

              link = normalizar(
                  item.get("link") or ""
              )

              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      print(
                          "BLOQUEADA:",
                          item.get("title")
                      )

                      return True


              if "mixvale.com.br" in link:

                  print(
                      "BLOQUEADA PELO LINK:",
                      link
                  )

                  return True


              return False


          # =====================================================
          # NOTÍCIA VÁLIDA
          #
          # ESTA É A FUNÇÃO CORRIGIDA
          # =====================================================

          def valido(item):

              if not isinstance(item, dict):

                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:

                  return False


              if not link:

                  return False


              # Remove links inválidos
              if link.startswith("javascript:"):

                  return False


              if bloqueada(item):

                  return False


              return True


          # =====================================================
          # BUSCAR NOTÍCIAS NA NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta

              }


              url = (

                  API_URL
                  + "?"
                  + urllib.parse.urlencode(parametros)

              )


              print(
                  "URL DE BUSCA:",
                  consulta
              )


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/2.0"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      conteudo = (
                          resposta
                          .read()
                          .decode("utf-8")
                      )


                  dados = json.loads(
                      conteudo
                  )


                  status = dados.get(
                      "status"
                  )


                  if status == "error":

                      print(
                          "ERRO DA NEWSDATA:",
                          dados
                      )

                      return []


                  resultados = dados.get(
                      "results",
                      []
                  )


                  if not isinstance(
                      resultados,
                      list
                  ):

                      return []


                  return resultados


              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # CONVERTER NOTÍCIA
          # =====================================================

          def converter(item, categoria):

              imagem = (
                  item.get("image_url")
              )


              if imagem == "":

                  imagem = None


              return {

                  "id":
                      item.get("article_id"),

                  "titulo":
                      item.get("title"),

                  "descricao":
                      item.get("description"),

                  "link":
                      item.get("link"),

                  "fonte":
                      item.get("source_name"),

                  "imagem":
                      imagem,

                  "data":
                      item.get("pubDate"),

                  "categoria":
                      categoria

              }


          # =====================================================
          # VERIFICAR GRUPO
          # =====================================================

          def pertence_ao_grupo(item, termos):

              texto = texto_noticia(item)


              for termo in termos:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR OUTRA REGIÃO
          # =====================================================

          def pertence_outra_regiao(item):

              texto = texto_noticia(item)


              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR SE É DO PARÁ
          # =====================================================

          def eh_para(item):

              texto = texto_noticia(item)


              tem_para = pertence_ao_grupo(
                  item,
                  PARA
              )


              tem_outra_regiao = pertence_outra_regiao(
                  item
              )


              # Se há referência explícita ao Pará,
              # consideramos notícia do Pará mesmo que
              # também cite outro estado.

              if tem_para:

                  return True


              # Se não há Pará, não classifica como Pará.

              if tem_outra_regiao:

                  return False


              return False


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              '"Tomé-Açu"',


              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',


              # -----------------------------------------------
              # NORDESTE DO PARÁ
              # -----------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',


              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              '"Pará"',
              '"Governo do Pará"',
              '"Polícia do Pará"',
              '"Estado do Pará"',


              # -----------------------------------------------
              # BRASIL
              # -----------------------------------------------

              '"Brasil"'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print(
                  "========================================"
              )

              print(
                  "BUSCANDO:",
                  consulta
              )

              print(
                  "========================================"
              )


              resultados = buscar(
                  consulta
              )


              print(
                  "RESULTADOS:",
                  len(resultados)
              )


              for item in resultados:

                  if not valido(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:

                      continue


                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )

          print(
              "========================================"
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          for item in candidatos.values():

              # -----------------------------------------------
              # 1. TOMÉ-AÇU
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

                  continue


              # -----------------------------------------------
              # 2. BELÉM / RMB
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

                  continue


              # -----------------------------------------------
              # 3. NORDESTE DO PARÁ
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

                  continue


              # -----------------------------------------------
              # 4. PARÁ
              # -----------------------------------------------

              if eh_para(item):

                  para.append(item)

                  continue


              # -----------------------------------------------
              # 5. BRASIL
              #
              # Aqui fica somente aquilo que não foi
              # classificado como Pará.
              # -----------------------------------------------

              brasil.append(item)


          # =====================================================
          # MOSTRAR CLASSIFICAÇÃO
          # =====================================================

          print("")
          print(
              "========================================"
          )

          print(
              "CLASSIFICAÇÃO"
          )

          print(
              "========================================"
          )

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste do Pará:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )


              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )


              return titulo.strip()


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE_NOTICIAS:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:

                  return False


              if not titulo:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticia = converter(

                  item,

                  categoria

              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM / RMB
          # MÁXIMO 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1


              if contador_belem >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE DO PARÁ
          # MÁXIMO 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1


              if contador_nordeste >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          # =====================================================

          for item in brasil:

              if len(noticias) >= LIMITE_NOTICIAS:

                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE_NOTICIAS]

          }


          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO FINAL
          # =====================================================

          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL FINAL:",
              len(noticias[:LIMITE_NOTICIAS])
          )

          print(
              "========================================"
          )


          if not noticias:

              print(
                  "ATENÇÃO: nenhuma notícia foi encontrada."
              )


          print("")


          for numero, noticia in enumerate(

              noticias[:LIMITE_NOTICIAS],

              start=1

          ):

              print(

                  f"{numero}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"

              )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"


          git add noticias.json


          if git diff --cached --quiet; then

            echo "Nenhuma alteração nas notícias."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
