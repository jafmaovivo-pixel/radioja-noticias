name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          from urllib.parse import urljoin


          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          ARQUIVO = "noticias.json"
          LIMITE_TOTAL = 8

          FONTES = [
              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },
              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },
              {
                  "nome": "G1",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              }
          ]


          # =========================================================
          # SESSÃO
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",
              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8"
          })


          # =========================================================
          # FUNÇÕES
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              return re.sub(
                  r"\s+",
                  " ",
                  texto
              ).strip()


          def criar_id(titulo, link):

              return hashlib.md5(
                  (
                      titulo.strip()
                      + "|"
                      + link.strip()
                  ).encode("utf-8")
              ).hexdigest()


          def normalizar_url(url, pagina):

              if not url:
                  return ""

              url = url.strip()

              if url.startswith("//"):
                  return "https:" + url

              return urljoin(
                  pagina,
                  url
              )


          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              bloqueios = [
                  "mixvale",
                  "mix vale"
              ]

              return any(
                  palavra in texto
                  for palavra in bloqueios
              )


          # =========================================================
          # IMAGEM VIA HTML
          # =========================================================

          def extrair_imagem(link):

              try:

                  resposta = sessao.get(
                      link,
                      timeout=20,
                      allow_redirects=True
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # -------------------------------------------------
                  # OG IMAGE
                  # -------------------------------------------------

                  for atributo, valor in [
                      ("property", "og:image"),
                      ("property", "og:image:url"),
                      ("name", "twitter:image"),
                      ("name", "twitter:image:src")
                  ]:

                      meta = soup.find(
                          "meta",
                          attrs={
                              atributo: valor
                          }
                      )

                      if meta:

                          imagem = normalizar_url(
                              meta.get("content", ""),
                              link
                          )

                          if imagem:
                              return imagem


                  # -------------------------------------------------
                  # JSON-LD
                  # -------------------------------------------------

                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:

                      try:

                          dados = json.loads(
                              script.string or ""
                          )

                          objetos = []

                          if isinstance(
                              dados,
                              dict
                          ):

                              objetos.append(dados)

                              if isinstance(
                                  dados.get("@graph"),
                                  list
                              ):

                                  objetos.extend(
                                      dados["@graph"]
                                  )

                          elif isinstance(
                              dados,
                              list
                          ):

                              objetos.extend(dados)


                          for obj in objetos:

                              if not isinstance(
                                  obj,
                                  dict
                              ):
                                  continue

                              imagem = obj.get(
                                  "image"
                              )

                              if isinstance(
                                  imagem,
                                  str
                              ):

                                  imagem = normalizar_url(
                                      imagem,
                                      link
                                  )

                                  if imagem:
                                      return imagem

                              if isinstance(
                                  imagem,
                                  dict
                              ):

                                  imagem = (
                                      imagem.get("url")
                                      or imagem.get("contentUrl")
                                      or ""
                                  )

                                  imagem = normalizar_url(
                                      imagem,
                                      link
                                  )

                                  if imagem:
                                      return imagem

                              if isinstance(
                                  imagem,
                                  list
                              ):

                                  for item in imagem:

                                      if isinstance(
                                          item,
                                          str
                                      ):

                                          imagem = normalizar_url(
                                              item,
                                              link
                                          )

                                          if imagem:
                                              return imagem

                                      if isinstance(
                                          item,
                                          dict
                                      ):

                                          imagem = (
                                              item.get("url")
                                              or item.get("contentUrl")
                                              or ""
                                          )

                                          imagem = normalizar_url(
                                              imagem,
                                              link
                                          )

                                          if imagem:
                                              return imagem

                      except Exception:
                          continue


                  # -------------------------------------------------
                  # IMAGEM DO ARTICLE
                  # -------------------------------------------------

                  article = (
                      soup.find("article")
                      or soup.find("main")
                  )

                  if article:

                      for img in article.find_all(
                          "img"
                      ):

                          imagem = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get("data-original")
                              or img.get("data-lazy-src")
                              or ""
                          )

                          imagem = normalizar_url(
                              imagem,
                              link
                          )

                          if imagem:
                              return imagem


                  return ""

              except Exception as erro:

                  print(
                      "Erro imagem:",
                      erro
                  )

                  return ""


          # =========================================================
          # IMAGEM DO RSS
          # =========================================================

          def imagem_rss(item):

              try:

                  for media in item.get(
                      "media_content",
                      []
                  ):

                      if media.get("url"):
                          return media["url"]

              except Exception:
                  pass


              try:

                  for media in item.get(
                      "media_thumbnail",
                      []
                  ):

                      if media.get("url"):
                          return media["url"]

              except Exception:
                  pass


              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                          or ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  html = (
                      item.get("summary", "")
                      or item.get("description", "")
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find("img")

                  if img:

                      return (
                          img.get("src")
                          or img.get("data-src")
                          or ""
                      )

              except Exception:
                  pass


              return ""


          # =========================================================
          # LER JSON EXISTENTE
          # =========================================================

          antigas = []

          if os.path.exists(ARQUIVO):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(arquivo)

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []

              except Exception:

                  antigas = []


          print(
              "Notícias antigas:",
              len(antigas)
          )


          # =========================================================
          # MAPA DAS IMAGENS ANTIGAS
          # =========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = (
                  noticia.get("link", "")
                  .strip()
              )

              imagem = (
                  noticia.get("imagem", "")
                  .strip()
              )

              if link and imagem:

                  imagens_antigas[link] = imagem


          # =========================================================
          # BUSCAR RSS
          # =========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "================================"
              )
              print(
                  "RSS:",
                  fonte["nome"]
              )
              print(
                  "================================"
              )

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=20
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  feed = feedparser.parse(
                      resposta.content
                  )

                  resultado = []

                  for item in feed.entries[:10]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = (
                          item.get(
                              "link",
                              ""
                          )
                          .strip()
                      )

                      if not titulo or not link:
                          continue

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue

                      imagem = imagem_rss(
                          item
                      )

                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )

                      if not imagem:

                          imagem = extrair_imagem(
                              link
                          )

                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              limpar(
                                  item.get(
                                      "summary",
                                      item.get(
                                          "description",
                                          ""
                                      )
                                  )
                              ),

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })

                  return resultado

              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )

                  return []


          # =========================================================
          # BUSCAR PÁGINA
          # =========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "================================"
              )
              print(
                  "PÁGINA:",
                  fonte["nome"]
              )
              print(
                  "================================"
              )

              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=25
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  resultado = []
                  links_vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )

                      if not titulo:
                          continue

                      if len(titulo) < 25:
                          continue

                      if len(titulo) > 180:
                          continue


                      link = urljoin(
                          fonte["url"],
                          href
                      )

                      link = link.split("#")[0]


                      if link in links_vistos:
                          continue

                      links_vistos.add(link)


                      # -------------------------------------------------
                      # DOMÍNIO
                      # -------------------------------------------------

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in link:
                              continue

                      if fonte["nome"] == "G1":

                          if "g1.globo.com" not in link:
                              continue


                      # -------------------------------------------------
                      # BLOQUEIOS
                      # -------------------------------------------------

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      caminho = link.lower()


                      bloqueios = [
                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo"
                      ]


                      if any(
                          item in caminho
                          for item in bloqueios
                      ):
                          continue


                      # -------------------------------------------------
                      # SOMENTE MATÉRIAS
                      # -------------------------------------------------

                      if fonte["nome"] == "G1":

                          if "/noticia/" not in caminho:
                              continue


                      if fonte["nome"] == "O Liberal":

                          secoes = [
                              "/policia/",
                              "/para/",
                              "/belem/",
                              "/amazonia/",
                              "/politica/",
                              "/economia/",
                              "/esportes/",
                              "/entretenimento/",
                              "/mundo/",
                              "/brasil/",
                              "/tecnologia/",
                              "/cultura/",
                              "/saude/",
                              "/concursos/"
                          ]

                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):
                              continue


                      # -------------------------------------------------
                      # IMAGEM
                      # -------------------------------------------------

                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      if not imagem:

                          imagem = extrair_imagem(
                              link
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          fonte["nome"],
                          "->",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      # -------------------------------------------------
                      # LIMITE POR FONTE
                      # -------------------------------------------------

                      if len(resultado) >= 5:
                          break


                  return resultado

              except Exception as erro:

                  print(
                      "Erro página:",
                      erro
                  )

                  return []


          # =========================================================
          # BUSCAR TODAS AS FONTES
          # =========================================================

          noticias_por_fonte = {}


          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_por_fonte[
                      fonte["nome"]
                  ] = buscar_rss(
                      fonte
                  )

              else:

                  noticias_por_fonte[
                      fonte["nome"]
                  ] = buscar_pagina(
                      fonte
                  )


          # =========================================================
          # MONTAR LISTA BALANCEADA
          # =========================================================

          novas = []

          indices = {
              fonte["nome"]: 0
              for fonte in FONTES
          }


          while len(novas) < LIMITE_TOTAL:

              adicionou = False

              for fonte in FONTES:

                  nome = fonte["nome"]

                  lista = noticias_por_fonte.get(
                      nome,
                      []
                  )

                  indice = indices[nome]


                  if indice >= len(lista):
                      continue


                  noticia = lista[indice]

                  indices[nome] += 1

                  novas.append(noticia)

                  adicionou = True


                  if len(novas) >= LIMITE_TOTAL:
                      break


              if not adicionou:
                  break


          print("")
          print(
              "================================"
          )
          print(
              "NOTÍCIAS SELECIONADAS:",
              len(novas)
          )
          print(
              "================================"
          )


          # =========================================================
          # COMBINAR COM AS ANTIGAS
          # =========================================================

          todas = novas + antigas

          unicas = {}


          for noticia in todas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )

              chave = link or titulo

              if not chave:
                  continue


              if chave not in unicas:

                  unicas[chave] = noticia

              else:

                  atual = unicas[chave]

                  imagem_atual = (
                      atual.get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )

                  imagem_nova = (
                      noticia.get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )


                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      atual["imagem"] = imagem_nova


          # =========================================================
          # GARANTIR IMAGENS ANTIGAS
          # =========================================================

          todas = list(
              unicas.values()
          )


          for noticia in todas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )

              if not noticia.get("imagem"):

                  imagem = imagens_antigas.get(
                      link,
                      ""
                  )

                  if imagem:
                      noticia["imagem"] = imagem


          # =========================================================
          # ORDENAR
          # =========================================================

          todas.sort(
              key=lambda n: n.get(
                  "data",
                  ""
              ),
              reverse=True
          )


          # =========================================================
          # PEGAR AS 8 MAIS RECENTES
          # =========================================================

          resultado = todas[:LIMITE_TOTAL]


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "================================"
          )
          print(
              "SUCESSO!"
          )
          print(
              "Total:",
              len(resultado)
          )
          print(
              "================================"
          )


          for noticia in resultado:

              print(
                  noticia.get(
                      "fonte",
                      ""
                  ),
                  "|",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "IMAGEM:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )

          PY


      # =========================================================
      # SALVAR NO GITHUB
      # =========================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar noticias"
            git push
          fi
