name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR O REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos
        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu"

          ]


          # =====================================================
          # BELÉM E REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua",
              "braganca do para"

          ]


          # =====================================================
          # TERMOS QUE IDENTIFICAM O ESTADO DO PARÁ
          # =====================================================

          PARA = [

              "para",
              "paraense",
              "paraenses",
              "estado do para",
              "governo do para",
              "policia do para",
              "ministerio publico do para",
              "tribunal de justica do para",
              "assembleia legislativa do para",
              "governador do para",
              "governadora do para"

          ]


          # =====================================================
          # OUTROS ESTADOS / REGIÕES
          #
          # Usados para evitar que notícias de outros lugares
          # sejam classificadas erroneamente como PARÁ.
          # =====================================================

          OUTRAS_REGIOES = [

              "bahia",
              "salvador",

              "sao paulo",

              "rio de janeiro",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceara",
              "fortaleza",

              "parana",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasilia",
              "distrito federal",

              "goias",
              "goiania",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondonia",
              "porto velho",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "vitoria",

              "santa catarina",
              "florianopolis",

              "maranhao",
              "sao luis",

              "piaui",
              "teresina",

              "paraiba",
              "joao pessoa",

              "rio grande do norte",
              "natal",

              "alagoas",
              "maceio",

              "sergipe",
              "aracaju",

              "tocantins",
              "palmas",

              "amapa",
              "macapa"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto)

              texto = texto.lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caractere
                  for caractere in texto
                  if unicodedata.category(caractere) != "Mn"
              )

              texto = texto.replace("-", " ")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # VERIFICAR TERMO
          #
          # Usa palavras inteiras para evitar problemas como:
          #
          # PARÁ
          # PARANÁ
          #
          # "para" NÃO será encontrado dentro de "parana".
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:
                  return False

              padrao = r"(?<![a-z0-9])" + re.escape(termo) + r"(?![a-z0-9])"

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO COMPLETO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # VERIFICAR SE NOTÍCIA ESTÁ BLOQUEADA
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = " ".join([

                  titulo,
                  descricao,
                  fonte

              ])


              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):
                      return True


              if "mixvale.com.br" in link:

                  return True


              return False


          # =====================================================
          # NOTÍCIA VÁLIDA
          # =====================================================

          def valido(item):

              if not item:

                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:

                  return False


              if not link:

                  return False


              if bloqueada(item):

                  return False


              return True


          # =====================================================
          # BUSCAR NOTÍCIAS NA NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta

              }


              url = (

                  API_URL
                  + "?"
                  + urllib.parse.urlencode(parametros)

              )


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/1.0"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      dados = json.loads(

                          resposta
                          .read()
                          .decode("utf-8")

                      )


                  return dados.get(
                      "results",
                      []
                  )


              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      erro
                  )

                  return []


          # =====================================================
          # CONVERTER NOTÍCIA PARA O JSON
          # =====================================================

          def converter(item, categoria):

              return {

                  "id":
                      item.get("article_id"),

                  "titulo":
                      item.get("title"),

                  "descricao":
                      item.get("description"),

                  "link":
                      item.get("link"),

                  "fonte":
                      item.get("source_name"),

                  "imagem":
                      item.get("image_url"),

                  "data":
                      item.get("pubDate"),

                  "categoria":
                      categoria

              }


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          def pertence_ao_grupo(item, termos):

              texto = texto_noticia(item)


              for termo in termos:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR SE É OUTRA REGIÃO
          # =====================================================

          def pertence_outra_regiao(item):

              texto = texto_noticia(item)


              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR SE REALMENTE É DO PARÁ
          # =====================================================

          def eh_para(item):

              texto = texto_noticia(item)


              # Primeiro verifica outros estados.
              #
              # Isso impede, por exemplo, que uma notícia
              # nacional citando "Paraná" seja confundida
              # com "Pará".
              # =================================================

              if pertence_outra_regiao(item):

                  # Porém, se houver uma referência explícita
                  # ao Pará, permitimos a notícia.
                  #
                  # Exemplo:
                  #
                  # "Pará e Paraná anunciam..."
                  #
                  # Nesse caso existe referência real ao Pará.
                  # =================================================

                  if not pertence_ao_grupo(
                      item,
                      PARA
                  ):

                      return False


              return pertence_ao_grupo(
                  item,
                  PARA
              )


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              '"Tomé-Açu"',


              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',


              # -----------------------------------------------
              # NORDESTE DO PARÁ
              # -----------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',


              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              '"Pará"',
              '"governo do Pará"',
              '"polícia do Pará"',
              '"Estado do Pará"',


              # -----------------------------------------------
              # BRASIL
              # -----------------------------------------------

              '"Brasil"'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print(
                  "================================"
              )

              print(
                  "BUSCANDO:",
                  consulta
              )

              print(
                  "================================"
              )


              resultados = buscar(
                  consulta
              )


              print(
                  "RESULTADOS:",
                  len(resultados)
              )


              for item in resultados:

                  if not valido(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:

                      continue


                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAR
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          for item in candidatos.values():


              # -----------------------------------------------
              # 1. TOMÉ-AÇU
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

                  continue


              # -----------------------------------------------
              # 2. BELÉM / RMB
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

                  continue


              # -----------------------------------------------
              # 3. NORDESTE DO PARÁ
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

                  continue


              # -----------------------------------------------
              # 4. PARÁ
              # -----------------------------------------------

              if eh_para(item):

                  para.append(item)

                  continue


              # -----------------------------------------------
              # 5. BRASIL
              # -----------------------------------------------

              brasil.append(item)


          # =====================================================
          # MOSTRAR CLASSIFICAÇÃO
          # =====================================================

          print("")
          print(
              "================================"
          )

          print(
              "CLASSIFICAÇÃO"
          )

          print(
              "================================"
          )

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste do Pará:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )


              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )


              return titulo.strip()


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= 8:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:

                  return False


              if not titulo:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticia = converter(

                  item,

                  categoria

              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          #
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          #
          # BELÉM / RMB
          #
          # MÁXIMO DE 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= 8:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1


              if contador_belem >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          #
          # NORDESTE DO PARÁ
          #
          # MÁXIMO DE 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= 8:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1


              if contador_nordeste >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          #
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= 8:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          #
          # BRASIL
          #
          # COMPLETA ATÉ 8
          # =====================================================

          for item in brasil:

              if len(noticias) >= 8:

                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:8]

          }


          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO FINAL
          # =====================================================

          print("")
          print(
              "================================"
          )

          print(
              "TOTAL FINAL:",
              len(noticias[:8])
          )

          print(
              "================================"
          )


          print("")


          for numero, noticia in enumerate(
              noticias[:8],
              start=1
          ):

              print(

                  f"{numero}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"

              )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"


          git add noticias.json


          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"


          git push
