name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > buscar.py <<'PY'
          import json
          import os
          import re
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          ARQUIVO = "noticias.json"
          LIMITE = 8


          FONTES = [
              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },
              {
                  "nome": "O Liberal",
                  "tipo": "rss",
                  "url": "https://www.oliberal.com/rss"
              },
              {
                  "nome": "G1",
                  "tipo": "rss",
                  "url": "https://g1.globo.com/rss/g1/pa/para/"
              }
          ]


          sessao = requests.Session()

          sessao.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8"
              ),
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Cache-Control": "no-cache"
          })


          def limpar(texto):
              if not texto:
                  return ""

              soup = BeautifulSoup(texto, "html.parser")
              texto = soup.get_text(" ", strip=True)
              texto = re.sub(r"\s+", " ", texto)

              return texto.strip()


          def criar_id(titulo, link):
              base = titulo.strip() + "|" + link.strip()
              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          def bloqueada(titulo, link):
              texto = (
                  (titulo or "") + " " + (link or "")
              ).lower()

              return (
                  "mixvale" in texto
                  or "mix vale" in texto
                  or "mixvale.com.br" in texto
              )


          def normalizar_imagem(url, pagina):
              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              return urljoin(pagina, url)


          def imagem_jsonld(soup, pagina):
              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:
                  try:
                      texto = script.string

                      if not texto:
                          continue

                      dados = json.loads(texto)

                      objetos = []

                      if isinstance(dados, list):
                          objetos.extend(dados)

                      elif isinstance(dados, dict):
                          objetos.append(dados)

                          graph = dados.get("@graph")

                          if isinstance(graph, list):
                              objetos.extend(graph)

                      for obj in objetos:
                          if not isinstance(obj, dict):
                              continue

                          imagem = obj.get("image")

                          if isinstance(imagem, str):
                              url = normalizar_imagem(
                                  imagem,
                                  pagina
                              )

                              if url:
                                  return url

                          if isinstance(imagem, dict):
                              url = (
                                  imagem.get("url")
                                  or imagem.get("contentUrl")
                                  or ""
                              )

                              url = normalizar_imagem(
                                  url,
                                  pagina
                              )

                              if url:
                                  return url

                          if isinstance(imagem, list):
                              for item in imagem:
                                  if isinstance(item, str):
                                      url = normalizar_imagem(
                                          item,
                                          pagina
                                      )

                                      if url:
                                          return url

                                  if isinstance(item, dict):
                                      url = (
                                          item.get("url")
                                          or item.get("contentUrl")
                                          or ""
                                      )

                                      url = normalizar_imagem(
                                          url,
                                          pagina
                                      )

                                      if url:
                                          return url

                  except Exception:
                      continue

              return ""


          def extrair_imagem(link):
              print("Buscando imagem:", link)

              try:
                  resposta = sessao.get(
                      link,
                      timeout=20,
                      allow_redirects=True
                  )

                  print(
                      "HTTP imagem:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  # 1. Open Graph
                  seletores = [
                      ("property", "og:image"),
                      ("property", "og:image:url"),
                      ("name", "twitter:image"),
                      ("name", "twitter:image:src")
                  ]

                  for atributo, valor in seletores:
                      meta = soup.find(
                          "meta",
                          attrs={atributo: valor}
                      )

                      if meta:
                          imagem = meta.get("content", "")

                          imagem = normalizar_imagem(
                              imagem,
                              resposta.url
                          )

                          if imagem:
                              print(
                                  "Imagem OG:",
                                  imagem
                              )
                              return imagem

                  # 2. JSON-LD
                  imagem = imagem_jsonld(
                      soup,
                      resposta.url
                  )

                  if imagem:
                      print(
                          "Imagem JSON-LD:",
                          imagem
                      )
                      return imagem

                  # 3. Imagem principal do artigo
                  candidatos = []

                  for seletor in [
                      "article img",
                      "main img",
                      "figure img"
                  ]:
                      candidatos.extend(
                          soup.select(seletor)
                      )

                  for img in candidatos:
                      imagem = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-lazy-src")
                          or img.get("data-original")
                          or img.get("srcset")
                          or ""
                      )

                      if "," in imagem:
                          imagem = imagem.split(",")[0].strip()

                      if " " in imagem:
                          partes = imagem.split()

                          if len(partes) > 1:
                              imagem = partes[0]

                      imagem = normalizar_imagem(
                          imagem,
                          resposta.url
                      )

                      if imagem:
                          print(
                              "Imagem HTML:",
                              imagem
                          )
                          return imagem

              except Exception as erro:
                  print(
                      "Erro imagem:",
                      erro
                  )

              return ""


          def imagem_rss(item):
              try:
                  for media in item.get(
                      "media_content",
                      []
                  ):
                      url = media.get("url")

                      if url:
                          return normalizar_imagem(
                              url,
                              item.get("link", "")
                          )
              except Exception:
                  pass

              try:
                  for media in item.get(
                      "media_thumbnail",
                      []
                  ):
                      url = media.get("url")

                      if url:
                          return normalizar_imagem(
                              url,
                              item.get("link", "")
                          )
              except Exception:
                  pass

              try:
                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):
                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                          or ""
                      )

                      if url:
                          return normalizar_imagem(
                              url,
                              item.get("link", "")
                          )
              except Exception:
                  pass

              try:
                  html = (
                      item.get("summary", "")
                      or item.get("description", "")
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find("img")

                  if img:
                      url = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-lazy-src")
                          or ""
                      )

                      if url:
                          return normalizar_imagem(
                              url,
                              item.get("link", "")
                          )

              except Exception:
                  pass

              return ""


          def data_rss(item):
              try:
                  if item.get("published_parsed"):
                      import time

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.published_parsed
                          ),
                          timezone.utc
                      ).isoformat()
              except Exception:
                  pass

              try:
                  if item.get("updated_parsed"):
                      import time

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.updated_parsed
                          ),
                          timezone.utc
                      ).isoformat()
              except Exception:
                  pass

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # =========================================================
          # CARREGAR JSON EXISTENTE
          # =========================================================

          antigas = []

          if os.path.exists(ARQUIVO):
              try:
                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:
                      dados = json.load(arquivo)

                  antigas = dados.get(
                      "noticias",
                      []
                  )

                  if not isinstance(antigas, list):
                      antigas = []

              except Exception as erro:
                  print(
                      "Erro ao ler noticias.json:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # =========================================================
          # MAPA DE IMAGENS ANTIGAS
          # =========================================================

          imagens_antigas = {}

          for noticia in antigas:
              link = str(
                  noticia.get("link", "")
              ).strip()

              imagem = str(
                  noticia.get("imagem", "")
              ).strip()

              if link and imagem:
                  imagens_antigas[link] = imagem


          novas = []


          # =========================================================
          # BUSCAR RSS
          # =========================================================

          for fonte in FONTES:

              print("")
              print(
                  "========================================"
              )
              print(
                  "FONTE:",
                  fonte["nome"]
              )
              print(
                  "========================================"
              )

              try:
                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      print(
                          "RSS indisponível."
                      )
                      continue

                  feed = feedparser.parse(
                      resposta.content
                  )

                  print(
                      "Itens RSS:",
                      len(feed.entries)
                  )

                  contador = 0

                  for item in feed.entries[:15]:

                      titulo = limpar(
                          item.get("title", "")
                      )

                      link = str(
                          item.get("link", "")
                      ).strip()

                      if not titulo or not link:
                          continue

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue

                      imagem = imagem_rss(item)

                      if not imagem:
                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )

                      if not imagem:
                          imagem = extrair_imagem(
                              link
                          )

                      noticia = {
                          "id": criar_id(
                              titulo,
                              link
                          ),
                          "titulo": titulo,
                          "descricao": limpar(
                              item.get(
                                  "summary",
                                  item.get(
                                      "description",
                                      ""
                                  )
                              )
                          ),
                          "link": link,
                          "fonte": fonte["nome"],
                          "imagem": imagem,
                          "data": data_rss(item),
                          "categoria": "PARÁ"
                      }

                      novas.append(noticia)

                      contador += 1

                      print(
                          "ADICIONADA:",
                          titulo
                      )

                      print(
                          "IMAGEM:",
                          imagem
                      )

                      if contador >= 8:
                          break

              except Exception as erro:
                  print(
                      "Erro na fonte:",
                      fonte["nome"],
                      erro
                  )


          # =========================================================
          # COMBINAR NOVAS + ANTIGAS
          # =========================================================

          todas = novas + antigas


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}

          for noticia in todas:

              link = str(
                  noticia.get("link", "")
              ).strip()

              titulo = str(
                  noticia.get("titulo", "")
              ).strip()

              chave = link or titulo

              if not chave:
                  continue

              imagem = str(
                  noticia.get("imagem", "")
              ).strip()

              if chave not in unicas:
                  unicas[chave] = noticia

              else:
                  imagem_existente = str(
                      unicas[chave].get(
                          "imagem",
                          ""
                      )
                  ).strip()

                  if (
                      not imagem_existente
                      and imagem
                  ):
                      unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # =========================================================
          # RECUPERAR IMAGENS QUE ESTÃO VAZIAS
          # =========================================================

          for noticia in todas:

              link = str(
                  noticia.get("link", "")
              ).strip()

              imagem = str(
                  noticia.get("imagem", "")
              ).strip()

              if not imagem and link:

                  imagem = imagens_antigas.get(
                      link,
                      ""
                  )

                  if imagem:
                      noticia["imagem"] = imagem


          # =========================================================
          # FILTRAR MIX VALE
          # =========================================================

          todas = [
              noticia
              for noticia in todas
              if not bloqueada(
                  noticia.get("titulo", ""),
                  noticia.get("link", "")
              )
          ]


          # =========================================================
          # ORDENAR
          # =========================================================

          def chave_data(noticia):
              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=chave_data,
              reverse=True
          )


          # =========================================================
          # PEGAR 8
          # =========================================================

          resultado = todas[:LIMITE]


          # =========================================================
          # GARANTIR CAMPOS
          # =========================================================

          for noticia in resultado:

              noticia["titulo"] = str(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).strip()

              noticia["link"] = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              noticia["fonte"] = str(
                  noticia.get(
                      "fonte",
                      ""
                  )
              ).strip()

              noticia["imagem"] = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()

              noticia["categoria"] = "PARÁ"


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {
              "atualizado": datetime.now(
                  timezone.utc
              ).isoformat(),
              "noticias": resultado
          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "========================================"
          )
          print(
              "CONCLUÍDO"
          )
          print(
              "Notícias gravadas:",
              len(resultado)
          )
          print(
              "========================================"
          )

          for noticia in resultado:
              print(
                  noticia["fonte"],
                  "|",
                  noticia["titulo"]
              )
              print(
                  "IMAGEM:",
                  noticia["imagem"]
              )
          PY

          python3 buscar.py

      - name: Salvar notícias no GitHub
        run: |
          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar noticias"

          git push
