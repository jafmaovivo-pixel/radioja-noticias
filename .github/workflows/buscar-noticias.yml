name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar notícias do Pará
        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import hashlib
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape


          ARQUIVO = "noticias.json"
          LIMITE = 8


          FEEDS = [
              (
                  "G1 - O Portal",
                  "https://g1.globo.com/dynamo/pa/para/rss2.xml"
              ),
              (
                  "Diário do Pará",
                  "https://diariodopara.com.br/feed/"
              )
          ]


          def limpar_html(texto):

              if not texto:
                  return ""

              texto = unescape(texto)

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def baixar(url):

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Radio-JA-FM/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as resposta:

                  return resposta.read()


          def texto(elemento):

              if elemento is None:
                  return ""

              return "".join(
                  elemento.itertext()
              ).strip()


          noticias = []

          links = set()

          titulos = set()


          print("")
          print("===================================")
          print("BUSCANDO NOTÍCIAS")
          print("===================================")


          for fonte, url in FEEDS:

              print("")
              print("Fonte:", fonte)
              print("URL:", url)

              try:

                  xml = baixar(url)

                  raiz = ET.fromstring(xml)

                  itens = raiz.findall(
                      ".//item"
                  )

                  print(
                      "Itens encontrados:",
                      len(itens)
                  )


                  for item in itens:

                      titulo = texto(
                          item.find("title")
                      )

                      link = texto(
                          item.find("link")
                      )

                      descricao = texto(
                          item.find("description")
                      )

                      data = texto(
                          item.find("pubDate")
                      )


                      if not titulo or not link:
                          continue


                      titulo_chave = (
                          titulo
                          .lower()
                          .strip()
                      )


                      # -----------------------------
                      # DUPLICADOS
                      # -----------------------------

                      if link in links:
                          continue

                      if titulo_chave in titulos:
                          continue


                      # -----------------------------
                      # BLOQUEAR MIX VALE
                      # -----------------------------

                      texto_busca = (
                          titulo
                          + " "
                          + link
                          + " "
                          + fonte
                      ).lower()


                      if (
                          "mix vale" in texto_busca
                          or
                          "mixvale" in texto_busca
                      ):

                          print(
                              "Ignorada Mix Vale:",
                              titulo
                          )

                          continue


                      links.add(link)

                      titulos.add(
                          titulo_chave
                      )


                      identificador = hashlib.md5(
                          link.encode(
                              "utf-8"
                          )
                      ).hexdigest()


                      noticias.append({

                          "id": identificador,

                          "titulo": titulo,

                          "descricao":
                              limpar_html(
                                  descricao
                              ),

                          "link": link,

                          "fonte": fonte,

                          "imagem": None,

                          "data": data,

                          "categoria": "PARÁ"

                      })


          # ---------------------------------------
          # ORDENAR POR DATA ORIGINAL QUANDO POSSÍVEL
          # ---------------------------------------

          noticias = noticias[:LIMITE]


          print("")
          print("===================================")
          print(
              "TOTAL ENCONTRADO:",
              len(noticias)
          )
          print("===================================")


          # ---------------------------------------
          # LER JSON ANTIGO
          # ---------------------------------------

          antigas = []

          if os.path.exists(ARQUIVO):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

              except Exception:

                  antigas = []


          # ---------------------------------------
          # SE NÃO ENCONTROU NADA,
          # PRESERVA O JSON EXISTENTE
          # ---------------------------------------

          if not noticias:

              if antigas:

                  print(
                      "Nenhuma notícia nova."
                  )

                  print(
                      "Mantendo JSON existente."
                  )

                  raise SystemExit(0)

              else:

                  raise SystemExit(
                      "Nenhuma notícia encontrada."
                  )


          # ---------------------------------------
          # COMPLETAR COM NOTÍCIAS ANTIGAS
          # ---------------------------------------

          links_finais = {
              n.get("link")
              for n in noticias
              if n.get("link")
          }


          for antiga in antigas:

              if len(noticias) >= LIMITE:
                  break


              link = antiga.get(
                  "link"
              )


              if not link:
                  continue


              if link in links_finais:
                  continue


              noticias.append(
                  antiga
              )

              links_finais.add(
                  link
              )


          noticias = noticias[:LIMITE]


          # ---------------------------------------
          # GERAR JSON
          # ---------------------------------------

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("===================================")
          print(
              "NOTÍCIAS SALVAS:",
              len(noticias)
          )
          print("===================================")


          for i, noticia in enumerate(
              noticias,
              1
          ):

              print(
                  f"{i}. "
                  f"{noticia['titulo']}"
              )


          PY


      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio J.A FM"

          git config user.email \
            "actions@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit \
              -m "Atualizar notícias"

            git push

          fi
