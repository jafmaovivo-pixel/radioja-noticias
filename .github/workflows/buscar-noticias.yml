name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v6

      # ============================================================
      # CONFIGURAR PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # INSTALAR DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          import requests
          import feedparser
          from bs4 import BeautifulSoup


          # ============================================================
          # CONFIGURAÇÕES
          # ============================================================

          ARQUIVO = "noticias.json"

          LIMITE = 8

          MAX_POR_FONTE = 8


          # ============================================================
          # FONTES
          #
          # Preferimos RSS sempre que possível porque é muito mais
          # estável que raspar páginas inteiras.
          # ============================================================

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "G1 - O Portal",
                  "tipo": "rss",
                  "url": "https://g1.globo.com/dynamo/pa/para/rss2.xml"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/ultimas-noticias"
              }

          ]


          # ============================================================
          # SESSÃO HTTP
          # ============================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
                  "Radio-JA-FM-NewsBot/1.0 "
                  "(+https://github.com/jafmaovivo-pixel/radioja-noticias)",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,"
                  "application/rss+xml;q=0.9,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8"

          })


          # ============================================================
          # FUNÇÕES AUXILIARES
          # ============================================================

          def limpar(texto):

              if not texto:
                  return ""

              try:

                  soup = BeautifulSoup(
                      str(texto),
                      "html.parser"
                  )

                  texto = soup.get_text(
                      " ",
                      strip=True
                  )

              except Exception:

                  texto = str(texto)

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras_bloqueadas = [

                  "mixvale",
                  "mix vale",
                  "mixvale.com.br"

              ]

              for palavra in palavras_bloqueadas:

                  if palavra in texto:
                      return True

              return False


          def normalizar_link(link, base):

              if not link:
                  return ""

              link = link.strip()

              return urljoin(
                  base,
                  link
              )


          def imagem_do_item(item):

              # --------------------------------------------------------
              # media_content
              # --------------------------------------------------------

              try:

                  media = item.get(
                      "media_content",
                      []
                  )

                  for item_media in media:

                      url = item_media.get(
                          "url",
                          ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              # --------------------------------------------------------
              # media_thumbnail
              # --------------------------------------------------------

              try:

                  media = item.get(
                      "media_thumbnail",
                      []
                  )

                  for item_media in media:

                      url = item_media.get(
                          "url",
                          ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              # --------------------------------------------------------
              # enclosure
              # --------------------------------------------------------

              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                          or ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              # --------------------------------------------------------
              # imagem dentro da descrição
              # --------------------------------------------------------

              try:

                  html = (
                      item.get("summary", "")
                      or item.get("description", "")
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find("img")

                  if img:

                      return (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-lazy-src")
                          or ""
                      )

              except Exception:
                  pass


              return ""


          def data_item(item):

              # --------------------------------------------------------
              # published_parsed
              # --------------------------------------------------------

              try:

                  if item.get(
                      "published_parsed"
                  ):

                      tm = item.get(
                          "published_parsed"
                      )

                      dt = datetime.fromtimestamp(
                          time.mktime(tm),
                          timezone.utc
                      )

                      return dt.isoformat()

              except Exception:
                  pass


              # --------------------------------------------------------
              # updated_parsed
              # --------------------------------------------------------

              try:

                  if item.get(
                      "updated_parsed"
                  ):

                      tm = item.get(
                          "updated_parsed"
                      )

                      dt = datetime.fromtimestamp(
                          time.mktime(tm),
                          timezone.utc
                      )

                      return dt.isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # REQUISIÇÃO COM PROTEÇÃO CONTRA 429
          # ============================================================

          def requisicao(url, timeout=30):

              tentativas = 3

              for tentativa in range(
                  1,
                  tentativas + 1
              ):

                  try:

                      print("")
                      print(
                          f"Requisição {tentativa}/{tentativas}: {url}"
                      )

                      resposta = sessao.get(
                          url,
                          timeout=timeout
                      )

                      print(
                          "HTTP:",
                          resposta.status_code
                      )


                      # ------------------------------------------------
                      # SUCESSO
                      # ------------------------------------------------

                      if resposta.status_code == 200:

                          return resposta


                      # ------------------------------------------------
                      # RATE LIMIT
                      # ------------------------------------------------

                      if resposta.status_code == 429:

                          retry_after = (
                              resposta.headers.get(
                                  "Retry-After"
                              )
                          )

                          if retry_after:

                              try:

                                  espera = int(
                                      retry_after
                                  )

                              except Exception:

                                  espera = 60

                          else:

                              espera = 60 * tentativa


                          # Nunca ficar esperando uma eternidade

                          espera = min(
                              espera,
                              120
                          )

                          print(
                              f"HTTP 429. "
                              f"Aguardando {espera} segundos..."
                          )

                          if tentativa < tentativas:

                              time.sleep(
                                  espera
                              )

                              continue

                          print(
                              "Fonte continua bloqueando."
                          )

                          return None


                      # ------------------------------------------------
                      # OUTROS ERROS HTTP
                      # ------------------------------------------------

                      print(
                          "Fonte respondeu com:",
                          resposta.status_code
                      )

                      return None


                  except requests.RequestException as erro:

                      print(
                          "Erro HTTP:",
                          erro
                      )

                      if tentativa < tentativas:

                          espera = 10 * tentativa

                          print(
                              f"Tentando novamente em "
                              f"{espera} segundos..."
                          )

                          time.sleep(
                              espera
                          )

                      else:

                          return None


              return None


          # ============================================================
          # LER NOTÍCIAS EXISTENTES
          # ============================================================

          antigas = []


          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []


              except Exception as erro:

                  print(
                      "Aviso ao ler noticias.json:",
                      erro
                  )

                  antigas = []


          print("")
          print(
              "Notícias existentes:",
              len(antigas)
          )


          # ============================================================
          # REMOVER NOTÍCIAS BLOQUEADAS DO JSON ANTIGO
          # ============================================================

          antigas_filtradas = []


          for noticia in antigas:

              titulo = noticia.get(
                  "titulo",
                  ""
              )

              link = noticia.get(
                  "link",
                  ""
              )

              if bloqueada(
                  titulo,
                  link
              ):
                  continue

              antigas_filtradas.append(
                  noticia
              )


          antigas = antigas_filtradas


          # ============================================================
          # BUSCAR RSS
          # ============================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "=========================================="
              )

              print(
                  "Consultando RSS:",
                  fonte["nome"]
              )

              print(
                  "=========================================="
              )


              resposta = requisicao(
                  fonte["url"],
                  timeout=30
              )


              if resposta is None:

                  print(
                      "RSS indisponível:",
                      fonte["nome"]
                  )

                  return []


              try:

                  feed = feedparser.parse(
                      resposta.content
                  )

              except Exception as erro:

                  print(
                      "Erro ao interpretar RSS:",
                      erro
                  )

                  return []


              resultado = []


              for item in feed.entries[
                  :MAX_POR_FONTE
              ]:

                  titulo = limpar(
                      item.get(
                          "title",
                          ""
                      )
                  )

                  link = normalizar_link(
                      item.get(
                          "link",
                          ""
                      ),
                      fonte["url"]
                  )


                  if not titulo:
                      continue

                  if not link:
                      continue


                  if bloqueada(
                      titulo,
                      link
                  ):
                      continue


                  descricao = limpar(
                      item.get(
                          "summary",
                          item.get(
                              "description",
                              ""
                          )
                      )
                  )


                  imagem = imagem_do_item(
                      item
                  )


                  data = data_item(
                      item
                  )


                  resultado.append({

                      "id":
                          criar_id(
                              titulo,
                              link
                          ),

                      "titulo":
                          titulo,

                      "descricao":
                          descricao,

                      "link":
                          link,

                      "fonte":
                          fonte["nome"],

                      "imagem":
                          imagem,

                      "data":
                          data,

                      "categoria":
                          "PARÁ"

                  })


              print(
                  "Notícias encontradas:",
                  len(resultado)
              )


              return resultado


          # ============================================================
          # BUSCAR O LIBERAL
          # ============================================================

          def buscar_o_liberal(fonte):

              print("")
              print(
                  "=========================================="
              )

              print(
                  "Consultando:",
                  fonte["nome"]
              )

              print(
                  "=========================================="
              )


              resposta = requisicao(
                  fonte["url"],
                  timeout=30
              )


              if resposta is None:

                  print(
                      "O Liberal indisponível."
                  )

                  return []


              try:

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

              except Exception as erro:

                  print(
                      "Erro ao interpretar O Liberal:",
                      erro
                  )

                  return []


              resultado = []

              vistos = set()


              # --------------------------------------------------------
              # Procurar links de matérias
              # --------------------------------------------------------

              for a in soup.find_all(
                  "a",
                  href=True
              ):

                  titulo = limpar(
                      a.get_text(
                          " ",
                          strip=True
                      )
                  )


                  href = a.get(
                      "href",
                      ""
                  )


                  if not titulo:
                      continue


                  if len(titulo) < 25:
                      continue


                  if len(titulo) > 180:
                      continue


                  link = normalizar_link(
                      href,
                      fonte["url"]
                  )


                  if not link:
                      continue


                  if "oliberal.com" not in link:
                      continue


                  if bloqueada(
                      titulo,
                      link
                  ):
                      continue


                  # ----------------------------------------------------
                  # Ignorar páginas que não são matérias
                  # ----------------------------------------------------

                  bloqueios = [

                      "javascript:",
                      "#",
                      "/login",
                      "/newsletter",
                      "/webstories",
                      "/colunas",
                      "/videos",
                      "/podcasts",
                      "/play/",
                      "/assine",
                      "/busca"

                  ]


                  if any(
                      item in link.lower()
                      for item in bloqueios
                  ):

                      continue


                  # ----------------------------------------------------
                  # Evitar duplicadas
                  # ----------------------------------------------------

                  chave = link.lower()

                  if chave in vistos:
                      continue

                  vistos.add(
                      chave
                  )


                  # ----------------------------------------------------
                  # Procurar imagem
                  # ----------------------------------------------------

                  imagem = ""


                  try:

                      pai = a.parent

                      if pai:

                          img = pai.find(
                              "img"
                          )

                          if img:

                              imagem = (
                                  img.get("src")
                                  or img.get(
                                      "data-src"
                                  )
                                  or img.get(
                                      "data-lazy-src"
                                  )
                                  or ""
                              )

                  except Exception:

                      imagem = ""


                  # ----------------------------------------------------
                  # Tentar imagem no elemento ancestral
                  # ----------------------------------------------------

                  if not imagem:

                      try:

                          ancestral = a.find_parent(
                              ["article", "div", "li"]
                          )

                          if ancestral:

                              img = ancestral.find(
                                  "img"
                              )

                              if img:

                                  imagem = (
                                      img.get("src")
                                      or img.get(
                                          "data-src"
                                      )
                                      or img.get(
                                          "data-lazy-src"
                                      )
                                      or ""
                                  )

                      except Exception:

                          pass


                  # ----------------------------------------------------
                  # Data
                  #
                  # Como o HTML do portal nem sempre expõe a data
                  # de forma consistente, usamos a hora da coleta.
                  # ----------------------------------------------------

                  data = datetime.now(
                      timezone.utc
                  ).isoformat()


                  resultado.append({

                      "id":
                          criar_id(
                              titulo,
                              link
                          ),

                      "titulo":
                          titulo,

                      "descricao":
                          titulo,

                      "link":
                          link,

                      "fonte":
                          "O Liberal",

                      "imagem":
                          imagem,

                      "data":
                          data,

                      "categoria":
                          "PARÁ"

                  })


                  if len(resultado) >= MAX_POR_FONTE:
                      break


              print(
                  "Notícias encontradas:",
                  len(resultado)
              )


              return resultado


          # ============================================================
          # EXECUTAR TODAS AS FONTES
          # ============================================================

          novas = []


          for fonte in FONTES:

              try:

                  if fonte["tipo"] == "rss":

                      noticias_fonte = buscar_rss(
                          fonte
                      )

                  else:

                      noticias_fonte = buscar_o_liberal(
                          fonte
                      )


                  novas.extend(
                      noticias_fonte
                  )


              except Exception as erro:

                  print(
                      "Erro na fonte",
                      fonte["nome"],
                      ":",
                      erro
                  )


          print("")
          print(
              "=========================================="
          )

          print(
              "TOTAL DE NOTÍCIAS NOVAS:",
              len(novas)
          )

          print(
              "=========================================="
          )


          # ============================================================
          # COMBINAR NOVAS + ANTIGAS
          # ============================================================

          todas = (
              novas
              + antigas
          )


          # ============================================================
          # REMOVER DUPLICADAS
          # ============================================================

          unicas = {}


          for noticia in todas:

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
                  .lower()
              )


              chave = (
                  link
                  or titulo
              )


              if not chave:
                  continue


              if chave not in unicas:

                  unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # ============================================================
          # ORDENAR POR DATA
          # ============================================================

          def data_ordenacao(noticia):

              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=data_ordenacao,
              reverse=True
          )


          # ============================================================
          # MANTER SOMENTE 8
          # ============================================================

          resultado = todas[
              :LIMITE
          ]


          # ============================================================
          # PROTEÇÃO
          #
          # Se nenhuma fonte funcionar, NÃO APAGA o noticias.json.
          # ============================================================

          if len(novas) == 0:

              print("")
              print(
                  "=========================================="
              )

              print(
                  "NENHUMA FONTE ENTREGOU NOTÍCIAS NOVAS."
              )

              print(
                  "O noticias.json atual será preservado."
              )

              print(
                  "=========================================="
              )

              raise SystemExit(0)


          # ============================================================
          # SALVAR JSON
          # ============================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESULTADO
          # ============================================================

          print("")
          print(
              "=========================================="
          )

          print(
              "SUCESSO!"
          )

          print(
              "Notícias novas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print(
              "=========================================="
          )


          for indice, noticia in enumerate(
              resultado,
              start=1
          ):

              print(
                  f"{indice}. "
                  f"{noticia.get('titulo', '')} "
                  f"— "
                  f"{noticia.get('fonte', '')}"
              )


          PY


      # ============================================================
      # SALVAR NO GITHUB
      # ============================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email \
            "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit \
              -m "Atualizar notícias"

            git push

          fi
