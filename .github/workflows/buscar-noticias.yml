name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar repositório
        uses: actions/checkout@v5

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # ============================================================
      # BUSCAR NOTÍCIAS
      # ============================================================

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse


          # ========================================================
          # CONFIGURAÇÃO
          # ========================================================

          ARQUIVO = "noticias.json"

          LIMITE_FINAL = 8

          LIMITE_POR_FONTE = 6


          # ========================================================
          # FONTES
          # ========================================================

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },

              {
                  "nome": "G1",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              }

          ]


          # ========================================================
          # SESSÃO HTTP
          # ========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
                  "no-cache",

              "Pragma":
                  "no-cache"

          })


          # ========================================================
          # LIMPAR TEXTO
          # ========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ========================================================
          # NORMALIZAR URL
          # ========================================================

          def normalizar_url(url, pagina=""):

              if not url:
                  return ""

              url = str(url).strip()

              if not url:
                  return ""

              # Entidades HTML
              url = url.replace("&amp;", "&")

              # URL protocol-relative
              if url.startswith("//"):
                  return "https:" + url

              # URL relativa
              if pagina:
                  url = urljoin(
                      pagina,
                      url
                  )

              # HTTP -> HTTPS
              if url.startswith("http://"):
                  url = url.replace(
                      "http://",
                      "https://",
                      1
                  )

              return url


          # ========================================================
          # VERIFICAR SE É IMAGEM
          # ========================================================

          def parece_imagem(url):

              if not url:
                  return False

              texto = url.lower()

              extensoes = [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp",
                  ".gif",
                  ".avif"
              ]

              if any(
                  ext in texto
                  for ext in extensoes
              ):
                  return True

              dominios_imagem = [
                  "glbimg.com",
                  "diariodopara.com.br",
                  "uploads.",
                  "images.",
                  "image.",
                  "img.",
                  "cdn."
              ]

              if any(
                  dominio in texto
                  for dominio in dominios_imagem
              ):
                  return True

              return False


          # ========================================================
          # ID
          # ========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # ========================================================
          # BLOQUEIOS
          # ========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras = [

                  "mixvale",
                  "mix vale"

              ]

              for palavra in palavras:

                  if palavra in texto:
                      return True

              return False


          # ========================================================
          # EXTRAIR OG IMAGE
          # ========================================================

          def extrair_og_image(soup, pagina):

              metas = [

                  ("property", "og:image"),
                  ("property", "og:image:url"),
                  ("property", "og:image:secure_url"),
                  ("name", "twitter:image"),
                  ("name", "twitter:image:src")

              ]

              for atributo, valor in metas:

                  meta = soup.find(
                      "meta",
                      attrs={
                          atributo: valor
                      }
                  )

                  if meta:

                      url = (
                          meta.get("content")
                          or ""
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if url and parece_imagem(url):

                          return url

              return ""


          # ========================================================
          # EXTRAIR JSON-LD
          # ========================================================

          def procurar_imagem_objeto(obj, pagina):

              if isinstance(obj, str):

                  url = normalizar_url(
                      obj,
                      pagina
                  )

                  if url and parece_imagem(url):
                      return url

                  return ""


              if isinstance(obj, dict):

                  campos = [

                      "image",
                      "thumbnailUrl",
                      "contentUrl",
                      "url"

                  ]

                  for campo in campos:

                      valor = obj.get(
                          campo
                      )

                      if isinstance(
                          valor,
                          str
                      ):

                          url = normalizar_url(
                              valor,
                              pagina
                          )

                          if (
                              url
                              and parece_imagem(url)
                          ):
                              return url


                      elif isinstance(
                          valor,
                          dict
                      ):

                          resultado = (
                              procurar_imagem_objeto(
                                  valor,
                                  pagina
                              )
                          )

                          if resultado:
                              return resultado


                      elif isinstance(
                          valor,
                          list
                      ):

                          for item in valor:

                              resultado = (
                                  procurar_imagem_objeto(
                                      item,
                                      pagina
                                  )
                              )

                              if resultado:
                                  return resultado


                  return ""


              if isinstance(
                  obj,
                  list
              ):

                  for item in obj:

                      resultado = (
                          procurar_imagem_objeto(
                              item,
                              pagina
                          )
                      )

                      if resultado:
                          return resultado

              return ""


          def extrair_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  texto = (
                      script.string
                      or script.get_text()
                      or ""
                  )

                  texto = texto.strip()

                  if not texto:
                      continue

                  try:

                      dados = json.loads(
                          texto
                      )

                      imagem = (
                          procurar_imagem_objeto(
                              dados,
                              pagina
                          )
                      )

                      if imagem:
                          return imagem

                  except Exception:

                      # Alguns sites colocam
                      # JSON inválido ou múltiplos objetos.
                      continue

              return ""


          # ========================================================
          # EXTRAIR IMAGEM DE IMG
          # ========================================================

          def atributos_imagem(img):

              atributos = [

                  "src",
                  "data-src",
                  "data-original",
                  "data-lazy-src",
                  "data-lazy",
                  "data-image",
                  "data-url"

              ]

              for atributo in atributos:

                  valor = img.get(
                      atributo
                  )

                  if valor:

                      return valor

              # srcset
              srcset = img.get(
                  "srcset"
              )

              if srcset:

                  partes = [
                      x.strip()
                      for x in srcset.split(",")
                      if x.strip()
                  ]

                  if partes:

                      ultimo = partes[-1]

                      return ultimo.split(
                          " "
                      )[0]

              return ""


          # ========================================================
          # EXTRAIR IMAGEM DA PÁGINA
          # ========================================================

          def extrair_imagem_da_pagina(
              soup,
              pagina
          ):

              # ----------------------------------------------------
              # 1 - OG IMAGE
              # ----------------------------------------------------

              imagem = extrair_og_image(
                  soup,
                  pagina
              )

              if imagem:

                  print(
                      "  IMAGEM: og:image"
                  )

                  return imagem


              # ----------------------------------------------------
              # 2 - JSON-LD
              # ----------------------------------------------------

              imagem = extrair_jsonld(
                  soup,
                  pagina
              )

              if imagem:

                  print(
                      "  IMAGEM: JSON-LD"
                  )

                  return imagem


              # ----------------------------------------------------
              # 3 - IMAGEM DENTRO DE ARTICLE
              # ----------------------------------------------------

              article = (
                  soup.find("article")
                  or soup.find("main")
              )

              if article:

                  imagens = article.find_all(
                      "img"
                  )

                  for img in imagens:

                      url = atributos_imagem(
                          img
                      )

                      url = normalizar_url(
                          url,
                          pagina
                      )

                      if not url:
                          continue

                      # Ignorar SVG
                      if ".svg" in url.lower():
                          continue

                      # Ignorar logos óbvios
                      alt = (
                          img.get("alt")
                          or ""
                      ).lower()

                      classe = (
                          " ".join(
                              img.get(
                                  "class",
                                  []
                              )
                          )
                      ).lower()

                      texto = (
                          alt
                          + " "
                          + classe
                      )

                      if any(
                          palavra in texto
                          for palavra in [
                              "logo",
                              "avatar",
                              "icon",
                              "ícone",
                              "icone"
                          ]
                      ):
                          continue

                      if parece_imagem(url):

                          print(
                              "  IMAGEM: article img"
                          )

                          return url


              # ----------------------------------------------------
              # 4 - QUALQUER IMG VÁLIDA
              # ----------------------------------------------------

              for img in soup.find_all(
                  "img"
              ):

                  url = atributos_imagem(
                      img
                  )

                  url = normalizar_url(
                      url,
                      pagina
                  )

                  if not url:
                      continue

                  if ".svg" in url.lower():
                      continue

                  alt = (
                      img.get("alt")
                      or ""
                  ).lower()

                  classe = (
                      " ".join(
                          img.get(
                              "class",
                              []
                          )
                      )
                  ).lower()

                  texto = (
                      alt
                      + " "
                      + classe
                  )

                  if any(
                      palavra in texto
                      for palavra in [
                          "logo",
                          "avatar",
                          "icon",
                          "ícone",
                          "icone"
                      ]
                  ):
                      continue

                  if parece_imagem(url):

                      print(
                          "  IMAGEM: img"
                      )

                      return url


              return ""


          # ========================================================
          # RESOLVER LINK DA NOTÍCIA
          # ========================================================

          def resolver_noticia(link):

              if not link:
                  return "", ""


              link_original = link.strip()


              print(
                  "  Link original:",
                  link_original
              )


              try:

                  resposta = sessao.get(

                      link_original,

                      timeout=30,

                      allow_redirects=True

                  )


                  print(
                      "  HTTP:",
                      resposta.status_code
                  )

                  print(
                      "  URL final:",
                      resposta.url
                  )


                  if resposta.status_code != 200:

                      return (
                          link_original,
                          ""
                      )


                  url_final = (
                      resposta.url
                      or link_original
                  )


                  # ------------------------------------------------
                  # Se Google News redirecionou,
                  # usamos a URL final.
                  # ------------------------------------------------

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  imagem = (
                      extrair_imagem_da_pagina(
                          soup,
                          url_final
                      )
                  )


                  return (
                      url_final,
                      imagem
                  )


              except Exception as erro:

                  print(
                      "  ERRO ao resolver:",
                      erro
                  )

                  return (
                      link_original,
                      ""
                  )


          # ========================================================
          # IMAGEM DO RSS
          # ========================================================

          def imagem_do_item(item):

              # media_content
              try:

                  media = item.get(
                      "media_content",
                      []
                  )

                  for elemento in media:

                      if not isinstance(
                          elemento,
                          dict
                      ):
                          continue

                      url = (
                          elemento.get("url")
                          or elemento.get("href")
                          or ""
                      )

                      if url:

                          return normalizar_url(
                              url
                          )

              except Exception:
                  pass


              # media_thumbnail
              try:

                  media = item.get(
                      "media_thumbnail",
                      []
                  )

                  for elemento in media:

                      if not isinstance(
                          elemento,
                          dict
                      ):
                          continue

                      url = (
                          elemento.get("url")
                          or ""
                      )

                      if url:

                          return normalizar_url(
                              url
                          )

              except Exception:
                  pass


              # enclosure
              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      if not isinstance(
                          enclosure,
                          dict
                      ):
                          continue

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                          or ""
                      )

                      if url:

                          return normalizar_url(
                              url
                          )

              except Exception:
                  pass


              # imagem dentro da descrição
              try:

                  html = (
                      item.get(
                          "summary",
                          ""
                      )
                      or item.get(
                          "description",
                          ""
                      )
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find(
                      "img"
                  )

                  if img:

                      url = atributos_imagem(
                          img
                      )

                      if url:

                          return normalizar_url(
                              url
                          )

              except Exception:
                  pass


              return ""


          # ========================================================
          # DATA RSS
          # ========================================================

          def data_item(item):

              try:

                  if item.get(
                      "published_parsed"
                  ):

                      return datetime(
                          *item.published_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if item.get(
                      "updated_parsed"
                  ):

                      return datetime(
                          *item.updated_parsed[:6],
                          tzinfo=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ========================================================
          # LER JSON EXISTENTE
          # ========================================================

          antigas = []


          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):

                          antigas = []


              except Exception as erro:

                  print(
                      "Erro lendo JSON:",
                      erro
                  )

                  antigas = []


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # ========================================================
          # MAPA DAS IMAGENS EXISTENTES
          # ========================================================

          imagens_antigas = {}


          for noticia in antigas:

              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          # ========================================================
          # MAPA DE NOTÍCIAS ANTIGAS
          # ========================================================

          noticias_antigas_por_titulo = {}


          for noticia in antigas:

              titulo = limpar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).lower()


              if titulo:

                  noticias_antigas_por_titulo[
                      titulo
                  ] = noticia


          # ========================================================
          # RESULTADO NOVO
          # ========================================================

          novas = []


          # ========================================================
          # BUSCAR RSS
          # ========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "========================================"
              )
              print(
                  "FONTE:",
                  fonte["nome"]
              )
              print(
                  "TIPO: RSS"
              )
              print(
                  "========================================"
              )


              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30,
                      allow_redirects=True
                  )


                  print(
                      "HTTP:",
                      resposta.status_code
                  )


                  if resposta.status_code != 200:

                      print(
                          "RSS indisponível."
                      )

                      return []


                  feed = feedparser.parse(
                      resposta.content
                  )


                  resultado = []


                  for item in feed.entries[:15]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )


                      link = str(
                          item.get(
                              "link",
                              ""
                          )
                      ).strip()


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      # ------------------------------------------------
                      # PRIMEIRO TENTA IMAGEM DO RSS
                      # ------------------------------------------------

                      imagem = imagem_do_item(
                          item
                      )


                      # ------------------------------------------------
                      # SE NÃO TEM IMAGEM,
                      # ABRE A MATÉRIA ORIGINAL
                      # ------------------------------------------------

                      link_final = link


                      if not imagem:

                          link_final, imagem = (
                              resolver_noticia(
                                  link
                              )
                          )

                      else:

                          # Mesmo com imagem no RSS,
                          # tenta descobrir URL original.
                          #
                          # Isso é importante para Google News.

                          if (
                              "news.google.com"
                              in link.lower()
                          ):

                              link_final, imagem_pagina = (
                                  resolver_noticia(
                                      link
                                  )
                              )

                              if imagem_pagina:

                                  imagem = imagem_pagina


                      # ------------------------------------------------
                      # RECUPERAR IMAGEM ANTIGA
                      # ------------------------------------------------

                      if not imagem:

                          imagem = (
                              imagens_antigas.get(
                                  link_final,
                                  ""
                              )
                              or
                              imagens_antigas.get(
                                  link,
                                  ""
                              )
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link_final
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link_final,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              data_item(
                                  item
                              ),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          "Notícia:",
                          titulo
                      )

                      print(
                          "Link:",
                          link_final
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_POR_FONTE:
                          break


                  print(
                      "Encontradas:",
                      len(resultado)
                  )


                  return resultado


              except Exception as erro:

                  print(
                      "ERRO RSS:",
                      erro
                  )

                  return []


          # ========================================================
          # BUSCAR PÁGINA
          # ========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "========================================"
              )
              print(
                  "FONTE:",
                  fonte["nome"]
              )
              print(
                  "TIPO: PÁGINA"
              )
              print(
                  "========================================"
              )


              try:

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30,
                      allow_redirects=True
                  )


                  print(
                      "HTTP:",
                      resposta.status_code
                  )


                  if resposta.status_code != 200:

                      print(
                          "Página indisponível."
                      )

                      return []


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  resultado = []

                  links_vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )


                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue


                      if len(titulo) < 25:
                          continue


                      if len(titulo) > 200:
                          continue


                      link = normalizar_url(
                          href,
                          fonte["url"]
                      )


                      if not link:
                          continue


                      if link in links_vistos:
                          continue


                      links_vistos.add(
                          link
                      )


                      # ------------------------------------------------
                      # DOMÍNIO
                      # ------------------------------------------------

                      if fonte["nome"] == "G1":

                          if (
                              "g1.globo.com"
                              not in link
                          ):
                              continue


                      if fonte["nome"] == "O Liberal":

                          if (
                              "oliberal.com"
                              not in link
                          ):
                              continue


                      # ------------------------------------------------
                      # BLOQUEIOS
                      # ------------------------------------------------

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      caminho = link.lower()


                      bloqueios = [

                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo",
                          "/colunas/"

                      ]


                      if any(
                          trecho in caminho
                          for trecho in bloqueios
                      ):
                          continue


                      # ------------------------------------------------
                      # G1
                      # ------------------------------------------------

                      if fonte["nome"] == "G1":

                          if "/noticia/" not in caminho:
                              continue


                      # ------------------------------------------------
                      # O LIBERAL
                      # ------------------------------------------------

                      if fonte["nome"] == "O Liberal":

                          secoes = [

                              "/policia/",
                              "/para/",
                              "/belem/",
                              "/amazonia/",
                              "/politica/",
                              "/economia/",
                              "/esportes/",
                              "/entretenimento/",
                              "/mundo/",
                              "/brasil/",
                              "/tecnologia/",
                              "/cultura/",
                              "/saude/",
                              "/concursos/",
                              "/cotidiano/"

                          ]


                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):
                              continue


                      # ------------------------------------------------
                      # VERIFICAR SE JÁ TEM IMAGEM
                      # ------------------------------------------------

                      imagem = (
                          imagens_antigas.get(
                              link,
                              ""
                          )
                      )


                      # ------------------------------------------------
                      # ABRIR MATÉRIA E BUSCAR IMAGEM
                      # ------------------------------------------------

                      if not imagem:

                          link_final, imagem_nova = (
                              resolver_noticia(
                                  link
                              )
                          )

                          if link_final:
                              link = link_final

                          if imagem_nova:
                              imagem = imagem_nova


                      # ------------------------------------------------
                      # SALVAR
                      # ------------------------------------------------

                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print("")
                      print(
                          "Notícia adicionada:"
                      )

                      print(
                          titulo
                      )

                      print(
                          "Link:",
                          link
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      if len(resultado) >= LIMITE_POR_FONTE:
                          break


                  print("")
                  print(
                      "Encontradas:",
                      len(resultado)
                  )


                  return resultado


              except Exception as erro:

                  print(
                      "ERRO PÁGINA:",
                      erro
                  )

                  return []


          # ========================================================
          # EXECUTAR FONTES
          # ========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_fonte = (
                      buscar_rss(
                          fonte
                      )
                  )

              else:

                  noticias_fonte = (
                      buscar_pagina(
                          fonte
                      )
                  )


              novas.extend(
                  noticias_fonte
              )


          # ========================================================
          # RECUPERAR IMAGENS DAS NOTÍCIAS ANTIGAS
          # ========================================================

          print("")
          print(
              "========================================"
          )
          print(
              "VERIFICANDO NOTÍCIAS SEM IMAGEM"
          )
          print(
              "========================================"
          )


          for noticia in novas:

              if noticia.get(
                  "imagem",
                  ""
              ).strip():

                  continue


              titulo = limpar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).lower()


              antiga = (
                  noticias_antigas_por_titulo.get(
                      titulo
                  )
              )


              if antiga:

                  imagem = str(
                      antiga.get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  if imagem:

                      noticia["imagem"] = imagem


          # ========================================================
          # COMBINAR
          # ========================================================

          todas = novas + antigas


          # ========================================================
          # REMOVER DUPLICADAS
          # ========================================================

          unicas = {}


          for noticia in todas:

              titulo = limpar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).lower()


              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip().lower()


              chave = link or titulo


              if not chave:
                  continue


              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              if chave not in unicas:

                  unicas[chave] = noticia

              else:

                  imagem_existente = str(
                      unicas[chave].get(
                          "imagem",
                          ""
                      )
                  ).strip()


                  # Sempre preferir a versão
                  # que possui imagem.

                  if (
                      not imagem_existente
                      and imagem
                  ):

                      unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # ========================================================
          # GARANTIR IMAGENS PELO LINK
          # ========================================================

          print("")
          print(
              "========================================"
          )
          print(
              "RECUPERANDO IMAGENS FALTANTES"
          )
          print(
              "========================================"
          )


          for noticia in todas:

              imagem = str(
                  noticia.get(
                      "imagem",
                      ""
                  )
              ).strip()


              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              if imagem:
                  continue


              if not link:
                  continue


              print("")
              print(
                  "Tentando recuperar imagem:"
              )

              print(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )


              link_final, imagem_nova = (
                  resolver_noticia(
                      link
                  )
              )


              if link_final:

                  noticia["link"] = (
                      link_final
                  )


              if imagem_nova:

                  noticia["imagem"] = (
                      imagem_nova
                  )


          # ========================================================
          # REMOVER NOTÍCIAS SEM TÍTULO/LINK
          # ========================================================

          filtradas = []


          for noticia in todas:

              titulo = limpar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )


              link = str(
                  noticia.get(
                      "link",
                      ""
                  )
              ).strip()


              if not titulo:
                  continue


              if not link:
                  continue


              noticia["titulo"] = titulo

              noticia["link"] = link


              filtradas.append(
                  noticia
              )


          todas = filtradas


          # ========================================================
          # ORDENAR POR DATA
          # ========================================================

          def data_ordenacao(noticia):

              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=data_ordenacao,
              reverse=True
          )


          # ========================================================
          # LIMITAR
          # ========================================================

          resultado = todas[
              :LIMITE_FINAL
          ]


          # ========================================================
          # SALVAR JSON
          # ========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================================
          # RELATÓRIO FINAL
          # ========================================================

          print("")
          print(
              "========================================"
          )
          print(
              "FINALIZADO"
          )
          print(
              "========================================"
          )

          print(
              "Notícias encontradas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print("")

          for numero, noticia in enumerate(
              resultado,
              1
          ):

              print(
                  numero,
                  "-",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "   Fonte:",
                  noticia.get(
                      "fonte",
                      ""
                  )
              )

              print(
                  "   Link:",
                  noticia.get(
                      "link",
                      ""
                  )
              )

              print(
                  "   IMAGEM:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )

              print("")


          PY


      # ============================================================
      # SALVAR NO GITHUB
      # ============================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"

          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar noticias"

            git push

          fi
