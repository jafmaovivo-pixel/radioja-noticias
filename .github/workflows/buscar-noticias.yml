name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Buscar notícias
        env:
          PYTHONUNBUFFERED: "1"
        run: |

          python3 <<'PY'

          import json
          import os
          import re
          import time
          import hashlib
          import requests
          import feedparser

          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin


          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          ARQUIVO = "noticias.json"
          LIMITE = 8

          FONTES = [

              {
                  "nome": "Diário do Pará",
                  "tipo": "rss",
                  "url": "https://diariodopara.com.br/feed/"
              },

              {
                  "nome": "O Liberal",
                  "tipo": "pagina",
                  "url": "https://www.oliberal.com/"
              },

              {
                  "nome": "G1 - O Portal",
                  "tipo": "pagina",
                  "url": "https://g1.globo.com/pa/para/"
              }

          ]


          # =========================================================
          # SESSÃO HTTP
          # =========================================================

          sessao = requests.Session()

          sessao.headers.update({

              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36",

              "Accept":
              "text/html,application/xhtml+xml,"
              "application/xml;q=0.9,image/avif,image/webp,"
              "*/*;q=0.8",

              "Accept-Language":
              "pt-BR,pt;q=0.9,en;q=0.8",

              "Cache-Control":
              "no-cache"

          })


          # =========================================================
          # LIMPAR TEXTO
          # =========================================================

          def limpar(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  texto,
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =========================================================
          # ID
          # =========================================================

          def criar_id(titulo, link):

              base = (
                  titulo.strip()
                  + "|"
                  + link.strip()
              )

              return hashlib.md5(
                  base.encode("utf-8")
              ).hexdigest()


          # =========================================================
          # DATA DO RSS
          # =========================================================

          def data_item(item):

              try:

                  if item.get("published_parsed"):

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.published_parsed
                          ),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if item.get("updated_parsed"):

                      return datetime.fromtimestamp(
                          time.mktime(
                              item.updated_parsed
                          ),
                          timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # =========================================================
          # BLOQUEIOS
          # =========================================================

          def bloqueada(titulo, link):

              texto = (
                  (titulo or "")
                  + " "
                  + (link or "")
              ).lower()

              palavras = [
                  "mixvale",
                  "mix vale"
              ]

              for palavra in palavras:

                  if palavra in texto:
                      return True

              return False


          # =========================================================
          # NORMALIZAR URL DE IMAGEM
          # =========================================================

          def normalizar_imagem(url, pagina):

              if not url:
                  return ""

              url = url.strip()

              if not url:
                  return ""

              if url.startswith("//"):
                  return "https:" + url

              if url.startswith("/"):
                  return urljoin(
                      pagina,
                      url
                  )

              if url.startswith("http://"):
                  return url.replace(
                      "http://",
                      "https://",
                      1
                  )

              if url.startswith("https://"):
                  return url

              return urljoin(
                  pagina,
                  url
              )


          # =========================================================
          # PROCURAR URL DE IMAGEM EM JSON-LD
          # =========================================================

          def imagem_jsonld(soup, pagina):

              scripts = soup.find_all(
                  "script",
                  type="application/ld+json"
              )

              for script in scripts:

                  try:

                      texto = script.string

                      if not texto:
                          continue

                      dados = json.loads(texto)

                      objetos = []

                      if isinstance(
                          dados,
                          list
                      ):
                          objetos.extend(
                              dados
                          )

                      elif isinstance(
                          dados,
                          dict
                      ):

                          objetos.append(
                              dados
                          )

                          graph = dados.get(
                              "@graph"
                          )

                          if isinstance(
                              graph,
                              list
                          ):
                              objetos.extend(
                                  graph
                              )


                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagem = obj.get(
                              "image"
                          )

                          if isinstance(
                              imagem,
                              str
                          ):

                              url = normalizar_imagem(
                                  imagem,
                                  pagina
                              )

                              if url:
                                  return url


                          if isinstance(
                              imagem,
                              dict
                          ):

                              url = (
                                  imagem.get("url")
                                  or imagem.get("contentUrl")
                                  or ""
                              )

                              url = normalizar_imagem(
                                  url,
                                  pagina
                              )

                              if url:
                                  return url


                          if isinstance(
                              imagem,
                              list
                          ):

                              for item in imagem:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      url = normalizar_imagem(
                                          item,
                                          pagina
                                      )

                                      if url:
                                          return url

                                  elif isinstance(
                                      item,
                                      dict
                                  ):

                                      url = (
                                          item.get("url")
                                          or item.get("contentUrl")
                                          or ""
                                      )

                                      url = normalizar_imagem(
                                          url,
                                          pagina
                                      )

                                      if url:
                                          return url

                  except Exception:
                      continue

              return ""


          # =========================================================
          # PROCURAR IMAGEM OG / TWITTER / HTML
          # =========================================================

          def extrair_imagem_pagina(link):

              print(
                  "Buscando imagem:",
                  link
              )

              try:

                  resposta = sessao.get(
                      link,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "HTTP matéria:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )


                  # -------------------------------------------------
                  # 1 - OG IMAGE
                  # -------------------------------------------------

                  metas = [

                      {
                          "attr": "property",
                          "value": "og:image"
                      },

                      {
                          "attr": "property",
                          "value": "og:image:url"
                      },

                      {
                          "attr": "name",
                          "value": "twitter:image"
                      },

                      {
                          "attr": "name",
                          "value": "twitter:image:src"
                      }

                  ]


                  for meta_config in metas:

                      meta = soup.find(
                          "meta",
                          attrs={
                              meta_config["attr"]:
                              meta_config["value"]
                          }
                      )

                      if meta:

                          url = (
                              meta.get("content")
                              or ""
                          )

                          url = normalizar_imagem(
                              url,
                              link
                          )

                          if url:
                              print(
                                  "Imagem encontrada:",
                                  url
                              )

                              return url


                  # -------------------------------------------------
                  # 2 - JSON-LD
                  # -------------------------------------------------

                  url = imagem_jsonld(
                      soup,
                      link
                  )

                  if url:

                      print(
                          "Imagem encontrada via JSON-LD:",
                          url
                      )

                      return url


                  # -------------------------------------------------
                  # 3 - IMAGENS DO ARTIGO
                  # -------------------------------------------------

                  article = (
                      soup.find("article")
                      or soup.find(
                          "main"
                      )
                  )

                  if article:

                      imagens = article.find_all(
                          "img"
                      )

                      for img in imagens:

                          url = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get(
                                  "data-original"
                              )
                              or img.get(
                                  "data-lazy-src"
                              )
                              or ""
                          )

                          url = normalizar_imagem(
                              url,
                              link
                          )

                          if url:

                              # Ignorar imagens pequenas
                              # ou claramente decorativas

                              largura = img.get(
                                  "width"
                              )

                              altura = img.get(
                                  "height"
                              )

                              try:

                                  if largura and int(
                                      largura
                                  ) < 200:
                                      continue

                                  if altura and int(
                                      altura
                                  ) < 150:
                                      continue

                              except Exception:
                                  pass


                              print(
                                  "Imagem encontrada no artigo:",
                                  url
                              )

                              return url


                  # -------------------------------------------------
                  # 4 - QUALQUER IMAGEM GRANDE
                  # -------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      url = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get(
                              "data-original"
                          )
                          or img.get(
                              "data-lazy-src"
                          )
                          or ""
                      )

                      url = normalizar_imagem(
                          url,
                          link
                      )

                      if url:

                          largura = img.get(
                              "width"
                          )

                          altura = img.get(
                              "height"
                          )

                          try:

                              if largura and int(
                                  largura
                              ) < 250:
                                  continue

                              if altura and int(
                                  altura
                              ) < 150:
                                  continue

                          except Exception:
                              pass


                          print(
                              "Imagem encontrada:",
                              url
                          )

                          return url


              except Exception as erro:

                  print(
                      "Erro ao obter imagem:",
                      erro
                  )

              return ""


          # =========================================================
          # IMAGEM DO ITEM RSS
          # =========================================================

          def imagem_do_item(item):

              try:

                  if hasattr(
                      item,
                      "media_content"
                  ):

                      for media in item.media_content:

                          if media.get("url"):

                              return media["url"]

              except Exception:
                  pass


              try:

                  if hasattr(
                      item,
                      "media_thumbnail"
                  ):

                      for media in item.media_thumbnail:

                          if media.get("url"):

                              return media["url"]

              except Exception:
                  pass


              try:

                  for enclosure in item.get(
                      "enclosures",
                      []
                  ):

                      url = (
                          enclosure.get("href")
                          or enclosure.get("url")
                      )

                      if url:
                          return url

              except Exception:
                  pass


              try:

                  html = (
                      item.get(
                          "summary",
                          ""
                      )
                      or item.get(
                          "description",
                          ""
                      )
                  )

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  img = soup.find(
                      "img"
                  )

                  if img:

                      return (
                          img.get("src")
                          or img.get(
                              "data-src"
                          )
                          or ""
                      )

              except Exception:
                  pass


              return ""


          # =========================================================
          # LER JSON EXISTENTE
          # =========================================================

          antigas = []

          if os.path.exists(
              ARQUIVO
          ):

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

                      antigas = dados.get(
                          "noticias",
                          []
                      )

                      if not isinstance(
                          antigas,
                          list
                      ):
                          antigas = []

              except Exception as erro:

                  print(
                      "Erro ao ler JSON:",
                      erro
                  )


          print(
              "Notícias existentes:",
              len(antigas)
          )


          # =========================================================
          # MAPA DE IMAGENS EXISTENTES
          # =========================================================

          imagens_antigas = {}

          for noticia in antigas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )

              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  .strip()
              )

              if link and imagem:

                  imagens_antigas[
                      link
                  ] = imagem


          novas = []


          # =========================================================
          # BUSCAR RSS
          # =========================================================

          def buscar_rss(fonte):

              print("")
              print(
                  "===================================="
              )
              print(
                  "Consultando:",
                  fonte["nome"]
              )
              print(
                  "===================================="
              )

              try:

                  time.sleep(2)

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=25
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:

                      print(
                          "Fonte RSS indisponível."
                      )

                      return []


                  feed = feedparser.parse(
                      resposta.content
                  )

                  resultado = []


                  for item in feed.entries[:12]:

                      titulo = limpar(
                          item.get(
                              "title",
                              ""
                          )
                      )

                      link = item.get(
                          "link",
                          ""
                      )


                      if not titulo or not link:
                          continue


                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      descricao = limpar(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  ""
                              )
                          )
                      )


                      imagem = imagem_do_item(
                          item
                      )


                      if not imagem:

                          imagem = imagens_antigas.get(
                              link,
                              ""
                          )


                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              descricao,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              data_item(
                                  item
                              ),

                          "categoria":
                              "PARÁ"

                      })


                  print(
                      "Encontradas:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "Erro RSS:",
                      erro
                  )

                  return []


          # =========================================================
          # BUSCAR PÁGINA
          # =========================================================

          def buscar_pagina(fonte):

              print("")
              print(
                  "===================================="
              )
              print(
                  "Consultando:",
                  fonte["nome"]
              )
              print(
                  "===================================="
              )

              try:

                  time.sleep(3)

                  resposta = sessao.get(
                      fonte["url"],
                      timeout=30
                  )

                  print(
                      "HTTP:",
                      resposta.status_code
                  )

                  if resposta.status_code != 200:

                      print(
                          "Página indisponível."
                      )

                      return []


                  soup = BeautifulSoup(
                      resposta.text,
                      "html.parser"
                  )

                  resultado = []

                  links_vistos = set()


                  for a in soup.find_all(
                      "a",
                      href=True
                  ):

                      titulo = limpar(
                          a.get_text(
                              " ",
                              strip=True
                          )
                      )

                      href = a.get(
                          "href",
                          ""
                      )


                      if not titulo:
                          continue


                      if len(titulo) < 25:
                          continue


                      if len(titulo) > 180:
                          continue


                      # -------------------------------------------------
                      # LINK ABSOLUTO
                      # -------------------------------------------------

                      link = urljoin(
                          fonte["url"],
                          href
                      )


                      if not (
                          link.startswith(
                              "http://"
                          )
                          or
                          link.startswith(
                              "https://"
                          )
                      ):
                          continue


                      # -------------------------------------------------
                      # DOMÍNIO
                      # -------------------------------------------------

                      if fonte["nome"] == "O Liberal":

                          if "oliberal.com" not in link:
                              continue


                      if fonte["nome"] == "G1 - O Portal":

                          if "g1.globo.com" not in link:
                              continue


                      # -------------------------------------------------
                      # EVITAR LINKS DUPLICADOS
                      # -------------------------------------------------

                      if link in links_vistos:
                          continue

                      links_vistos.add(
                          link
                      )


                      # -------------------------------------------------
                      # BLOQUEIOS
                      # -------------------------------------------------

                      if bloqueada(
                          titulo,
                          link
                      ):
                          continue


                      caminho = link.lower()


                      bloqueios = [

                          "/busca",
                          "/login",
                          "/newsletter",
                          "/videos",
                          "/video/",
                          "/webstories",
                          "/podcasts",
                          "/programas",
                          "/ao-vivo"

                      ]


                      if any(
                          trecho in caminho
                          for trecho in bloqueios
                      ):
                          continue


                      # -------------------------------------------------
                      # SOMENTE LINKS DE MATÉRIA
                      # -------------------------------------------------

                      if fonte["nome"] == "G1 - O Portal":

                          if "/noticia/" not in link:
                              continue


                      if fonte["nome"] == "O Liberal":

                          secoes = [
                              "/policia/",
                              "/para/",
                              "/belem/",
                              "/amazonia/",
                              "/politica/",
                              "/economia/",
                              "/esportes/",
                              "/entretenimento/",
                              "/mundo/",
                              "/brasil/",
                              "/tecnologia/",
                              "/cultura/",
                              "/saude/",
                              "/concursos/"
                          ]

                          if not any(
                              secao in caminho
                              for secao in secoes
                          ):
                              continue


                      # -------------------------------------------------
                      # IMAGEM EXISTENTE
                      # -------------------------------------------------

                      imagem = imagens_antigas.get(
                          link,
                          ""
                      )


                      # -------------------------------------------------
                      # BUSCAR IMAGEM NA MATÉRIA
                      # -------------------------------------------------

                      if not imagem:

                          imagem = extrair_imagem_pagina(
                              link
                          )


                      # -------------------------------------------------
                      # SALVAR
                      # -------------------------------------------------

                      resultado.append({

                          "id":
                              criar_id(
                                  titulo,
                                  link
                              ),

                          "titulo":
                              titulo,

                          "descricao":
                              titulo,

                          "link":
                              link,

                          "fonte":
                              fonte["nome"],

                          "imagem":
                              imagem,

                          "data":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),

                          "categoria":
                              "PARÁ"

                      })


                      print(
                          "Notícia adicionada:",
                          titulo
                      )

                      print(
                          "Imagem:",
                          imagem
                      )


                      # -------------------------------------------------
                      # LIMITE POR FONTE
                      # -------------------------------------------------

                      if len(resultado) >= 6:
                          break


                  print(
                      "Encontradas:",
                      len(resultado)
                  )

                  return resultado


              except Exception as erro:

                  print(
                      "Erro página:",
                      erro
                  )

                  return []


          # =========================================================
          # EXECUTAR FONTES
          # =========================================================

          for fonte in FONTES:

              if fonte["tipo"] == "rss":

                  noticias_fonte = buscar_rss(
                      fonte
                  )

              else:

                  noticias_fonte = buscar_pagina(
                      fonte
                  )


              novas.extend(
                  noticias_fonte
              )


          print("")
          print(
              "===================================="
          )

          print(
              "TOTAL DE NOVAS NOTÍCIAS:",
              len(novas)
          )

          print(
              "===================================="
          )


          # =========================================================
          # SE NENHUMA FONTE RESPONDEU
          # =========================================================

          if len(novas) == 0:

              print(
                  "Nenhuma notícia nova encontrada."
              )

              print(
                  "JSON existente preservado."
              )

              raise SystemExit(0)


          # =========================================================
          # COMBINAR
          # =========================================================

          todas = novas + antigas


          # =========================================================
          # REMOVER DUPLICADAS
          # =========================================================

          unicas = {}


          for noticia in todas:

              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
                  .lower()
              )


              chave = link or titulo


              if not chave:
                  continue


              # -------------------------------------------------
              # Se já existe uma versão com imagem,
              # preferir essa versão.
              # -------------------------------------------------

              if chave in unicas:

                  imagem_atual = (
                      unicas[chave].get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )

                  imagem_nova = (
                      noticia.get(
                          "imagem",
                          ""
                      )
                      .strip()
                  )


                  if (
                      not imagem_atual
                      and imagem_nova
                  ):

                      unicas[chave] = noticia

              else:

                  unicas[chave] = noticia


          todas = list(
              unicas.values()
          )


          # =========================================================
          # CORRIGIR IMAGENS VAZIAS
          # =========================================================

          for noticia in todas:

              link = (
                  noticia.get(
                      "link",
                      ""
                  )
                  .strip()
              )

              imagem = (
                  noticia.get(
                      "imagem",
                      ""
                  )
                  .strip()
              )


              if not imagem and link:

                  imagem_antiga = (
                      imagens_antigas.get(
                          link,
                          ""
                      )
                  )


                  if imagem_antiga:

                      noticia["imagem"] = (
                          imagem_antiga
                      )


          # =========================================================
          # ORDENAR
          # =========================================================

          def ordenar(noticia):

              return noticia.get(
                  "data",
                  ""
              )


          todas.sort(
              key=ordenar,
              reverse=True
          )


          # =========================================================
          # LIMITE
          # =========================================================

          resultado = todas[:LIMITE]


          # =========================================================
          # SALVAR
          # =========================================================

          dados_finais = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  resultado

          }


          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  dados_finais,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # RELATÓRIO
          # =========================================================

          print("")
          print(
              "===================================="
          )

          print(
              "SUCESSO!"
          )

          print(
              "Notícias novas:",
              len(novas)
          )

          print(
              "Notícias gravadas:",
              len(resultado)
          )

          print(
              "===================================="
          )


          for noticia in resultado:

              print(
                  "-",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              print(
                  "  imagem:",
                  noticia.get(
                      "imagem",
                      ""
                  )
              )


          PY


      # =========================================================
      # SALVAR NO GITHUB
      # =========================================================

      - name: Salvar notícias no GitHub
        run: |

          git config user.name "Radio JA FM"
          git config user.email "radioja-fm@users.noreply.github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit -m "Atualizar notícias com imagens"

          git push
