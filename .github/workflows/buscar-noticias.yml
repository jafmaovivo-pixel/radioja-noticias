name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR O REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos
        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import sys
          import unicodedata
          import urllib.parse
          import urllib.request
          import urllib.error

          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"

          LIMITE_FINAL = 8


          # =====================================================
          # VERIFICAR API KEY
          # =====================================================

          if not API_KEY:

              print("")
              print("========================================")
              print("ERRO: NEWSDATA_API_KEY NÃO CONFIGURADA")
              print("========================================")
              print("")

              sys.exit(1)


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu"

          ]


          # =====================================================
          # BELÉM E REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua",
              "braganca do para"

          ]


          # =====================================================
          # TERMOS QUE IDENTIFICAM O ESTADO DO PARÁ
          # =====================================================

          PARA = [

              "para",
              "paraense",
              "paraenses",
              "estado do para",
              "governo do para",
              "policia do para",
              "policia civil do para",
              "policia militar do para",
              "ministerio publico do para",
              "tribunal de justica do para",
              "assembleia legislativa do para",
              "governador do para",
              "governadora do para",
              "justica do para",
              "tse para",
              "eleicoes no para",
              "eleicoes do para"

          ]


          # =====================================================
          # OUTRAS REGIÕES / ESTADOS
          #
          # Usadas para impedir classificações incorretas.
          # =====================================================

          OUTRAS_REGIOES = [

              "bahia",
              "salvador",

              "sao paulo",

              "rio de janeiro",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceara",
              "fortaleza",

              "parana",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasilia",
              "distrito federal",

              "goias",
              "goiania",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondonia",
              "porto velho",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "vitoria",

              "santa catarina",
              "florianopolis",

              "maranhao",
              "sao luis",

              "piaui",
              "teresina",

              "paraiba",
              "joao pessoa",

              "rio grande do norte",
              "natal",

              "alagoas",
              "maceio",

              "sergipe",
              "aracaju",

              "tocantins",
              "palmas",

              "amapa",
              "macapa"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto)

              texto = texto.lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caractere
                  for caractere in texto
                  if unicodedata.category(caractere) != "Mn"
              )

              texto = texto.replace("-", " ")

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # VERIFICAR TERMO
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:
                  return False

              padrao = (
                  r"(?<![a-z0-9])"
                  + re.escape(termo)
                  + r"(?![a-z0-9])"
              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO COMPLETO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or "",

                  item.get("source_id") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # VERIFICAR NOTÍCIA BLOQUEADA
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = " ".join([

                  titulo,
                  descricao,
                  fonte

              ])


              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              if "mixvale.com.br" in link:

                  return True


              return False


          # =====================================================
          # VALIDAR NOTÍCIA
          # =====================================================

          def valido(item):

              if not item:
                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:
                  return False


              if not link:
                  return False


              if bloqueada(item):
                  return False


              return True


          # =====================================================
          # BUSCAR NOTÍCIAS NA NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta,

                  "size": 10

              }


              url = (

                  API_URL
                  + "?"
                  + urllib.parse.urlencode(
                      parametros
                  )

              )


              print("")
              print("----------------------------------------")
              print("CONSULTA:", consulta)
              print("----------------------------------------")


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/2.0",

                          "Accept":
                          "application/json"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      conteudo = (
                          resposta
                          .read()
                          .decode("utf-8")
                      )


                  dados = json.loads(
                      conteudo
                  )


                  status = dados.get(
                      "status"
                  )


                  if status == "error":

                      print("")
                      print(
                          "ERRO RETORNADO PELA NEWSDATA:"
                      )

                      print(
                          json.dumps(
                              dados,
                              ensure_ascii=False,
                              indent=2
                          )
                      )

                      return []


                  resultados = dados.get(
                      "results",
                      []
                  )


                  print(
                      "RESULTADOS RECEBIDOS:",
                      len(resultados)
                  )


                  return resultados


              except urllib.error.HTTPError as erro:

                  print("")
                  print(
                      "ERRO HTTP:",
                      erro.code
                  )


                  try:

                      corpo = (
                          erro.read()
                          .decode("utf-8")
                      )

                      print(
                          corpo
                      )

                  except Exception:
                      pass


                  return []


              except urllib.error.URLError as erro:

                  print("")
                  print(
                      "ERRO DE CONEXÃO:",
                      erro
                  )

                  return []


              except Exception as erro:

                  print("")
                  print(
                      "ERRO NA BUSCA:",
                      repr(erro)
                  )

                  return []


          # =====================================================
          # CONVERTER NOTÍCIA
          # =====================================================

          def converter(item, categoria):

              return {

                  "id":
                      item.get("article_id"),

                  "titulo":
                      item.get("title"),

                  "descricao":
                      item.get("description"),

                  "link":
                      item.get("link"),

                  "fonte":
                      item.get("source_name"),

                  "imagem":
                      item.get("image_url"),

                  "data":
                      item.get("pubDate"),

                  "categoria":
                      categoria

              }


          # =====================================================
          # VERIFICAR PERTENCIMENTO AO GRUPO
          # =====================================================

          def pertence_ao_grupo(
              item,
              termos
          ):

              texto = texto_noticia(
                  item
              )


              for termo in termos:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR OUTRA REGIÃO
          # =====================================================

          def pertence_outra_regiao(
              item
          ):

              texto = texto_noticia(
                  item
              )


              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # VERIFICAR SE REALMENTE É DO PARÁ
          # =====================================================

          def eh_para(item):

              texto = texto_noticia(
                  item
              )


              tem_para = pertence_ao_grupo(
                  item,
                  PARA
              )


              tem_outra_regiao = (
                  pertence_outra_regiao(
                      item
                  )
              )


              # -----------------------------------------------
              # Se não existe nenhuma referência ao Pará,
              # não classifica como notícia do Pará.
              # -----------------------------------------------

              if not tem_para:

                  return False


              # -----------------------------------------------
              # Se há Pará e outro estado, ainda aceitamos
              # porque pode ser uma notícia comparativa,
              # envolvendo diretamente o Pará.
              # -----------------------------------------------

              if tem_outra_regiao:

                  return True


              return True


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              '"Tomé-Açu"',


              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',


              # -----------------------------------------------
              # NORDESTE DO PARÁ
              # -----------------------------------------------

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',


              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              '"Pará"',
              '"Governo do Pará"',
              '"Polícia do Pará"',
              '"Estado do Pará"',
              '"Polícia Civil do Pará"',
              '"Polícia Militar do Pará"',
              '"Justiça do Pará"',
              '"eleições do Pará"',


              # -----------------------------------------------
              # BRASIL
              #
              # Usada somente para completar caso não existam
              # notícias suficientes do Pará.
              # -----------------------------------------------

              '"Brasil"'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          total_resultados_api = 0


          for consulta in consultas:

              resultados = buscar(
                  consulta
              )


              total_resultados_api += len(
                  resultados
              )


              for item in resultados:

                  if not valido(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:

                      continue


                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print("========================================")
          print(
              "TOTAL DE RESULTADOS DA API:",
              total_resultados_api
          )
          print(
              "TOTAL DE CANDIDATOS ÚNICOS:",
              len(candidatos)
          )
          print("========================================")


          # =====================================================
          # SE A API NÃO RETORNOU NADA
          # =====================================================

          if total_resultados_api == 0:

              print("")
              print(
                  "ERRO: A NEWSDATA NÃO RETORNOU NENHUM RESULTADO."
              )

              print(
                  "Verifique a API KEY, limite da conta ou "
                  "resposta da API acima."
              )

              sys.exit(1)


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          for item in candidatos.values():

              # -----------------------------------------------
              # 1. TOMÉ-AÇU
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # 2. BELÉM / RMB
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # 3. NORDESTE DO PARÁ
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # 4. PARÁ
              # -----------------------------------------------

              if eh_para(item):

                  para.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # 5. BRASIL
              #
              # Só entra aqui aquilo que não foi identificado
              # como notícia do Pará.
              # -----------------------------------------------

              brasil.append(
                  item
              )


          # =====================================================
          # MOSTRAR CLASSIFICAÇÃO
          # =====================================================

          print("")
          print("========================================")
          print("CLASSIFICAÇÃO")
          print("========================================")

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste do Pará:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(
              titulo
          ):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )


              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )


              return titulo.strip()


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE_FINAL:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:

                  return False


              if not titulo:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticia = converter(

                  item,

                  categoria

              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{noticia['fonte']} | "
                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          #
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              adicionar(
                  item,
                  "TOMÉ-AÇU"
              )

              if len(noticias) >= LIMITE_FINAL:

                  break


          # =====================================================
          # PRIORIDADE 2
          #
          # BELÉM / RMB
          #
          # MÁXIMO 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= LIMITE_FINAL:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1


              if contador_belem >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          #
          # NORDESTE DO PARÁ
          #
          # MÁXIMO 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= LIMITE_FINAL:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1


              if contador_nordeste >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          #
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE_FINAL:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          #
          # BRASIL
          #
          # SOMENTE COMPLETA ATÉ 8
          # =====================================================

          for item in brasil:

              if len(noticias) >= LIMITE_FINAL:

                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE_FINAL]

          }


          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO FINAL
          # =====================================================

          print("")
          print("========================================")
          print(
              "TOTAL FINAL:",
              len(noticias[:LIMITE_FINAL])
          )
          print("========================================")


          print("")


          for numero, noticia in enumerate(

              noticias[:LIMITE_FINAL],

              start=1

          ):

              print(

                  f"{numero}. "
                  f"[{noticia['categoria']}] "
                  f"{noticia['titulo']}"

              )


          # =====================================================
          # AVISO SE NÃO HOUVER NOTÍCIAS
          # =====================================================

          if not noticias:

              print("")
              print("========================================")
              print(
                  "ATENÇÃO: NENHUMA NOTÍCIA FOI SELECIONADA."
              )
              print("========================================")

              sys.exit(1)


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"


          git add noticias.json


          git diff --cached --quiet || \
            git commit -m "Atualizar notícias"


          git push
