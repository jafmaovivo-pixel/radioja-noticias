name: Buscar notícias

on:

  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"


permissions:
  contents: write


jobs:

  buscar:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # BAIXAR REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos

        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:

          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}


        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import sys
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get(
              "NEWSDATA_API_KEY"
          )

          API_URL = (
              "https://newsdata.io/api/1/latest"
          )

          ARQUIVO = "noticias.json"

          LIMITE = 8


          # =====================================================
          # VERIFICAR API KEY
          # =====================================================

          if not API_KEY:

              print(
                  "ERRO: NEWSDATA_API_KEY não encontrada."
              )

              sys.exit(1)


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu",
              "tomé-açu"

          ]


          # =====================================================
          # BELÉM / RMB
          # =====================================================

          BELEM_RMB = [

              "belem",
              "belém",

              "ananindeua",

              "marituba",

              "benevides",

              "santa izabel do para",
              "santa izabel do pará",

              "santa barbara do para",
              "santa bárbara do pará"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",

              "braganca",
              "bragança",

              "capanema",

              "salinopolis",
              "salinópolis",

              "paragominas",

              "barcarena",

              "abaetetuba",

              "cameta",
              "cametá",

              "vigia",

              "capitao poco",
              "capitão poço",

              "igarape acu",
              "igarapé-açu",

              "tracuateua"

          ]


          # =====================================================
          # PARÁ
          # =====================================================

          PARA = [

              "para",
              "pará",

              "paraense",
              "paraenses",

              "estado do para",
              "estado do pará",

              "governo do para",
              "governo do pará",

              "policia do para",
              "polícia do pará",

              "ministerio publico do para",
              "ministério público do pará",

              "tribunal de justica do para",
              "tribunal de justiça do pará",

              "assembleia legislativa do para",
              "assembleia legislativa do pará",

              "governador do para",
              "governador do pará",

              "governadora do para",
              "governadora do pará"

          ]


          # =====================================================
          # OUTROS ESTADOS
          # =====================================================

          OUTROS_ESTADOS = [

              "parana",
              "paraná",

              "sao paulo",
              "são paulo",

              "rio de janeiro",

              "minas gerais",

              "bahia",

              "pernambuco",

              "ceara",
              "ceará",

              "maranhao",
              "maranhão",

              "piaui",
              "piauí",

              "paraiba",
              "paraíba",

              "alagoas",

              "sergipe",

              "tocantins",

              "goias",
              "goiás",

              "amazonas",

              "acre",

              "rondonia",
              "rondônia",

              "amapa",
              "amapá",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "espírito santo",

              "santa catarina",

              "rio grande do sul",

              "rio grande do norte"

          ]


          # =====================================================
          # NORMALIZAR
          # =====================================================

          def normalizar(texto):

              if not texto:
                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(

                  c

                  for c in texto

                  if unicodedata.category(c) != "Mn"

              )

              texto = texto.replace(
                  "-",
                  " "
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # TERMO EXATO
          # =====================================================

          def contem(texto, termo):

              texto = normalizar(
                  texto
              )

              termo = normalizar(
                  termo
              )

              if not texto or not termo:
                  return False

              padrao = (

                  r"(?<![a-z0-9])"

                  + re.escape(termo)

                  + r"(?![a-z0-9])"

              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO COMPLETO
          # =====================================================

          def texto_noticia(item):

              return normalizar(

                  " ".join([

                      item.get("title") or "",

                      item.get("description") or "",

                      item.get("source_name") or "",

                      item.get("link") or ""

                  ])

              )


          # =====================================================
          # BLOQUEADA
          # =====================================================

          def bloqueada(item):

              texto = texto_noticia(
                  item
              )

              link = normalizar(
                  item.get("link") or ""
              )


              for termo in BLOQUEADOS:

                  if contem(
                      texto,
                      termo
                  ):

                      return True


              if "mixvale" in link:

                  return True


              return False


          # =====================================================
          # VÁLIDA
          # =====================================================

          def valida(item):

              if not item:
                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:
                  return False


              if not link:
                  return False


              if bloqueada(item):
                  return False


              return True


          # =====================================================
          # BUSCAR NA NEWSDATA
          #
          # IMPORTANTE:
          # ERRO DA API NÃO É MAIS IGNORADO.
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey":
                      API_KEY,

                  "country":
                      "br",

                  "language":
                      "pt",

                  "q":
                      consulta,

                  "removeduplicate":
                      "1"

              }


              url = (

                  API_URL

                  + "?"

                  + urllib.parse.urlencode(
                      parametros
                  )

              )


              print("")
              print(
                  "================================"
              )

              print(
                  "CONSULTA NEWSDATA:"
              )

              print(
                  consulta
              )

              print(
                  "================================"
              )


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/3.0"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      conteudo = (

                          resposta
                          .read()
                          .decode(
                              "utf-8"
                          )

                      )


                  dados = json.loads(
                      conteudo
                  )


              except Exception as erro:

                  print("")
                  print(
                      "ERRO REAL NA NEWSDATA:"
                  )

                  print(
                      erro
                  )

                  print("")

                  # NÃO APAGA O JSON EXISTENTE

                  sys.exit(1)


              status = dados.get(
                  "status"
              )


              if status != "success":

                  print("")
                  print(
                      "================================"
                  )

                  print(
                      "ERRO RETORNADO PELA NEWSDATA"
                  )

                  print(
                      "================================"
                  )

                  print(
                      json.dumps(
                          dados,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

                  print("")

                  # NÃO APAGA O JSON EXISTENTE

                  sys.exit(1)


              resultados = dados.get(
                  "results"
              )


              if not isinstance(
                  resultados,
                  list
              ):

                  print(
                      "ERRO: results não é uma lista."
                  )

                  sys.exit(1)


              print(
                  "RESULTADOS RECEBIDOS:",
                  len(resultados)
              )


              return resultados


          # =====================================================
          # CONSULTA 1
          #
          # PARÁ + CIDADES
          #
          # Uma única requisição.
          # =====================================================

          consulta_para = (

              '('

              '"Pará" OR '

              '"Belém" OR '

              '"Ananindeua" OR '

              '"Marituba" OR '

              '"Benevides" OR '

              '"Tomé-Açu" OR '

              '"Castanhal" OR '

              '"Bragança" OR '

              '"Capanema" OR '

              '"Salinópolis" OR '

              '"Paragominas" OR '

              '"Barcarena" OR '

              '"Abaetetuba" OR '

              '"Cametá" OR '

              '"Vigia" OR '

              '"Capitão Poço" OR '

              '"Igarapé-Açu" OR '

              '"Tracuateua"'

              ')'

          )


          # =====================================================
          # CONSULTA 2
          #
          # BRASIL
          #
          # Usada para completar.
          # =====================================================

          consulta_brasil = (
              "Brasil"
          )


          # =====================================================
          # COLETAR
          # =====================================================

          candidatos = {}


          # -----------------------------------------------------
          # PARÁ
          # -----------------------------------------------------

          resultados_para = buscar(
              consulta_para
          )


          for item in resultados_para:

              if not valida(item):
                  continue


              link = (
                  item.get("link") or ""
              ).strip()


              if link:

                  candidatos[link] = item


          # -----------------------------------------------------
          # BRASIL
          # -----------------------------------------------------

          resultados_brasil = buscar(
              consulta_brasil
          )


          for item in resultados_brasil:

              if not valida(item):
                  continue


              link = (
                  item.get("link") or ""
              ).strip()


              if link:

                  if link not in candidatos:

                      candidatos[link] = item


          print("")
          print(
              "TOTAL DE CANDIDATOS:",
              len(candidatos)
          )


          # =====================================================
          # CLASSIFICAÇÃO
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          def pertence(
              item,
              termos
          ):

              texto = texto_noticia(
                  item
              )


              for termo in termos:

                  if contem(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # CLASSIFICAR
          # =====================================================

          for item in candidatos.values():

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              if pertence(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # BELÉM
              # -----------------------------------------------

              if pertence(
                  item,
                  BELEM_RMB
              ):

                  belem.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # NORDESTE
              # -----------------------------------------------

              if pertence(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              texto = texto_noticia(
                  item
              )


              if pertence(
                  item,
                  PARA
              ):

                  # Não considerar uma notícia
                  # de Paraná como Pará somente
                  # porque apareceu a palavra "para".

                  if (
                      contem(
                          texto,
                          "parana"
                      )

                      or

                      contem(
                          texto,
                          "paraná"
                      )
                  ):

                      # Se existe referência explícita
                      # ao Pará também, mantém.

                      if not (
                          contem(
                              texto,
                              "pará"
                          )

                          or

                          contem(
                              texto,
                              "governo do pará"
                          )

                          or

                          contem(
                              texto,
                              "estado do pará"
                          )

                      ):

                          continue


                  para.append(
                      item
                  )

                  continue


              # -----------------------------------------------
              # BRASIL
              # -----------------------------------------------

              brasil.append(
                  item
              )


          # =====================================================
          # MONTAR RESULTADO
          # =====================================================

          noticias = []

          links_usados = set()

          titulos_usados = set()


          def titulo_normalizado(
              titulo
          ):

              titulo = normalizar(
                  titulo
              )

              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )

              return titulo.strip()


          def converter(
              item,
              categoria
          ):

              return {

                  "id":
                      item.get(
                          "article_id"
                      ),

                  "titulo":
                      item.get(
                          "title"
                      ),

                  "descricao":
                      item.get(
                          "description"
                      ),

                  "link":
                      item.get(
                          "link"
                      ),

                  "fonte":
                      item.get(
                          "source_name"
                      ),

                  "imagem":
                      item.get(
                          "image_url"
                      ),

                  "data":
                      item.get(
                          "pubDate"
                      ),

                  "categoria":
                      categoria

              }


          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= LIMITE:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:
                  return False


              if not titulo:
                  return False


              if link in links_usados:
                  return False


              if titulo in titulos_usados:
                  return False


              links_usados.add(
                  link
              )


              titulos_usados.add(
                  titulo
              )


              noticias.append(

                  converter(
                      item,
                      categoria
                  )

              )


              print(
                  f"{len(noticias)} | "
                  f"{categoria} | "
                  f"{item.get('source_name')} | "
                  f"{item.get('title')}"
              )


              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # =====================================================

          for item in tome_acu:

              adicionar(
                  item,
                  "TOMÉ-AÇU"
              )

              if len(noticias) >= LIMITE:
                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM/RMB
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in belem:

              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador += 1


              if contador >= 2:
                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE
          # MÁXIMO 2
          # =====================================================

          contador = 0


          for item in nordeste:

              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador += 1


              if contador >= 2:
                  break


          # =====================================================
          # PRIORIDADE 4
          # PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= LIMITE:
                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          # =====================================================

          for item in brasil:

              if len(noticias) >= LIMITE:
                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SEGURANÇA
          #
          # SE NÃO ENCONTROU NENHUMA NOTÍCIA,
          # NÃO SOBRESCREVER O JSON.
          # =====================================================

          if len(noticias) == 0:

              print("")
              print(
                  "================================"
              )

              print(
                  "ERRO: NENHUMA NOTÍCIA VÁLIDA."
              )

              print(
                  "O noticias.json NÃO será alterado."
              )

              print(
                  "================================"
              )

              sys.exit(1)


          # =====================================================
          # SALVAR
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:LIMITE]

          }


          with open(

              ARQUIVO,

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO
          # =====================================================

          print("")
          print(
              "================================"
          )

          print(
              "SUCESSO!"
          )

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "================================"
          )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"


          git add noticias.json


          if git diff --cached --quiet; then

            echo "Nenhuma alteração."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
