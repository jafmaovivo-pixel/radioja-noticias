name: Buscar notícias

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  buscar:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR REPOSITÓRIO
      # =====================================================

      - name: Baixar arquivos
        uses: actions/checkout@v4


      # =====================================================
      # BUSCAR NOTÍCIAS
      # =====================================================

      - name: Buscar notícias

        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone, timedelta


          # =====================================================
          # CONFIGURAÇÃO
          # =====================================================

          API_KEY = os.environ.get("NEWSDATA_API_KEY")

          API_URL = "https://newsdata.io/api/1/latest"

          LIMITE_HORAS = 24

          AGORA = datetime.now(timezone.utc)

          LIMITE_DATA = AGORA - timedelta(
              hours=LIMITE_HORAS
          )


          # =====================================================
          # VERIFICAR API KEY
          # =====================================================

          if not API_KEY:

              print("ERRO: NEWSDATA_API_KEY não encontrada.")

              raise SystemExit(1)


          # =====================================================
          # TERMOS BLOQUEADOS
          # =====================================================

          BLOQUEADOS = [

              "mix vale",
              "mixvale",
              "mixvale.com.br"

          ]


          # =====================================================
          # TOMÉ-AÇU
          # =====================================================

          TOME_ACU = [

              "tome acu",
              "tome-acu"

          ]


          # =====================================================
          # BELÉM / REGIÃO METROPOLITANA
          # =====================================================

          BELEM_RMB = [

              "belem",
              "ananindeua",
              "marituba",
              "benevides",
              "santa izabel do para",
              "santa barbara do para"

          ]


          # =====================================================
          # NORDESTE DO PARÁ
          # =====================================================

          NORDESTE_PARA = [

              "castanhal",
              "braganca",
              "capanema",
              "salinopolis",
              "paragominas",
              "barcarena",
              "abaetetuba",
              "cameta",
              "vigia",
              "capitao poco",
              "igarape acu",
              "tracuateua",
              "braganca do para"

          ]


          # =====================================================
          # TERMOS QUE IDENTIFICAM O PARÁ
          # =====================================================

          PARA = [

              "para",
              "paraense",
              "paraenses",
              "estado do para",
              "governo do para",
              "policia do para",
              "policia civil do para",
              "policia militar do para",
              "ministerio publico do para",
              "tribunal de justica do para",
              "assembleia legislativa do para",
              "governador do para",
              "governadora do para",
              "tjpa",
              "mp pa",
              "pc pa",
              "pm pa"

          ]


          # =====================================================
          # OUTROS ESTADOS / REGIÕES
          # =====================================================

          OUTRAS_REGIOES = [

              "bahia",
              "salvador",

              "sao paulo",

              "rio de janeiro",

              "minas gerais",
              "belo horizonte",

              "pernambuco",
              "recife",

              "ceara",
              "fortaleza",

              "parana",
              "curitiba",

              "rio grande do sul",
              "porto alegre",

              "brasilia",
              "distrito federal",

              "goias",
              "goiania",

              "amazonas",
              "manaus",

              "acre",
              "rio branco",

              "rondonia",
              "porto velho",

              "mato grosso",

              "mato grosso do sul",

              "espirito santo",
              "vitoria",

              "santa catarina",
              "florianopolis",

              "maranhao",
              "sao luis",

              "piaui",
              "teresina",

              "paraiba",
              "joao pessoa",

              "rio grande do norte",
              "natal",

              "alagoas",
              "maceio",

              "sergipe",
              "aracaju",

              "tocantins",
              "palmas",

              "amapa",
              "macapa",

              "paranaense",
              "paulista",
              "baiano",
              "pernambucano",
              "cearense",
              "mineiro",
              "carioca",
              "gaucho",
              "amazonense",
              "goiano",
              "maranhense",
              "capixaba",
              "catarinense"

          ]


          # =====================================================
          # TERMOS DE NOTÍCIAS NACIONAIS
          # =====================================================

          BRASIL_TERMOS = [

              "brasil",
              "brasileiro",
              "brasileira",
              "governo federal",
              "presidente da republica",
              "presidencia da republica",
              "congresso nacional",
              "senado federal",
              "camara dos deputados",
              "supremo tribunal federal",
              "stf",
              "tribunal superior eleitoral",
              "tse",
              "policia federal",
              "receita federal",
              "inss",
              "economia brasileira",
              "mercado brasileiro",
              "eleicoes 2026",
              "eleicao 2026",
              "selecao brasileira",
              "copa do mundo"

          ]


          # =====================================================
          # NORMALIZAÇÃO
          # =====================================================

          def normalizar(texto):

              if not texto:

                  return ""

              texto = str(texto).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(

                  caractere

                  for caractere in texto

                  if unicodedata.category(caractere) != "Mn"

              )

              texto = texto.replace(
                  "-",
                  " "
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # =====================================================
          # VERIFICAR TERMO
          # =====================================================

          def contem_termo(texto, termo):

              texto = normalizar(texto)

              termo = normalizar(termo)

              if not texto or not termo:

                  return False

              padrao = (

                  r"(?<![a-z0-9])"

                  + re.escape(termo)

                  + r"(?![a-z0-9])"

              )

              return re.search(
                  padrao,
                  texto
              ) is not None


          # =====================================================
          # TEXTO DA NOTÍCIA
          # =====================================================

          def texto_noticia(item):

              partes = [

                  item.get("title") or "",

                  item.get("description") or "",

                  item.get("source_name") or ""

              ]

              return normalizar(
                  " ".join(partes)
              )


          # =====================================================
          # DATA DA NOTÍCIA
          # =====================================================

          def data_noticia(item):

              data = item.get("pubDate")

              if not data:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )

              try:

                  data = data.strip()

                  if data.endswith("Z"):

                      data = data[:-1] + "+00:00"

                  dt = datetime.fromisoformat(
                      data
                  )

                  if dt.tzinfo is None:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          # =====================================================
          # NOTÍCIA RECENTE
          # =====================================================

          def noticia_recente(item):

              data = data_noticia(item)

              if data == datetime.min.replace(
                  tzinfo=timezone.utc
              ):

                  return False

              return data >= LIMITE_DATA


          # =====================================================
          # BLOQUEAR NOTÍCIA
          # =====================================================

          def bloqueada(item):

              titulo = normalizar(
                  item.get("title") or ""
              )

              descricao = normalizar(
                  item.get("description") or ""
              )

              fonte = normalizar(
                  item.get("source_name") or ""
              )

              link = normalizar(
                  item.get("link") or ""
              )

              texto = " ".join([

                  titulo,
                  descricao,
                  fonte

              ])


              for termo in BLOQUEADOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              if "mixvale.com.br" in link:

                  return True


              return False


          # =====================================================
          # NOTÍCIA VÁLIDA
          # =====================================================

          def valido(item):

              if not item:

                  return False


              titulo = (
                  item.get("title") or ""
              ).strip()


              link = (
                  item.get("link") or ""
              ).strip()


              if not titulo:

                  return False


              if not link:

                  return False


              if bloqueada(item):

                  return False


              if not noticia_recente(item):

                  return False


              return True


          # =====================================================
          # BUSCAR NEWSDATA
          # =====================================================

          def buscar(consulta):

              parametros = {

                  "apikey": API_KEY,

                  "country": "br",

                  "language": "pt",

                  "q": consulta

              }


              url = (

                  API_URL

                  + "?"

                  + urllib.parse.urlencode(
                      parametros
                  )

              )


              try:

                  requisicao = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "RadioJA-FM-News/2.0"

                      }

                  )


                  with urllib.request.urlopen(

                      requisicao,

                      timeout=30

                  ) as resposta:

                      dados = json.loads(

                          resposta
                          .read()
                          .decode("utf-8")

                      )


                  status = dados.get(
                      "status"
                  )


                  if status != "success":

                      print(
                          "API retornou:",
                          dados
                      )

                      return []


                  resultados = dados.get(
                      "results",
                      []
                  )


                  resultados = sorted(

                      resultados,

                      key=data_noticia,

                      reverse=True

                  )


                  return resultados


              except Exception as erro:

                  print(
                      "ERRO NA BUSCA:",
                      consulta,
                      erro
                  )

                  return []


          # =====================================================
          # CONVERTER PARA JSON
          # =====================================================

          def converter(item, categoria):

              return {

                  "id":
                      item.get("article_id"),

                  "titulo":
                      item.get("title"),

                  "descricao":
                      item.get("description"),

                  "link":
                      item.get("link"),

                  "fonte":
                      item.get("source_name"),

                  "imagem":
                      item.get("image_url"),

                  "data":
                      item.get("pubDate"),

                  "categoria":
                      categoria

              }


          # =====================================================
          # VERIFICAR GRUPO
          # =====================================================

          def pertence_ao_grupo(
              item,
              termos
          ):

              texto = texto_noticia(
                  item
              )


              for termo in termos:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # OUTRA REGIÃO
          # =====================================================

          def pertence_outra_regiao(item):

              texto = texto_noticia(
                  item
              )


              for termo in OUTRAS_REGIOES:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      return True


              return False


          # =====================================================
          # É NOTÍCIA DO PARÁ?
          # =====================================================

          def eh_para(item):

              texto = texto_noticia(
                  item
              )


              possui_para = pertence_ao_grupo(
                  item,
                  PARA
              )


              possui_outra = pertence_outra_regiao(
                  item
              )


              # -----------------------------------------------
              # Se fala explicitamente de outro estado
              # e não há referência ao Pará, rejeita.
              # -----------------------------------------------

              if possui_outra and not possui_para:

                  return False


              return possui_para


          # =====================================================
          # É NOTÍCIA NACIONAL?
          # =====================================================

          def eh_brasil(item):

              texto = texto_noticia(
                  item
              )


              # Se a notícia é claramente de outro estado,
              # não entra automaticamente em Brasil.
              #
              # Isso evita poluir a lista.
              # -----------------------------------------------

              possui_outro = pertence_outra_regiao(
                  item
              )


              possui_brasil = False


              for termo in BRASIL_TERMOS:

                  if contem_termo(
                      texto,
                      termo
                  ):

                      possui_brasil = True

                      break


              if not possui_brasil:

                  return False


              # Notícias explicitamente estaduais de
              # outro estado não entram como Brasil.
              # -----------------------------------------------

              if possui_outro:

                  return False


              return True


          # =====================================================
          # CONSULTAS
          # =====================================================

          consultas = [

              # TOMÉ-AÇU

              '"Tomé-Açu"',

              # BELÉM / RMB

              '"Belém"',
              '"Ananindeua"',
              '"Marituba"',
              '"Benevides"',
              '"Santa Izabel do Pará"',
              '"Santa Bárbara do Pará"',

              # NORDESTE DO PARÁ

              '"Castanhal"',
              '"Bragança"',
              '"Capanema"',
              '"Salinópolis"',
              '"Paragominas"',
              '"Barcarena"',
              '"Abaetetuba"',
              '"Cametá"',
              '"Vigia"',
              '"Capitão Poço"',
              '"Igarapé-Açu"',
              '"Tracuateua"',

              # PARÁ

              '"Pará"',
              '"governo do Pará"',
              '"polícia do Pará"',
              '"Estado do Pará"',

              # BRASIL

              '"Brasil"',
              '"governo federal"',
              '"presidente da República"',
              '"Congresso Nacional"'

          ]


          # =====================================================
          # COLETAR CANDIDATOS
          # =====================================================

          candidatos = {}


          for consulta in consultas:

              print("")
              print(
                  "========================================"
              )

              print(
                  "BUSCANDO:",
                  consulta
              )

              print(
                  "========================================"
              )


              resultados = buscar(
                  consulta
              )


              print(
                  "RESULTADOS RECEBIDOS:",
                  len(resultados)
              )


              aceitos = 0


              for item in resultados:

                  if not valido(item):

                      continue


                  link = (
                      item.get("link") or ""
                  ).strip()


                  if not link:

                      continue


                  if link not in candidatos:

                      candidatos[link] = item

                      aceitos += 1


              print(
                  "RESULTADOS VÁLIDOS:",
                  aceitos
              )


          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL DE CANDIDATOS ÚNICOS:",
              len(candidatos)
          )

          print(
              "========================================"
          )


          # =====================================================
          # CLASSIFICAR
          # =====================================================

          tome_acu = []

          belem = []

          nordeste = []

          para = []

          brasil = []


          for item in candidatos.values():

              # -----------------------------------------------
              # TOMÉ-AÇU
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  TOME_ACU
              ):

                  tome_acu.append(item)

                  continue


              # -----------------------------------------------
              # BELÉM / RMB
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  BELEM_RMB
              ):

                  belem.append(item)

                  continue


              # -----------------------------------------------
              # NORDESTE
              # -----------------------------------------------

              if pertence_ao_grupo(
                  item,
                  NORDESTE_PARA
              ):

                  nordeste.append(item)

                  continue


              # -----------------------------------------------
              # PARÁ
              # -----------------------------------------------

              if eh_para(item):

                  para.append(item)

                  continue


              # -----------------------------------------------
              # BRASIL
              # -----------------------------------------------

              if eh_brasil(item):

                  brasil.append(item)


          # =====================================================
          # ORDENAR CADA GRUPO POR DATA
          # =====================================================

          tome_acu.sort(
              key=data_noticia,
              reverse=True
          )

          belem.sort(
              key=data_noticia,
              reverse=True
          )

          nordeste.sort(
              key=data_noticia,
              reverse=True
          )

          para.sort(
              key=data_noticia,
              reverse=True
          )

          brasil.sort(
              key=data_noticia,
              reverse=True
          )


          # =====================================================
          # RELATÓRIO DA CLASSIFICAÇÃO
          # =====================================================

          print("")
          print(
              "========================================"
          )

          print(
              "CLASSIFICAÇÃO"
          )

          print(
              "========================================"
          )

          print(
              "Tomé-Açu:",
              len(tome_acu)
          )

          print(
              "Belém/RMB:",
              len(belem)
          )

          print(
              "Nordeste do Pará:",
              len(nordeste)
          )

          print(
              "Pará:",
              len(para)
          )

          print(
              "Brasil:",
              len(brasil)
          )


          # =====================================================
          # REMOVER DUPLICADAS
          # =====================================================

          titulos_usados = set()

          links_usados = set()

          noticias = []


          def titulo_normalizado(titulo):

              titulo = normalizar(
                  titulo
              )


              titulo = re.sub(
                  r"[^a-z0-9 ]",
                  "",
                  titulo
              )


              titulo = re.sub(
                  r"\s+",
                  " ",
                  titulo
              )


              return titulo.strip()


          # =====================================================
          # ADICIONAR NOTÍCIA
          # =====================================================

          def adicionar(
              item,
              categoria
          ):

              if len(noticias) >= 8:

                  return False


              link = (
                  item.get("link") or ""
              ).strip()


              titulo = titulo_normalizado(

                  item.get("title") or ""

              )


              if not link:

                  return False


              if not titulo:

                  return False


              if link in links_usados:

                  return False


              if titulo in titulos_usados:

                  return False


              links_usados.add(
                  link
              )

              titulos_usados.add(
                  titulo
              )


              noticia = converter(

                  item,

                  categoria

              )


              noticias.append(
                  noticia
              )


              print(

                  f"{len(noticias)} | "

                  f"{categoria} | "

                  f"{noticia['data']} | "

                  f"{noticia['fonte']} | "

                  f"{noticia['titulo']}"

              )


              return True


          # =====================================================
          # PRIORIDADE 1
          # TOMÉ-AÇU
          # MÁXIMO 1
          # =====================================================

          for item in tome_acu:

              if adicionar(
                  item,
                  "TOMÉ-AÇU"
              ):

                  break


          # =====================================================
          # PRIORIDADE 2
          # BELÉM / RMB
          # MÁXIMO 2
          # =====================================================

          contador_belem = 0


          for item in belem:

              if len(noticias) >= 8:

                  break


              if adicionar(
                  item,
                  "BELÉM/RMB"
              ):

                  contador_belem += 1


              if contador_belem >= 2:

                  break


          # =====================================================
          # PRIORIDADE 3
          # NORDESTE DO PARÁ
          # MÁXIMO 2
          # =====================================================

          contador_nordeste = 0


          for item in nordeste:

              if len(noticias) >= 8:

                  break


              if adicionar(
                  item,
                  "NORDESTE DO PARÁ"
              ):

                  contador_nordeste += 1


              if contador_nordeste >= 2:

                  break


          # =====================================================
          # PRIORIDADE 4
          # OUTRAS NOTÍCIAS DO PARÁ
          # =====================================================

          for item in para:

              if len(noticias) >= 8:

                  break


              adicionar(
                  item,
                  "PARÁ"
              )


          # =====================================================
          # PRIORIDADE 5
          # BRASIL
          # =====================================================

          for item in brasil:

              if len(noticias) >= 8:

                  break


              adicionar(
                  item,
                  "BRASIL"
              )


          # =====================================================
          # SALVAR JSON
          # =====================================================

          resultado = {

              "atualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "noticias":
                  noticias[:8]

          }


          with open(

              "noticias.json",

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  resultado,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


          # =====================================================
          # RELATÓRIO FINAL
          # =====================================================

          print("")
          print(
              "========================================"
          )

          print(
              "TOTAL FINAL:",
              len(noticias[:8])
          )

          print(
              "========================================"
          )


          if len(noticias) == 0:

              print("")
              print(
                  "ATENÇÃO: nenhuma notícia válida "
                  "nas últimas 24 horas."
              )

              print(
                  "O arquivo noticias.json foi "
                  "atualizado com lista vazia."
              )


          print("")


          for numero, noticia in enumerate(

              noticias[:8],

              start=1

          ):

              print(

                  f"{numero}. "

                  f"[{noticia['categoria']}] "

                  f"{noticia['data']} | "

                  f"{noticia['titulo']}"

              )


          PY


      # =====================================================
      # SALVAR NO GITHUB
      # =====================================================

      - name: Salvar notícias no GitHub

        run: |

          git config user.name "Radio J.A FM"

          git config user.email "actions@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no noticias.json."

          else

            git commit -m "Atualizar notícias"

            git push

          fi
